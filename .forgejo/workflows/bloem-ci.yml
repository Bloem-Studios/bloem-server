# Forgejo copy of .github/workflows/bloem-ci.yml, generated by scripts/ci/compare-workflows.py --write.
# Edit the GitHub workflow and regenerate; the script's docstring lists every difference.
# Bloem's CI. Silo's own .github/workflows/ci.yml calls Silo's reusable
# trusted-linux-ci.yml from Silo-Server/silo-server@main, which neither knows
# Bloem's gates nor matches the Silo revision Bloem has merged, so Bloem keeps
# that file as Silo's and skips its job outside Silo's repository. These are
# Silo's former inline jobs, adapted for Bloem, plus Bloem's own gates; see
# docs/bloem/ci.md. Bloem Image and the upstream sync merge wait on this
# workflow by name.
name: Bloem CI

on:
  # Forgejo: shadow runs on pushes to main only (docs/bloem/ci.md, "The Forgejo copy").
  push:
    branches:
      - main

concurrency:
  group: bloem-ci-${{ github.event_name }}-${{ github.ref }}
  # cancel-in-progress: ${{ github.ref_name != 'main' }} # Declined: retain main's cancellation policy.
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*
  # Pinned so a lint gate cannot change its mind between two runs of the same
  # commit. Built from source below rather than downloaded: a released binary
  # refuses to run against a Go version newer than the one it was built with,
  # and go.mod tracks Go closely enough that this repo is regularly ahead.
  GOLANGCI_LINT_VERSION: v2.15.0

# The default token is read-write. Only the cache prune job writes, and only
# to the Actions cache; every other job keeps a read-only token, which is one
# fewer thing a compromised dependency can reach.
permissions:
  contents: read

# Forgejo: each job runs on the plain label bloem-job-<kind>, the job kind named in the GitHub copy's routing
# expression. bloem-ci-runner's Forgejo controller gives each one its own VM, sized as the GitHub controller sizes
# that kind.
jobs:
  tenant-identity:
    name: Tenant identity (disposable PostgreSQL)
    runs-on: bloem-job-tenant-identity
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_tenant_test?sslmode=disable
    steps:
      # Forgejo: a host-mode runner starts no services, so the job runs the same containers itself, publishes their
      # ports on 127.0.0.1 only, and waits for their health checks, as GitHub does before the first step.
      - name: Start the service containers
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=bloem_tenant \
            -e POSTGRES_PASSWORD=invented-ci-password \
            -e POSTGRES_DB=bloem_tenant_test \
            --health-cmd "pg_isready -U bloem_tenant -d bloem_tenant_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            --shm-size=1g \
            pgvector/pgvector:pg18
          for name in postgres; do
            for _ in $(seq 300); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = starting ] || break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              docker logs "$name"
              echo "::error::Service container $name is $status."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"

      # The disposable self-hosted runners already have libvips.
      - name: Install libvips
        run: |
          pkg-config --exists vips && exit 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      # The disposable self-hosted runners start with a warm Go cache, so
      # only GitHub's runners fetch one from the Actions cache.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      # Package TestMain hooks finalize membership policy against this URL.
      # The PostgreSQL service starts empty; migrate it before those hooks run.
      - name: Prepare disposable application schema
        run: |
          make embed-stub
          DATABASE_URL="$SILO_TEST_DATABASE_URL" \
            SECRET_KEY="$(openssl rand -hex 32)" \
            go run ./cmd/silo --migrate-only

      - name: Tenant and access-group migrations
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: |
          go test ./internal/database -run 'TestTenantIdentityMigration|TestResourceTenancyMigration|TestOrganizationAccessGroupMigration|TestProfileAccessGroupRequired' -count=1 -v -timeout=30m
          go test ./internal/database -run '^TestBloemFunctionRebrandPreservesCanonicalNamesOnRollback$' -count=1 -v -timeout=30m

      - name: Profile tenant persistence
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test ./internal/userstore/pgstore -run 'TestProfileOrganizationAndAccessGroupPersistence|TestProfileAccessGroupRejectsDifferentOrganization' -count=1 -v -timeout=30m

      # The tenancy store's race tests run in the Tenant stores job.
      - name: Resource tenancy, access and policy stores
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./internal/resourcetenancy ./internal/access ./internal/policy -count=1 -v -timeout=30m

      - name: OPA tenant compatibility acceptance
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test ./internal/api -run 'TestV1TenancyCompatibility|TestOPATenantFoundationWithDisposablePostgres' -count=1 -v -timeout=30m

      # The first-setup atomicity tests create one database per case beside
      # the one SILO_INITIAL_SETUP_ATOMIC_DSN names, and skip without it.
      - name: Prepare disposable initial setup database
        env:
          POSTGRES_CONTAINER_ID: postgres
        run: docker exec "$POSTGRES_CONTAINER_ID" createdb -U bloem_tenant silo_identity_setup_ci

      - name: Initial setup atomicity
        env:
          SILO_INITIAL_SETUP_ATOMIC_DSN: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/silo_identity_setup_ci?sslmode=disable
        run: go test ./internal/api -run '^TestInitialSetup(CompetingCallers|ProfileFailureRollsBack|NoProfile)DB$' -count=1 -v -timeout=30m

      - name: Multitenant administration release gate
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
          SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_tenant_test?sslmode=disable
        run: |
          go test ./internal/api ./internal/tenancy ./internal/adminpeople ./internal/database \
            -run 'TestMultitenantAdmin|TestAdminStore|TestService|TestAdminPeopleMigrations|TestOrganizationAdminProjectionMigration' \
            -count=1 -v -timeout=30m

      # The triggers that signal the organization pages, the listener that
      # carries them, and the socket through the real router: each creates its
      # own disposable databases beside the one the URL names.
      - name: Organization live updates
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
          SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_tenant_test?sslmode=disable
        run: |
          go test -race ./internal/orglive -count=1 -v -timeout=30m
          go test ./internal/api -run '^TestOrganizationLiveAcceptance$' -count=1 -v -timeout=30m

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

      - name: Stop the service containers
        if: always()
        run: docker rm -f postgres

  # The tenancy store's race tests are most of the tenant gate's time and run
  # one after another, so four runners split them, each against its own
  # disposable PostgreSQL. scripts/ci/go-test-shard.sh deals every test to
  # exactly one shard.
  tenant-stores:
    name: Tenant stores race (${{ matrix.shard }}/4, disposable PostgreSQL)
    runs-on: bloem-job-tenant-stores
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_tenant_test?sslmode=disable
    steps:
      # Forgejo: a host-mode runner starts no services, so the job runs the same containers itself, publishes their
      # ports on 127.0.0.1 only, and waits for their health checks, as GitHub does before the first step.
      - name: Start the service containers
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=bloem_tenant \
            -e POSTGRES_PASSWORD=invented-ci-password \
            -e POSTGRES_DB=bloem_tenant_test \
            --health-cmd "pg_isready -U bloem_tenant -d bloem_tenant_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            --shm-size=1g \
            pgvector/pgvector:pg18
          for name in postgres; do
            for _ in $(seq 300); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = starting ] || break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              docker logs "$name"
              echo "::error::Service container $name is $status."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"
      - name: Install libvips
        run: |
          pkg-config --exists vips && exit 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: Prepare disposable application schema
        run: |
          make embed-stub
          DATABASE_URL="$SILO_TEST_DATABASE_URL" \
            SECRET_KEY="$(openssl rand -hex 32)" \
            go run ./cmd/silo --migrate-only

      - name: Tenancy store race tests
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
          SHARD: ${{ matrix.shard }}
        run: |
          tests=$(scripts/ci/go-test-shard.sh ./internal/tenancy 4 "$SHARD" -race)
          go test -race ./internal/tenancy -run "$tests" -count=1 -v -timeout=30m

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

      - name: Stop the service containers
        if: always()
        run: docker rm -f postgres

  native-auth:
    name: Native authentication (${{ matrix.shard }}/3, disposable PostgreSQL)
    runs-on: bloem-job-native-auth
    # internal/auth's tests run one after another; three runners split them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      # Forgejo: a host-mode runner starts no services, so the job runs the same containers itself, publishes their
      # ports on 127.0.0.1 only, and waits for their health checks, as GitHub does before the first step.
      - name: Start the service containers
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=bloem_tenant \
            -e POSTGRES_PASSWORD=invented-ci-password \
            -e POSTGRES_DB=postgres \
            --health-cmd "pg_isready -U bloem_tenant -d postgres" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            --shm-size=1g \
            pgvector/pgvector:pg18
          for name in postgres; do
            for _ in $(seq 300); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = starting ] || break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              docker logs "$name"
              echo "::error::Service container $name is $status."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"
      - name: Install libvips
        run: |
          pkg-config --exists vips && exit 0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Prepare disposable initial setup database
        env:
          POSTGRES_CONTAINER_ID: postgres
        run: docker exec "$POSTGRES_CONTAINER_ID" createdb -U bloem_tenant silo_identity_setup_ci

      - name: Native authentication unit and race tests
        env:
          SILO_INITIAL_SETUP_ATOMIC_DSN: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/silo_identity_setup_ci?sslmode=disable
          SHARD: ${{ matrix.shard }}
        # The whole race run took about ten minutes, Go's default test
        # timeout; keep the 20-minute package bound the Makefile applies.
        run: |
          tests=$(scripts/ci/go-test-shard.sh ./internal/auth 3 "$SHARD")
          go test -timeout=20m ./internal/auth -count=1 -run "$tests"
          tests=$(scripts/ci/go-test-shard.sh ./internal/auth 3 "$SHARD" -race)
          go test -race -timeout=20m ./internal/auth -count=1 -run "$tests"

      - name: Native authentication vet
        if: matrix.shard == 1
        run: go vet ./internal/auth

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

      - name: Stop the service containers
        if: always()
        run: docker rm -f postgres

  # The Go gate is three jobs so that lint, the contract checks, and the test
  # suite run side by side; each one alone is shorter than the serial job they
  # replace. They share the composite setup action under .github/actions.
  go-lint:
    name: Go lint
    runs-on: bloem-job-go-lint
    steps:
      # github.com/h2non/bimg binds libvips through cgo and pkg-config, so
      # nothing under ./... compiles without the headers. The Dockerfile
      # installs the same package in its build stage. The install needs
      # nothing from the repository, so it starts before checkout and runs in
      # the background; the setup-go action waits for it. The other Go jobs
      # reuse these steps through their anchors.
      - name: Read the libvips cache key
        if: runner.environment == 'github-hosted'
        id: libvips-cache-key
        shell: bash
        run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore the libvips packages
        if: runner.environment == 'github-hosted'
        id: libvips-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache-key.outputs.key }}

      - name: Install libvips
        shell: bash
        run: |
          : > "$RUNNER_TEMP/libvips.log"
          # The disposable private runner image already includes these headers.
          if pkg-config --exists vips; then
            echo 0 > "$RUNNER_TEMP/libvips.status"
            exit 0
          fi
          # Each log line carries its epoch time, so the log shows which part of
          # the install takes the time. The status is written only after the
          # last line is in the log. Nothing reaches the step's own output: the
          # runner holds a step open for 5 s while a background process can
          # still write to it.
          (
            set +e
            (
              set -e
              # libvips and its dependencies use the runner's official Ubuntu sources.
              test -f /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                -o Dir::Etc::sourceparts=-
              )
              if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
                mkdir -p "$RUNNER_TEMP/libvips-debs"
                apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
                # The restore has no fallback keys, so packages are present only
                # when they were saved on this runner image. apt then installs
                # them as local files without updating its package lists; if it
                # cannot, the update and install below run as usual.
                debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
                if [ -e "${debs[0]}" ]; then
                  echo "apt-get install cached"
                  if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
                    exit 0
                  fi
                fi
              fi
              echo "apt-get update"
              sudo apt-get "${apt_options[@]}" update
              echo "apt-get install"
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev
            ) 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done > "$RUNNER_TEMP/libvips.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/libvips.status"
          ) > /dev/null 2>&1 &

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # golangci-lint needs the merge base to tell this branch's lines from
          # the ones it inherited.
          fetch-depth: 0
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: lint

      # Bloem: Silo's setup action takes any Go 1.26, which on a runner can be
      # an older patch than go.mod requires (security releases land in go.mod
      # before runner images catch up). Install exactly the version go.mod names.
      - name: Use the Go patch go.mod requires
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Save the libvips packages
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && steps.libvips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache.outputs.cache-primary-key }}

      # Bloem: Silo's setup-go keeps the Go build cache on a tmpfs sized at
      # half the runner's memory. Vetting Bloem's whole tree fills it until the
      # hosted runner shuts down mid-step. Move the restored cache onto the
      # disk at the same path, so saving it still works.
      - name: Keep the Go build cache on disk
        if: runner.environment == 'github-hosted'
        run: |
          staged="$RUNNER_TEMP/go-build"
          mkdir -p "$staged"
          cp -a "$HOME/.cache/go-build/." "$staged/"
          sudo umount "$HOME/.cache/go-build"
          cp -a "$staged/." "$HOME/.cache/go-build/"
          rm -rf "$staged"
          du -sh "$HOME/.cache/go-build"

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt is required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Bloem: compile the tagged tests too. The database jobs build with
      # -tags=integration, and nothing else compiles them, so a call to a
      # removed handler would otherwise surface only there.
      - name: Vet tagged tests
        run: make vet-tagged

      # Bloem: reachable-vulnerability scan (govulncheck is a go.mod tool).
      - name: Reachable Go vulnerability scan
        run: go tool govulncheck ./...

      # Built from source (see GOLANGCI_LINT_VERSION) but only once per
      # version: the binary is cached, and so is the analysis cache that lets
      # a run over an unchanged package skip the type-check and the linters.
      # Without the second cache both lint steps below analyzed all of ./...
      # from scratch on every run, which was most of the old job's time.
      - name: Restore the golangci-lint binary
        id: golangci-lint-binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-binary-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}

      # The setup action tracks the latest Go patch, so validate cached binaries too.
      - name: Install golangci-lint
        run: |
          binary="$(go env GOPATH)/bin/golangci-lint"
          if [ -x "$binary" ] && go version -m "$binary" | awk \
            -v version="$GOLANGCI_LINT_VERSION" -v toolchain="$(go env GOVERSION)" '
              NR == 1 { built_with = ($NF == toolchain) }
              $1 == "mod" && $2 == "github.com/golangci/golangci-lint/v2" {
                correct_module = ($3 == version)
              }
              END { exit !(built_with && correct_module) }
            '; then
            echo "Using golangci-lint ${GOLANGCI_LINT_VERSION} built with $(go env GOVERSION)"
          else
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          fi

      - name: Restore the golangci-lint analysis cache
        if: runner.environment == 'github-hosted' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Restore and save the golangci-lint analysis cache
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      # Scoped to the lines this branch touched. The repo does not pass a full
      # golangci-lint run today — there are a few hundred pre-existing findings,
      # which is why the Go half of `make lint` has never been enforced — and
      # blocking every PR on a cleanup nobody has done would just get the gate
      # removed again. New and changed lines have to be clean, so the count only
      # falls from here.
      - name: Lint changed lines
        env:
          # Bloem pushes straight to main, so compare against the push's own
          # before-SHA (or the PR base) from the full history checkout already
          # fetched; this credentialless job cannot refetch the private repo.
          # Upstream sync merges are linted only on their conflict-resolution
          # lines; see the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/bloem-lint-changed-ci.sh

      # The inventory's lint rule (recovering a router from a handler) has to
      # hold over the whole tree, not only the lines a branch touched: an old
      # line folded in by a rebase is as much of a hole as a new one.
      - name: Lint router recovery full-tree
        run: make lint-router-recovery

      - name: Save the Go cache
        if: success() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

  go-verify:
    name: Go contract checks
    runs-on: bloem-job-go-verify
    steps:
      - name: Read the libvips cache key
        if: runner.environment == 'github-hosted'
        id: libvips-cache-key
        shell: bash
        run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore the libvips packages
        if: runner.environment == 'github-hosted'
        id: libvips-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache-key.outputs.key }}
      - name: Install libvips
        shell: bash
        run: |
          : > "$RUNNER_TEMP/libvips.log"
          # The disposable private runner image already includes these headers.
          if pkg-config --exists vips; then
            echo 0 > "$RUNNER_TEMP/libvips.status"
            exit 0
          fi
          # Each log line carries its epoch time, so the log shows which part of
          # the install takes the time. The status is written only after the
          # last line is in the log. Nothing reaches the step's own output: the
          # runner holds a step open for 5 s while a background process can
          # still write to it.
          (
            set +e
            (
              set -e
              # libvips and its dependencies use the runner's official Ubuntu sources.
              test -f /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                -o Dir::Etc::sourceparts=-
              )
              if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
                mkdir -p "$RUNNER_TEMP/libvips-debs"
                apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
                # The restore has no fallback keys, so packages are present only
                # when they were saved on this runner image. apt then installs
                # them as local files without updating its package lists; if it
                # cannot, the update and install below run as usual.
                debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
                if [ -e "${debs[0]}" ]; then
                  echo "apt-get install cached"
                  if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
                    exit 0
                  fi
                fi
              fi
              echo "apt-get update"
              sudo apt-get "${apt_options[@]}" update
              echo "apt-get install"
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev
            ) 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done > "$RUNNER_TEMP/libvips.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/libvips.status"
          ) > /dev/null 2>&1 &

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The contract diff compares against the PR's merge base.
          fetch-depth: 0
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: verify

      - name: Use the Go patch go.mod requires
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Save the libvips packages
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && steps.libvips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache.outputs.cache-primary-key }}

      # A manifest change that does not regenerate leaves every client reading
      # stale keys, which the contract exists to prevent.
      - name: Verify settings bindings are current
        run: make verify-settings-bindings

      # Bloem: a registered wire type that changes without regenerating leaves
      # clients compiling against a shape the server no longer emits.
      - name: Verify client DTOs are current
        run: make verify-client-dtos

      # The server defines the playback protocol and the clients prove
      # conformance against these fixtures. A contract change that does not
      # regenerate leaves every client testing against a stale body, so the
      # drift surfaces as a playback bug on three platforms rather than as a
      # failure here.
      - name: Verify playback protocol fixtures are current
        run: make verify-playback-fixtures

      # The API v2 migration needs every legacy native route accounted for
      # before anything is ported. The generator reads registration source, so
      # a route hidden behind optional dependency wiring still has to appear,
      # and a registration it cannot follow fails here rather than shrinking
      # the inventory in silence.
      - name: Verify the legacy native route inventory is current
        run: make verify-route-inventory

      # The v2 OpenAPI artifact is rendered from the Go registries and the
      # binary serves the committed bytes, so a registration change that does
      # not regenerate leaves clients reading a contract the server no longer
      # matches. This byte-compares a fresh generation.
      - name: Verify the v2 OpenAPI artifact is current
        run: make verify-apiv2-openapi

      # Bloem: the same byte comparison for the native /api/bloem/v2 document,
      # and for the API catalogue generated from it, so a document change that
      # does not regenerate both fails here.
      - name: Verify the Bloem native OpenAPI artifact is current
        run: make verify-bloem-openapi

      - name: Verify the Bloem API catalogue is current
        run: make verify-bloem-api-catalogue

      # Spec lint and the semantic diff against the PR's base. A breaking
      # change fails unless contracts/api/v2/breaking-approvals.json names
      # that exact operation, rule and fingerprint; after the LOCKED marker
      # nothing is approvable. On a push to main the base is main itself, so
      # both documents are identical and the diff tool compares nothing (an
      # approval a just-merged PR carried is not stale there); the lint still
      # runs. The base is read through the environment, as the lint step
      # does, never interpolated into the script.
      - name: Verify the v2 contract diff and spec lint
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bloem: the repository is private and the checkout keeps no
          # credentials, so this fetch sends the job token for this one call.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          make verify-apiv2-contract BASE_REF="origin/${BASE_REF}"

      # The v2 fixtures are generated through the real router and every body
      # is validated against the committed OpenAPI schema its index names, so
      # a client testing against them tests against what the server sends.
      - name: Verify the v2 contract fixtures are current and valid
        run: make verify-apiv2-fixtures

      # Bloem: contracts/seams.txt lists the only Silo-owned files Bloem may
      # touch. The comparison needs Silo's main line, which checkout does not
      # create.
      - name: Fetch upstream for seam comparison
        run: |
          git remote add upstream https://github.com/Silo-Server/silo-server.git
          git fetch upstream main

      - name: Verify the seam ledger covers Silo-file changes
        run: make verify-seams

      # Bloem: Silo always wins. Fails when Bloem overrides a Silo line that
      # contracts/silo-line-changes.json does not record, including a Silo
      # line a merge changed under an existing Bloem override.
      - name: Verify Bloem overrides no new Silo line
        run: make verify-silo-lines

      # Bloem: no Bloem line may name Silo's retired v1 API or Bloem's
      # retired v1 API (scripts/bloem/verify-no-v1.py).
      - name: Verify no Bloem line names a retired API
        run: make verify-no-v1

      - name: Verify the local gate runs every CI command
        run: make verify-local-gate

      - name: Verify the Go test shards can leave Silo's database-list tests to the pins job
        run: make verify-db-list-skip

      - name: Verify the Go test shards' retried tests
        run: make verify-retried-tests

      - name: Save the Go cache
        if: success() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

  # Go test, Go database pins and Go database regressions were one job. Each
  # now prepares its own PostgreSQL, so together they take about as long as
  # the longest of them.
  go-test:
    name: Go test (${{ matrix.shard }}/4)
    runs-on: bloem-job-go-test
    # make test-go's packages are dealt to four shards, each with its own
    # PostgreSQL and at most four packages on it at once, as on GitHub's
    # 4-core runners. Sixteen at once on one database made packages collide
    # on the shared membership policy (SQLSTATE 23514 in entitlements and
    # catalog).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_test?sslmode=disable
    steps:
      # Forgejo: a host-mode runner starts no services, so the job runs the same containers itself, publishes their
      # ports on 127.0.0.1 only, and waits for their health checks, as GitHub does before the first step.
      - name: Start the service containers
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=bloem_tenant \
            -e POSTGRES_PASSWORD=invented-ci-password \
            -e POSTGRES_DB=bloem_test \
            --health-cmd "pg_isready -U bloem_tenant -d bloem_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            --shm-size=1g \
            pgvector/pgvector:pg18
          for name in postgres; do
            for _ in $(seq 300); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = starting ] || break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              docker logs "$name"
              echo "::error::Service container $name is $status."
              exit 1
            fi
          done

      - name: Read the libvips cache key
        if: runner.environment == 'github-hosted'
        id: libvips-cache-key
        shell: bash
        run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore the libvips packages
        if: runner.environment == 'github-hosted'
        id: libvips-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache-key.outputs.key }}
      - name: Install libvips
        shell: bash
        run: |
          : > "$RUNNER_TEMP/libvips.log"
          # The disposable private runner image already includes these headers.
          if pkg-config --exists vips; then
            echo 0 > "$RUNNER_TEMP/libvips.status"
            exit 0
          fi
          # Each log line carries its epoch time, so the log shows which part of
          # the install takes the time. The status is written only after the
          # last line is in the log. Nothing reaches the step's own output: the
          # runner holds a step open for 5 s while a background process can
          # still write to it.
          (
            set +e
            (
              set -e
              # libvips and its dependencies use the runner's official Ubuntu sources.
              test -f /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                -o Dir::Etc::sourceparts=-
              )
              if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
                mkdir -p "$RUNNER_TEMP/libvips-debs"
                apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
                # The restore has no fallback keys, so packages are present only
                # when they were saved on this runner image. apt then installs
                # them as local files without updating its package lists; if it
                # cannot, the update and install below run as usual.
                debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
                if [ -e "${debs[0]}" ]; then
                  echo "apt-get install cached"
                  if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
                    exit 0
                  fi
                fi
              fi
              echo "apt-get update"
              sudo apt-get "${apt_options[@]}" update
              echo "apt-get install"
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev
            ) 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done > "$RUNNER_TEMP/libvips.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/libvips.status"
          ) > /dev/null 2>&1 &
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: test

      - name: Use the Go patch go.mod requires
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Silo's setup-go keeps the Go build cache on a tmpfs sized at half the
      # runner's memory (about 8 GB). Bloem's suite, with its plugin fixtures
      # and storage builds, grows the cache past that and fails with "no space
      # left on device" while the disk is mostly empty. Move the restored cache
      # onto the disk at the same path, so saving it still works.
      - name: Keep the Go build cache on disk
        if: runner.environment == 'github-hosted'
        run: |
          staged="$RUNNER_TEMP/go-build"
          mkdir -p "$staged"
          cp -a "$HOME/.cache/go-build/." "$staged/"
          sudo umount "$HOME/.cache/go-build"
          cp -a "$staged/." "$HOME/.cache/go-build/"
          rm -rf "$staged"
          du -sh "$HOME/.cache/go-build"

      - name: Save the libvips packages
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && steps.libvips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache.outputs.cache-primary-key }}

      # Bloem: the native audio and video tests generate fixtures with real
      # FFmpeg and fail without it. The script explains the pinned build.
      - name: Install FFmpeg
        run: scripts/ci/bloem-install-test-tools.sh ffmpeg

      # Runs the settings-contract gate among everything else: the embedded
      # manifest must parse, satisfy its own schema, hold every structural
      # invariant, and agree with the live settings registry on keys and
      # defaults. Without this job those tests exist but never run.
      # Bloem: migrate the shared test database, finalize the membership
      # policy authority, and install the test-only fixture-compatibility
      # triggers (internal/bloemtestdb; never a migration) so upstream Silo
      # fixtures run unedited against the tenancy schema. make test-go-shard repeats
      # this idempotently.
      # The parallel suite migrates many disposable databases at once; the
      # stock lock table (64 locks x 100 connections) runs out of shared
      # memory under that load. The databases are disposable, so they also
      # skip flushing to disk and add no sync load of their own: tests with
      # short file-sync deadlines (TestSwapCleanupHasADeadline's 200 ms
      # cleanup, TestOpenLocalFencesSharedOperationalStore's 1 s resumed
      # write) missed them while the runners' disk was busy, and disk-heavy
      # packages ran up to twelve times slower than usual.
      # Services take no server flags, so set them and restart.
      - name: Size the test PostgreSQL for the parallel suite
        env:
          POSTGRES_CONTAINER_ID: postgres
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 512" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$POSTGRES_CONTAINER_ID"
          until docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U bloem_tenant -d bloem_test; do sleep 1; done
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test -Atc "SHOW max_locks_per_transaction" -c "SHOW fsync"

      - name: Prepare Go test databases
        run: |
          make embed-stub
          go run ./cmd/bloem-testdb

      # Compiles every package on the way, so there is no separate build step.
      # This job prepares a fresh database; cached results cannot prove its state.
      - name: Test
        env:
          GOFLAGS: -count=1 -p=4
          SHARD: ${{ matrix.shard }}
        run: |
          # Bloem: one synced 1 MiB write took 0.2-0.45 s on the disposable
          # runners' /tmp, so Silo tests with short file-sync deadlines
          # (TestSwapCleanupHasADeadline's 200 ms cleanup) missed them. Put
          # the tests' temporary files on a RAM-backed tmpfs when one has room,
          # as the local gate's /tmp usually is; Go's build files stay on disk.
          # The probe prints where they live and one synced write's time.
          probe() {
            echo "temp dir $1 on $(findmnt -no FSTYPE -T "$1" || echo unknown)"
            dd if=/dev/zero of="$1/bloem-sync-probe" bs=1M count=1 oflag=dsync 2>&1 | tail -n 1 || true
            rm -f "$1/bloem-sync-probe"
          }
          probe "${TMPDIR:-/tmp}"
          shm_free_kb=$(df -k --output=avail /dev/shm 2>/dev/null | tail -n 1 | tr -d ' ' || true)
          if [ "$(findmnt -no FSTYPE -T /dev/shm 2>/dev/null || true)" = tmpfs ] && [ "${shm_free_kb:-0}" -ge 4194304 ]; then
            export GOTMPDIR="$RUNNER_TEMP/go-tmp" TMPDIR=/dev/shm/bloem-go-test
            mkdir -p "$GOTMPDIR"
            mkdir -p -m 755 "$TMPDIR"
            probe "$TMPDIR"
          else
            echo "no tmpfs with 4 GiB free at /dev/shm; test temp files stay on disk"
          fi
          packages=$(make -s --no-print-directory go-test-packages | scripts/ci/deal.sh 4 "$SHARD")
          # Silo's database-list tests run in Go database pins on a fresh
          # database, as Silo runs them; scripts/ci/bloem-db-list-skip.py says why.
          skip=$(python3 scripts/ci/bloem-db-list-skip.py)
          # The tests in scripts/ci/bloem-retried-tests.txt fail only under
          # the shards' load: the suite skips them, then each runs on its own
          # with up to two retries and still has to pass once.
          retried=$(python3 scripts/ci/bloem-retried-tests.py skip)
          status=0
          GOFLAGS="$GOFLAGS -skip=$skip|$retried" make test-go-shard GO_TEST_PACKAGES="$(paste -sd ' ' <<< "$packages")" || status=$?
          python3 scripts/ci/bloem-retried-tests.py run $packages || status=$?
          exit $status

      - name: Save the Go cache
        if: ${{ !cancelled() && matrix.shard == 1 && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}
          module-cache-key: ${{ steps.setup-go.outputs.module-cache-key }}
          module-cache-hit: ${{ steps.setup-go.outputs.module-cache-hit }}

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

      - name: Stop the service containers
        if: always()
        run: docker rm -f postgres

  go-db-pins:
    name: Go database pins
    runs-on: bloem-job-go-db-pins
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_test?sslmode=disable
    steps:
      # Forgejo: a host-mode runner starts no services, so the job runs the same containers itself, publishes their
      # ports on 127.0.0.1 only, and waits for their health checks, as GitHub does before the first step.
      - name: Start the service containers
        run: |
          docker run -d --name postgres \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=bloem_tenant \
            -e POSTGRES_PASSWORD=invented-ci-password \
            -e POSTGRES_DB=bloem_test \
            --health-cmd "pg_isready -U bloem_tenant -d bloem_test" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            --shm-size=1g \
            pgvector/pgvector:pg18
          for name in postgres; do
            for _ in $(seq 300); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = starting ] || break
              sleep 1
            done
            if [ "$status" != healthy ]; then
              docker logs "$name"
              echo "::error::Service container $name is $status."
              exit 1
            fi
          done

      - name: Read the libvips cache key
        if: runner.environment == 'github-hosted'
        id: libvips-cache-key
        shell: bash
        run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore the libvips packages
        if: runner.environment == 'github-hosted'
        id: libvips-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache-key.outputs.key }}
      - name: Install libvips
        shell: bash
        run: |
          : > "$RUNNER_TEMP/libvips.log"
          # The disposable private runner image already includes these headers.
          if pkg-config --exists vips; then
            echo 0 > "$RUNNER_TEMP/libvips.status"
            exit 0
          fi
          # Each log line carries its epoch time, so the log shows which part of
          # the install takes the time. The status is written only after the
          # last line is in the log. Nothing reaches the step's own output: the
          # runner holds a step open for 5 s while a background process can
          # still write to it.
          (
            set +e
            (
              set -e
              # libvips and its dependencies use the runner's official Ubuntu sources.
              test -f /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                -o Dir::Etc::sourceparts=-
              )
              if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
                mkdir -p "$RUNNER_TEMP/libvips-debs"
                apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
                # The restore has no fallback keys, so packages are present only
                # when they were saved on this runner image. apt then installs
                # them as local files without updating its package lists; if it
                # cannot, the update and install below run as usual.
                debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
                if [ -e "${debs[0]}" ]; then
                  echo "apt-get install cached"
                  if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
                    exit 0
                  fi
                fi
              fi
              echo "apt-get update"
              sudo apt-get "${apt_options[@]}" update
              echo "apt-get install"
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev
            ) 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done > "$RUNNER_TEMP/libvips.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/libvips.status"
          ) > /dev/null 2>&1 &
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Forgejo: build where the job VM's template warmed Go's caches. Go's build cache keys a package by its directory,
      # and the runner gives every job a new random workspace, so the checkout moves to the path the template built at
      # and the workspace becomes a link to it. Every later step, actions included, then works in that directory.
      - name: Move the checkout to the warm build path
        run: |
          warm=/opt/actions-runner/_work/bloem-server/bloem-server
          cd /
          mkdir -p "${warm%/*}"
          rm -rf "$warm"
          mv "$GITHUB_WORKSPACE" "$warm"
          ln -s "$warm" "$GITHUB_WORKSPACE"
          # Counted again in the last step: the entries a job adds are its build cache misses.
          cache=${GOCACHE:-$HOME/.cache/go-build}
          find "$cache" -type f -name '*-a' 2> /dev/null | wc -l > "$RUNNER_TEMP/go-cache-before"
          touch "$RUNNER_TEMP/go-cache-start"
      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: test
      - name: Use the Go patch go.mod requires
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Keep the Go build cache on disk
        if: runner.environment == 'github-hosted'
        run: |
          staged="$RUNNER_TEMP/go-build"
          mkdir -p "$staged"
          cp -a "$HOME/.cache/go-build/." "$staged/"
          sudo umount "$HOME/.cache/go-build"
          cp -a "$staged/." "$HOME/.cache/go-build/"
          rm -rf "$staged"
          du -sh "$HOME/.cache/go-build"
      - name: Install FFmpeg
        run: scripts/ci/bloem-install-test-tools.sh ffmpeg
      - name: Size the test PostgreSQL for the parallel suite
        env:
          POSTGRES_CONTAINER_ID: postgres
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 512" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$POSTGRES_CONTAINER_ID"
          until docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U bloem_tenant -d bloem_test; do sleep 1; done
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test -Atc "SHOW max_locks_per_transaction" -c "SHOW fsync"
      - name: Prepare Go test databases
        run: |
          make embed-stub
          go run ./cmd/bloem-testdb

      - name: Upstream database regression gates
        run: |
          # Every database pin, as the test-db-pins target runs them, except
          # that the pins also listed in scripts/ci/bloem-retried-tests.txt
          # (Silo tests that fail only under this job's load) run afterwards,
          # each alone, with up to two retries.
          python3 scripts/ci/bloem-retried-tests.py db-pins
          go test -race -count=1 -run '^TestMarkerContributionClaimsByTargetMigrationPostgres$' ./migrations/
          go test -race -count=1 -run '^TestUpsertTasteClusters.*Postgres$' ./internal/recommendations/
          go test -race -count=1 -run '^TestCompatDetailServiceResolvesViewerSubtitleDefaultsPostgres$' ./cmd/silo/
          go test -race -count=1 -run '^(TestImageCacheCleanup|TestRequeuedImageCacheCleanup|TestJobOutcomeIsRecorded)' ./internal/adminjob/

      # Forgejo: how much of the template's warm Go build cache this job used. Go touches an entry older than an hour
      # when it reads it, and the template's entries are older, so entries newer than the start that the job did not add
      # are hits.
      - name: Report the Go build cache
        if: always()
        run: |
          cache=${GOCACHE:-$HOME/.cache/go-build}
          if command -v go > /dev/null; then echo "Go builds in $(dirname "$(go env GOMOD)")"; fi
          before=$(cat "$RUNNER_TEMP/go-cache-before" 2> /dev/null || echo 0)
          after=$(find "$cache" -type f -name '*-a' 2> /dev/null | wc -l)
          newer=$(find "$cache" -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" 2> /dev/null | wc -l)
          echo "GOCACHE $cache: $before action entries at the start, $after at the end"
          echo "misses (entries added): $((after - before)), hits (older entries read): $((newer - (after - before)))"

      - name: Stop the service containers
        if: always()
        run: docker rm -f postgres

