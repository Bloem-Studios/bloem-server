name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Integration branch for the API v2 program (#135). Stacked PRs merge
      # here first; the merge commits need the same gate as main.
      - apiv2
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOPRIVATE: github.com/Silo-Server/*
  GONOSUMDB: github.com/Silo-Server/*
  # Pinned so a lint gate cannot change its mind between two runs of the same
  # commit. Built from source below rather than downloaded: a released binary
  # refuses to run against a Go version newer than the one it was built with,
  # and go.mod tracks Go closely enough that this repo is regularly ahead.
  GOLANGCI_LINT_VERSION: v2.12.2

# The default token is read-write. Only the cache prune job writes, and only
# to the Actions cache; every other job keeps a read-only token, which is one
# fewer thing a compromised dependency can reach.
permissions:
  contents: read

jobs:
  prune-go-caches:
    name: Prune old Go caches
    if: ${{ github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep the newest cache for each Go job and the shared modules
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Paginate so pruning covers every cache on this ref, even above the CLI's default list limit.
          gh api --paginate -X GET "repos/$GH_REPO/actions/caches" \
            -f ref="$GITHUB_REF" -f per_page=100 \
            --jq '.actions_caches[] | {id, key, ref, createdAt: .created_at}' > "$RUNNER_TEMP/go-caches.json"
          cache_ids="$(jq -sr --arg ref "$GITHUB_REF" '
            map(select(.ref == $ref) | . + {
              prefix: (.key | capture("^(?<prefix>go-(lint|verify|test|scenarios|mod)-)").prefix)
            })
            | group_by(.prefix)[]
            | sort_by(.createdAt, .id) | reverse
            | .[1:][] | .id
          ' "$RUNNER_TEMP/go-caches.json")"
          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            echo "Deleting Go cache: $cache_id"
            gh cache delete "$cache_id"
          done <<< "$cache_ids"

  tenant-identity:
    name: Tenant identity (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bloem_tenant
          POSTGRES_PASSWORD: invented-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloem_tenant -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=1g
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Package TestMain hooks finalize membership policy against this URL.
      # The PostgreSQL service starts empty; migrate it before those hooks run.
      - name: Prepare disposable application schema
        run: |
          make embed-stub
          DATABASE_URL="$SILO_TEST_DATABASE_URL" \
            SECRET_KEY="$(openssl rand -hex 32)" \
            go run ./cmd/silo --migrate-only

      - name: Tenant and access-group migrations
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: |
          go test ./internal/database -run 'TestTenantIdentityMigration|TestResourceTenancyMigration|TestOrganizationAccessGroupMigration|TestProfileAccessGroupRequired' -count=1 -v -timeout=30m
          go test ./internal/database -run '^TestBloemFunctionRebrandPreservesCanonicalNamesOnRollback$' -count=1 -v -timeout=30m

      - name: Profile tenant persistence
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test ./internal/userstore/pgstore -run 'TestProfileOrganizationAndAccessGroupPersistence|TestProfileAccessGroupRejectsDifferentOrganization' -count=1 -v -timeout=30m

      - name: Tenant resource and policy stores
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./internal/tenancy ./internal/resourcetenancy ./internal/access ./internal/policy -count=1 -v -timeout=30m

      - name: OPA tenant compatibility acceptance
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test ./internal/api -run 'TestV1TenancyCompatibility|TestOPATenantFoundationWithDisposablePostgres' -count=1 -v -timeout=30m

      - name: Multitenant administration release gate
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
          SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test ./internal/api ./internal/tenancy ./internal/adminpeople ./internal/database \
            -run 'TestMultitenantAdmin|TestAdminStore|TestService|TestAdminPeopleMigrations|TestOrganizationAdminProjectionMigration' \
            -count=1 -v -timeout=30m

  compat-foundation:
    name: Compatibility foundation (disposable PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bloem_tenant
          POSTGRES_PASSWORD: invented-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloem_tenant -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=1g
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare disposable application schema
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          make embed-stub
          DATABASE_URL="$SILO_TEST_DATABASE_URL" \
            SECRET_KEY="$(openssl rand -hex 32)" \
            go run ./cmd/silo --migrate-only
          docker exec "$POSTGRES_CONTAINER_ID" createdb -U bloem_tenant silo_identity_setup_ci

      # SILO_REQUIRE_TEST_DATABASE is set only on this step: every other test
      # in the job (and every other job in this workflow) still skips itself
      # cleanly when no disposable database is configured, and this is the
      # one selector required to prove the foundation end to end.
      - name: Foundation acceptance (enrollment, routing, identity, revocation)
        env:
          SILO_REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration ./internal/acceptance -run TestCompatibilityFoundation -count=1 -v -timeout=30m

      - name: Compatibility package unit and race tests
        env:
          SILO_INITIAL_SETUP_ATOMIC_DSN: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/silo_identity_setup_ci?sslmode=disable
        run: |
          go test ./internal/auth ./internal/compatapp ./internal/compatapi ./internal/compatgateway -count=1
          go test -race ./internal/auth ./internal/compatapp ./internal/compatapi ./internal/compatgateway -count=1

      - name: Compatibility package vet
        run: go vet ./internal/auth ./internal/compatapp ./internal/compatapi ./internal/compatgateway

  compat-compose-structural-scan:
    name: Compatibility Compose structural scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Default-deny render/diff scan over every supported Compose file
      # combination: service set, service keys, top-level networks/volumes/
      # secrets/configs, and value-level checks on image/ports/networks/
      # volumes/secrets/security_opt/environment. See the script header for
      # the full ruling and why the checks are allowlists rather than a
      # denylist. docker and the Compose plugin are preinstalled on
      # ubuntu-latest; the scan only renders configurations, it never starts
      # a container, network, or volume.
      - name: Structural scan self-test (the scan must actually detect violations)
        run: bash scripts/verify-compat-compose_test.sh

      - name: Structural scan (committed defaults and, if present, .env)
        run: bash scripts/verify-compat-compose.sh .

  # The Go gate is three jobs so that lint, the contract checks, and the test
  # suite run side by side; each one alone is shorter than the serial job they
  # replace. They share the composite setup action under .github/actions.
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      # github.com/h2non/bimg binds libvips through cgo and pkg-config, so
      # nothing under ./... compiles without the headers. The Dockerfile
      # installs the same package in its build stage. The install needs
      # nothing from the repository, so it starts before checkout and runs in
      # the background; the setup-go action waits for it. The other Go jobs
      # reuse these steps through their anchors.
      - &libvips-cache-key
        name: Read the libvips cache key
        if: runner.environment == 'github-hosted'
        id: libvips-cache-key
        shell: bash
        run: echo "key=libvips-dev-${ImageOS:?}-${ImageVersion:?}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - &libvips-restore
        name: Restore the libvips packages
        if: runner.environment == 'github-hosted'
        id: libvips-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache-key.outputs.key }}

      - &libvips-install
        name: Install libvips
        shell: bash
        run: |
          : > "$RUNNER_TEMP/libvips.log"
          # The disposable private runner image already includes these headers.
          if pkg-config --exists vips; then
            echo 0 > "$RUNNER_TEMP/libvips.status"
            exit 0
          fi
          # Each log line carries its epoch time, so the log shows which part of
          # the install takes the time. The status is written only after the
          # last line is in the log. Nothing reaches the step's own output: the
          # runner holds a step open for 5 s while a background process can
          # still write to it.
          (
            set +e
            (
              set -e
              # libvips and its dependencies use the runner's official Ubuntu sources.
              test -f /etc/apt/sources.list.d/ubuntu.sources
              apt_options=(
                -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
                -o Dir::Etc::sourceparts=-
              )
              if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
                mkdir -p "$RUNNER_TEMP/libvips-debs"
                apt_options+=(-o "Dir::Cache::archives=$RUNNER_TEMP/libvips-debs")
                # The restore has no fallback keys, so packages are present only
                # when they were saved on this runner image. apt then installs
                # them as local files without updating its package lists; if it
                # cannot, the update and install below run as usual.
                debs=("$RUNNER_TEMP"/libvips-debs/*.deb)
                if [ -e "${debs[0]}" ]; then
                  echo "apt-get install cached"
                  if sudo apt-get "${apt_options[@]}" install -y --no-install-recommends --no-download "${debs[@]}"; then
                    exit 0
                  fi
                fi
              fi
              echo "apt-get update"
              sudo apt-get "${apt_options[@]}" update
              echo "apt-get install"
              sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libvips-dev
            ) 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$EPOCHREALTIME" "$line"; done > "$RUNNER_TEMP/libvips.log"
            echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/libvips.status"
          ) > /dev/null 2>&1 &

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # golangci-lint needs the merge base to tell this branch's lines from
          # the ones it inherited.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: lint

      - &libvips-save
        name: Save the libvips packages
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request' && steps.libvips-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libvips-debs/*.deb
          key: ${{ steps.libvips-cache.outputs.cache-primary-key }}

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt is required on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Bloem: reachable-vulnerability scan (govulncheck is a go.mod tool).
      - name: Reachable Go vulnerability scan
        run: go tool govulncheck ./...

      # Built from source (see GOLANGCI_LINT_VERSION) but only once per
      # version: the binary is cached, and so is the analysis cache that lets
      # a run over an unchanged package skip the type-check and the linters.
      # Without the second cache both lint steps below analyzed all of ./...
      # from scratch on every run, which was most of the old job's time.
      - name: Restore the golangci-lint binary
        id: golangci-lint-binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: golangci-lint-binary-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ hashFiles('go.mod') }}

      # The setup action tracks the latest Go patch, so validate cached binaries too.
      - name: Install golangci-lint
        run: |
          binary="$(go env GOPATH)/bin/golangci-lint"
          if [ -x "$binary" ] && go version -m "$binary" | awk \
            -v version="$GOLANGCI_LINT_VERSION" -v toolchain="$(go env GOVERSION)" '
              NR == 1 { built_with = ($NF == toolchain) }
              $1 == "mod" && $2 == "github.com/golangci/golangci-lint/v2" {
                correct_module = ($3 == version)
              }
              END { exit !(built_with && correct_module) }
            '; then
            echo "Using golangci-lint ${GOLANGCI_LINT_VERSION} built with $(go env GOVERSION)"
          else
            go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          fi

      - name: Restore the golangci-lint analysis cache
        if: runner.environment == 'github-hosted' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      - name: Restore and save the golangci-lint analysis cache
        if: runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-cache-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-

      # Scoped to the lines this branch touched. The repo does not pass a full
      # golangci-lint run today — there are a few hundred pre-existing findings,
      # which is why the Go half of `make lint` has never been enforced — and
      # blocking every PR on a cleanup nobody has done would just get the gate
      # removed again. New and changed lines have to be clean, so the count only
      # falls from here.
      - name: Lint changed lines
        env:
          # Bloem pushes straight to main, so compare against the push's own
          # before-SHA (or the PR base) from the full history checkout already
          # fetched; this credentialless job cannot refetch the private repo.
          # Upstream sync merges are linted only on their conflict-resolution
          # lines; see the script.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/bloem-lint-changed-ci.sh

      # The inventory's lint rule (recovering a router from a handler) has to
      # hold over the whole tree, not only the lines a branch touched: an old
      # line folded in by a rebase is as much of a hole as a new one.
      - name: Lint router recovery full-tree
        run: make lint-router-recovery

      - name: Save the Go cache
        if: success() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}

  go-verify:
    name: Go contract checks
    runs-on: ubuntu-latest
    steps:
      - *libvips-cache-key
      - *libvips-restore
      - *libvips-install

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The contract diff compares against the PR's merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: verify

      - *libvips-save

      # A manifest change that does not regenerate leaves every client reading
      # stale keys, which the contract exists to prevent.
      - name: Verify settings bindings are current
        run: make verify-settings-bindings

      # Bloem: a registered wire type that changes without regenerating leaves
      # clients compiling against a shape the server no longer emits.
      - name: Verify client DTOs are current
        run: make verify-client-dtos

      # The server defines the playback protocol and the clients prove
      # conformance against these fixtures. A contract change that does not
      # regenerate leaves every client testing against a stale body, so the
      # drift surfaces as a playback bug on three platforms rather than as a
      # failure here.
      - name: Verify playback protocol fixtures are current
        run: make verify-playback-fixtures

      # The API v2 migration needs every legacy native route accounted for
      # before anything is ported. The generator reads registration source, so
      # a route hidden behind optional dependency wiring still has to appear,
      # and a registration it cannot follow fails here rather than shrinking
      # the inventory in silence.
      - name: Verify the legacy native route inventory is current
        run: make verify-route-inventory

      # Every inventoried route needs a migration decision before v2 work
      # ports it. The ledger is schema-checked and reconciled against the
      # inventory one-to-one, so a new route without a ledger entry, or a
      # stale entry for a removed route, fails here.
      - name: Verify the v2 migration ledger covers the route inventory
        run: make verify-migration-ledger

      # Every tier-1 row in a migration wave needs an executable scenario
      # catalog before that wave's first section PR. The catalogs are
      # schema-checked and reconciled against the ledger here; the executor
      # runs them in the scenario-executor job against an empty database
      # named by SILO_SCENARIO_DATABASE_URL (a dedicated variable: the
      # executor truncates, so it never shares SILO_TEST_DATABASE_URL with the
      # other DB-gated packages).
      - name: Verify the tier-1 scenario catalogs cover their waves
        run: make verify-scenario-catalogs

      # The executor's offline run-vs-skip decision reads a committed list of
      # the routes the no-database API router registers, because the sealed
      # router cannot be walked from outside internal/api. This regenerates
      # that list from the real router and fails if the committed file drifted.
      - name: Verify the offline route set matches the API router
        run: make verify-offline-routes

      # The v2 OpenAPI artifact is rendered from the Go registries and the
      # binary serves the committed bytes, so a registration change that does
      # not regenerate leaves clients reading a contract the server no longer
      # matches. This byte-compares a fresh generation.
      - name: Verify the v2 OpenAPI artifact is current
        run: make verify-apiv2-openapi

      # Spec lint and the semantic diff against the PR's base. A breaking
      # change fails unless contracts/api/v2/breaking-approvals.json names
      # that exact operation, rule and fingerprint; after the LOCKED marker
      # nothing is approvable. On a push to main the base is main itself, so
      # both documents are identical and the diff tool compares nothing (an
      # approval a just-merged PR carried is not stale there); the lint still
      # runs. The base is read through the environment, as the lint step
      # does, never interpolated into the script.
      - name: Verify the v2 contract diff and spec lint
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          make verify-apiv2-contract BASE_REF="origin/${BASE_REF}"

      # The v2 fixtures are generated through the real router and every body
      # is validated against the committed OpenAPI schema its index names, so
      # a client testing against them tests against what the server sends.
      - name: Verify the v2 contract fixtures are current and valid
        run: make verify-apiv2-fixtures

      # Bloem: contracts/seams.txt lists the only Silo-owned files Bloem may
      # touch. The comparison needs Silo's main line, which checkout does not
      # create.
      - name: Fetch upstream for seam comparison
        run: |
          git remote add upstream https://github.com/Silo-Server/silo-server.git
          git fetch upstream main

      - name: Verify the seam ledger covers Silo-file changes
        run: make verify-seams

      - name: Save the Go cache
        if: success() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}

  go-test:
    name: Go test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bloem_tenant
          POSTGRES_PASSWORD: invented-ci-password
          POSTGRES_DB: bloem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloem_tenant -d bloem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=1g
    env:
      GOWORK: "off"
      SILO_TEST_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_test?sslmode=disable
    steps:
      # The suite builds plugin fixtures, race binaries and child databases on
      # top of the restored Go cache, which overflows the hosted runner's disk
      # ("no space left on device"). Drop preinstalled toolchains this job
      # never uses before anything else writes to disk.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune --all --force > /dev/null
          df -h /

      # Temporary: sample disk use through the job to find what fills it.
      - name: Watch disk usage
        run: |
          cat > "$RUNNER_TEMP/disk-watch.sh" <<'SCRIPT'
          while true; do
            date -u +%T
            df -h / | tail -1
            df -i / "$HOME/.cache" /tmp | tail -n +2
            sudo du -sh "$HOME/.cache/go-build" "$HOME/go/pkg" /tmp "$RUNNER_TEMP" /var/lib/docker 2>/dev/null
            sleep 20
          done
          SCRIPT
          nohup bash "$RUNNER_TEMP/disk-watch.sh" > "$RUNNER_TEMP/disk.log" 2>&1 &

      - *libvips-cache-key
      - *libvips-restore
      - *libvips-install

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: test

      - *libvips-save

      # Runs the settings-contract gate among everything else: the embedded
      # manifest must parse, satisfy its own schema, hold every structural
      # invariant, and agree with the live settings registry on keys and
      # defaults. Without this job those tests exist but never run.
      # Bloem: migrate the shared test database, finalize the membership
      # policy authority, and install the test-only fixture-compatibility
      # triggers (internal/bloemtestdb; never a migration) so upstream Silo
      # fixtures run unedited against the tenancy schema. make test-go repeats
      # this idempotently. The scenario executor runs in its own job below.
      # The parallel suite migrates many disposable databases at once; the
      # stock lock table (64 locks x 100 connections) runs out of shared
      # memory under that load. Services take no server flags, so set them
      # and restart.
      - name: Size the test PostgreSQL for the parallel suite
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test \
            -c "ALTER SYSTEM SET max_connections = 300" \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 512"
          docker restart "$POSTGRES_CONTAINER_ID"
          until docker exec "$POSTGRES_CONTAINER_ID" pg_isready -U bloem_tenant -d bloem_test; do sleep 1; done
          docker exec "$POSTGRES_CONTAINER_ID" psql -U bloem_tenant -d bloem_test -Atc "SHOW max_locks_per_transaction"

      - name: Prepare Go test databases
        run: |
          make embed-stub
          go run ./cmd/bloem-testdb

      - name: Test Watch Party coordination against Postgres
        run: go test -race -count=1 ./internal/watchtogether/

      - name: Test history import cancellation against Postgres
        run: go test -race -count=1 -run '^(TestHistoryImportCancellation.*|TestQueue.*|TestHistoryImportV1ProfileAuthorization)$' ./migrations/ ./internal/historyimport/ ./internal/api/handlers/

      - name: Upstream database regression gates
        run: |
          make test-db-pins
          go test -race -count=1 -run '^TestMarkerContributionClaimsByTargetMigrationPostgres$' ./migrations/
          go test -race -count=1 -run '^TestUpsertTasteClusters.*Postgres$' ./internal/recommendations/
          go test -race -count=1 -run '^TestCompatDetailServiceResolvesViewerSubtitleDefaultsPostgres$' ./cmd/silo/
          go test -race -count=1 -run '^(TestImageCacheCleanup|TestRequeuedImageCacheCleanup|TestJobOutcomeIsRecorded)' ./internal/adminjob/

      # Compiles every package on the way, so there is no separate build step.
      # This job prepares a fresh database; cached results cannot prove its state.
      - name: Test
        env:
          GOFLAGS: -count=1
        run: make test-go

      - name: Show disk usage samples
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/disk.log" || true
          findmnt -T "$HOME/.cache/go-build" || true
          df -h; df -i
          find "$HOME/.cache/go-build" -type f | wc -l || true
          sudo du -xh --max-depth=3 / 2>/dev/null | sort -rh | head -25 || true

      - name: Save the Go cache
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request' }}
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}
          module-cache-key: ${{ steps.setup-go.outputs.module-cache-key }}
          module-cache-hit: ${{ steps.setup-go.outputs.module-cache-hit }}

  scenario-executor:
    name: Scenario executor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bloem_tenant
          POSTGRES_PASSWORD: invented-ci-password
          POSTGRES_DB: bloem_contract_scenarios_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloem_tenant -d bloem_contract_scenarios_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size=1g
    env:
      GOWORK: "off"
      # An empty database the executor owns: it migrates, seeds, and
      # truncates it, so it never shares SILO_TEST_DATABASE_URL.
      SILO_SCENARIO_DATABASE_URL: postgres://bloem_tenant:invented-ci-password@127.0.0.1:5432/bloem_contract_scenarios_ci?sslmode=disable
    steps:
      - *libvips-cache-key
      - *libvips-restore
      - *libvips-install

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        id: setup-go
        with:
          cache-name: scenarios

      - *libvips-save

      - name: Run the tier-1 scenario catalogs
        run: make test-scenarios

      - name: Save the Go cache
        if: success() && runner.environment == 'github-hosted' && github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: ./.github/actions/save-go-cache
        with:
          job-status: ${{ job.status }}
          cache-key: ${{ steps.setup-go.outputs.cache-key }}

  web:
    name: Web (${{ matrix.part }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [build, checks]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The pnpm version comes from web/package.json's packageManager field —
      # there is no package.json at the repo root, and `defaults.run` does not
      # apply to an action's own inputs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          package-manager-cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read the web check cache directory
        if: matrix.part == 'checks' && runner.environment == 'github-hosted'
        id: web-cache
        run: echo "path=${XDG_CACHE_HOME:-$RUNNER_TEMP}/silo-web" >> "$GITHUB_OUTPUT"

      - name: Restore the web check cache
        if: matrix.part == 'checks' && runner.environment == 'github-hosted' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.web-cache.outputs.path }}
          key: web-checks-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'web/eslint.config.*', 'web/.prettierrc*', 'web/.prettierignore', 'web/prettier.config.*', 'web/tailwind.config.*') }}-${{ github.sha }}
          restore-keys: web-checks-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'web/eslint.config.*', 'web/.prettierrc*', 'web/.prettierignore', 'web/prettier.config.*', 'web/tailwind.config.*') }}-

      - name: Restore and save the web check cache
        if: matrix.part == 'checks' && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ steps.web-cache.outputs.path }}
          key: web-checks-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'web/eslint.config.*', 'web/.prettierrc*', 'web/.prettierignore', 'web/prettier.config.*', 'web/tailwind.config.*') }}-${{ github.sha }}
          restore-keys: web-checks-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml', 'web/eslint.config.*', 'web/.prettierrc*', 'web/.prettierignore', 'web/prettier.config.*', 'web/tailwind.config.*') }}-

      - name: Lint and format check
        if: matrix.part == 'checks'
        env:
          ESLINT_CACHE_ID: ${{ hashFiles('web/pnpm-lock.yaml', 'web/eslint.config.*') }}
          PRETTIER_CACHE_ID: ${{ hashFiles('web/pnpm-lock.yaml', 'web/.prettierrc*', 'web/.prettierignore', 'web/prettier.config.*', 'web/tailwind.config.*') }}
        run: |
          cache_dir="${XDG_CACHE_HOME:-$RUNNER_TEMP}/silo-web"
          mkdir -p "$cache_dir"
          pnpm run format:check --cache --cache-strategy content --cache-location "$cache_dir/prettier-${PRETTIER_CACHE_ID}" &
          failed=0
          pnpm run lint --concurrency auto --cache --cache-strategy content --cache-location "$cache_dir/eslint-${ESLINT_CACHE_ID}" || { echo "::error::ESLint failed"; failed=1; }
          wait $! || { echo "::error::Prettier failed"; failed=1; }
          exit "$failed"

      - name: Restore the TypeScript cache
        if: matrix.part == 'build' && runner.environment == 'github-hosted' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/silo-tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Restore and save the TypeScript cache
        if: matrix.part == 'build' && runner.environment == 'github-hosted' && github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/silo-tsc
          key: tsc-${{ runner.os }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-

      - name: Typecheck and build
        if: matrix.part == 'build'
        run: |
          cache_dir="$RUNNER_TEMP/silo-tsc"
          mkdir -p "$cache_dir"
          # -p --incremental reuses content checks after checkout resets mtimes; tsc -b rechecks.
          pnpm exec tsc -p tsconfig.app.json --incremental --tsBuildInfoFile "$cache_dir/app.tsbuildinfo" &
          app_pid=$!
          pnpm exec tsc -p tsconfig.node.json --incremental --tsBuildInfoFile "$cache_dir/node.tsbuildinfo" &
          node_pid=$!
          failed=0
          pnpm exec vite build || { echo "::error::Vite build failed"; failed=1; }
          wait "$app_pid" || { echo "::error::App typecheck failed"; failed=1; }
          wait "$node_pid" || { echo "::error::Node typecheck failed"; failed=1; }
          exit "$failed"

      # Bloem uses its calibrated bundle budget through the package script.
      - name: Check the launch bundle budget
        if: matrix.part == 'build'
        run: pnpm run budget:check

      - name: Upload frontend bundle for image builds
        if: matrix.part == 'build' && github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/apiv2"]'), github.ref)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

      # The generated web binding is compared after prettier, so this half of
      # the bindings check lives here rather than in a Go job, which has no
      # pnpm. It needs Go to run the generator.
      - name: Set up Go
        if: matrix.part == 'checks'
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.26 <1.27'
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Verify the generated web settings binding is current
        if: matrix.part == 'checks'
        working-directory: .
        run: make verify-settings-bindings-web

      # The web v2 contract types are generated from the committed OpenAPI
      # artifact with the pinned openapi-typescript; this byte-compares a
      # fresh generation so the typed request boundary never drifts from the
      # spec the server serves.
      - name: Verify the generated web v2 contract types are current
        if: matrix.part == 'checks'
        working-directory: .
        run: make verify-apiv2-web-types

      - name: Verify no local paths leaked into committed docs
        if: matrix.part == 'checks'
        working-directory: .
        run: make verify-local-paths

  web-test:
    name: Web test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # Includes the appearance-cache ownership tests, which are the regression
      # guard for cross-account leaks in the localStorage warm start. The
      # suite is split across four runners; vitest assigns files to a shard
      # deterministically, so every file runs exactly once.
      - name: Test
        run: make test-web WEBTEST_ARGS="--shard=${{ matrix.shard }}/4 --maxWorkers=4"
