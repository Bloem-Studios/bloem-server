name: Upstream sync merge

# The merge half of the upstream sync. upstream-sync.yml opens the PR; this
# lands it, but only after CI has actually gone green on it.
#
# This exists instead of GitHub's native auto-merge on purpose. Native
# auto-merge only genuinely waits for CI when `main` carries branch protection
# with required status checks, and that same protection would block direct
# pushes to main — which is how this repo is normally worked. Gating here keeps
# the CI requirement for automated merges without changing anything about
# pushing to main by hand.
#
# Scope is deliberately narrow: it only ever touches PRs whose head branch is
# upstream-sync/**, so it can never merge a human's PR.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge if CI passed
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'upstream-sync/')
    runs-on: ubuntu-latest
    steps:
      # workflow_run can be caused by code from an untrusted pull request. Load
      # the merge helper from the repository's default branch, never that head.
      - name: Checkout the trusted merge helper
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge the exact head tested by CI
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_SYNC_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_SYNC_REPOSITORY: ${{ github.repository }}
          UPSTREAM_SYNC_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          UPSTREAM_SYNC_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPSTREAM_SYNC_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SYNC_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A merge commit, not a squash: this PR's whole value is that it
          # carries upstream's individual commits, and squashing would make the
          # next merge-base calculation treat every one of them as unmerged.
          scripts/verify-upstream-sync-merge.sh

      - name: Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MERGE_RESULT: ${{ steps.merge.outputs.result }}
          PR_FOUND: ${{ steps.merge.outputs.found }}
          PR_NUMBER: ${{ steps.merge.outputs.pr_number }}
          PR_MERGED: ${{ steps.merge.outputs.merged }}
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.warning('DISCORD_WEBHOOK_URL is not set; skipping notification.');
              return;
            }
            const result = process.env.MERGE_RESULT || '';
            const found = process.env.PR_FOUND === 'true';
            const merged = process.env.PR_MERGED === 'true';
            const number = process.env.PR_NUMBER || '';
            const reports = {
              merged: {
                title: 'Upstream sync merged',
                color: 0x4FBF7B,
                description: 'CI passed and the exact tested head was merged into `main`.',
              },
              head_mismatch: {
                title: 'Upstream sync head changed after CI',
                color: 0xE0A44F,
                description: 'The open PR no longer points at the tested commit. No merge was attempted.',
              },
              duplicate_prs: {
                title: 'Upstream sync merge is ambiguous',
                color: 0xE04F4F,
                description: 'More than one matching open PR was found. No merge was attempted.',
              },
              ci_not_success: {
                title: 'Upstream sync blocked by CI',
                color: 0xE04F4F,
                description: 'CI did not succeed, so no merge was attempted.',
              },
              merge_failed: {
                title: 'Upstream sync could not merge',
                color: 0xE0A44F,
                description: 'The exact tested head was found, but GitHub rejected the merge. The PR remains open.',
              },
              invalid_tested_sha: {
                title: 'Upstream sync merge rejected invalid CI data',
                color: 0xE04F4F,
                description: 'The tested commit identifier was invalid. No merge was attempted.',
              },
              invalid_pr_data: {
                title: 'Upstream sync merge rejected invalid PR data',
                color: 0xE04F4F,
                description: 'GitHub returned an invalid pull-request record. No merge was attempted.',
              },
              lookup_failed: {
                title: 'Upstream sync PR lookup failed',
                color: 0xE04F4F,
                description: 'The pull request could not be resolved. No merge was attempted.',
              },
              invalid_pr_json: {
                title: 'Upstream sync PR lookup was invalid',
                color: 0xE04F4F,
                description: 'GitHub returned an invalid pull-request snapshot. No merge was attempted.',
              },
              unexpected_branch: {
                title: 'Upstream sync merge rejected an unexpected branch',
                color: 0xE04F4F,
                description: 'The workflow event was outside the upstream-sync branch boundary. No merge was attempted.',
              },
              unexpected_repository: {
                title: 'Upstream sync merge rejected an unexpected repository',
                color: 0xE04F4F,
                description: 'The workflow head did not come from this repository. No merge was attempted.',
              },
              unexpected_pr: {
                title: 'Upstream sync merge rejected an unexpected pull request',
                color: 0xE04F4F,
                description: 'The pull request identity did not match the tested branch and repository. No merge was attempted.',
              },
            };
            const report = Object.prototype.hasOwnProperty.call(reports, result)
              ? reports[result]
              : undefined;
            if (!report || result === 'no_pr') {
              if (result && result !== 'no_pr') {
                core.warning('Merge helper returned an unknown result; skipping notification.');
              }
              return;
            }
            if (merged !== (result === 'merged')) {
              core.warning('Merge helper returned inconsistent merge state; skipping notification.');
              return;
            }
            if (found && !/^[1-9][0-9]*$/.test(number)) {
              core.warning('Merge helper returned an invalid PR number; skipping notification.');
              return;
            }

            const runUrl = context.payload.workflow_run.html_url;
            const fallbackUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            const prUrl = found
              ? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${number}`
              : undefined;
            const embed = {
              ...report,
              url: prUrl || runUrl || fallbackUrl,
            };

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'Upstream sync', embeds: [embed] }),
            });
            if (!res.ok) {
              core.setFailed(`Discord webhook failed with HTTP ${res.status}.`);
            }
