name: Upstream sync merge

# The merge half of the upstream sync. upstream-sync.yml opens the PR; this
# lands it, but only after CI has actually gone green on it.
#
# This exists instead of GitHub's native auto-merge on purpose. Native
# auto-merge only genuinely waits for CI when `main` carries branch protection
# with required status checks, and that same protection would block direct
# pushes to main — which is how this repo is normally worked. Gating here keeps
# the CI requirement for automated merges without changing anything about
# pushing to main by hand.
#
# Scope is deliberately narrow: it only ever touches PRs whose head branch is
# upstream-sync/**, so it can never merge a human's PR.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge if CI passed
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'upstream-sync/')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the pull request
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No open PR for $BRANCH — already merged or closed. Nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge
        id: merge
        if: steps.find.outputs.found == 'true' && github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A merge commit, not a squash: this PR's whole value is that it
          # carries upstream's individual commits, and squashing would make the
          # next merge-base calculation treat every one of them as unmerged.
          if gh pr merge "${{ steps.find.outputs.number }}" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "Merge command failed — PR left open." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report to Discord
        if: steps.find.outputs.found == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: actions/github-script@v7
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.warning('DISCORD_WEBHOOK_URL is not set; skipping notification.');
              return;
            }
            const number = '${{ steps.find.outputs.number }}';
            const ciPassed = '${{ github.event.workflow_run.conclusion }}' === 'success';
            const merged = '${{ steps.merge.outputs.merged }}' === 'true';
            const prUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${number}`;
            const ciUrl = '${{ github.event.workflow_run.html_url }}';

            let embed;
            if (merged) {
              embed = {
                title: `Upstream sync merged (#${number})`,
                url: prUrl,
                color: 0x4FBF7B,
                description: 'CI passed and the upstream merge is on `main`.',
              };
            } else if (!ciPassed) {
              embed = {
                title: `Upstream sync blocked by CI (#${number})`,
                url: ciUrl,
                color: 0xE04F4F,
                description:
                  `CI concluded \`${{ github.event.workflow_run.conclusion }}\` on the upstream merge. ` +
                  `The PR is open and \`main\` is untouched.`,
              };
            } else {
              embed = {
                title: `Upstream sync could not merge (#${number})`,
                url: prUrl,
                color: 0xE0A44F,
                description: 'CI passed but the merge command failed — likely a conflict with a newer `main`. Needs hands.',
              };
            }

            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: 'Upstream sync', embeds: [embed] }),
            });
            if (!res.ok) {
              core.setFailed(`Discord webhook failed with ${res.status}: ${await res.text()}`);
            }
