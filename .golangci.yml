version: "2"

run:
  # Diff-scoped CI runs over large PRs exceed 5m on the shared runner (exit 4).
  timeout: 15m
  # Wait for another run on this machine to finish instead of failing after
  # 5s with "parallel golangci-lint is running". A cold run saturates every
  # core, so queueing concurrent runs (several agents, several worktrees)
  # beats running them side by side. Never pass --allow-parallel-runners.
  allow-serial-runners: true

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/streamapp/streamapp

linters:
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - goconst
    - govet
    - ineffassign
    - misspell
    - nilerr
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - wastedassign

  settings:
    # gocritic is enabled for exactly one check: the ruleguard rules under
    # internal/routeinventory/lintrules/, defense in depth for the legacy
    # native route inventory (docs/architecture/api-contract.md, "Legacy
    # native route inventory"). The guarantee itself is structural — every
    # listener entry function returns a sealed handler the generator checks —
    # and these rules report the attempt early: a type assertion, type switch
    # or generic instantiation whose type registers routes by its method set
    # (alias, defined type, embedding or structural interface included), and
    # reflect.Value.MethodByName, outside tests. ruleguard was chosen over
    # forbidigo because forbidigo visits only identifier and selector nodes
    # and cannot tell an assertion from a parameter type. Keep the check list
    # to ruleguard: widening it enrolls the whole tree in gocritic's style set.
    #
    # gocritic is deliberately absent from linters.enable above and runs only
    # through make lint-router-recovery (--enable-only gocritic), full-tree,
    # which CI gates on. A changed-lines pass would find nothing that step
    # does not, and it is the costliest linter here: gocritic rebuilds the
    # ruleguard engine for every package, and each rebuild type-checks chi
    # and net/http from source — about two seconds of fixed cost per package,
    # nearly half the analysis time of a cold run over ./... .
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: '${base-path}/internal/routeinventory/lintrules/*.go'
          failOn: all

    sloglint:
      # Require the context-carrying slog variants (InfoContext, …) wherever a
      # context.Context is in scope, so log records correlate with the active
      # OpenTelemetry trace. "scope" (not "all") allows the plain Info/… form in
      # background/init code where no ctx exists. Enforced repo-wide after the
      # phase-3 sweep converted the ~1,159 legacy call sites.
      context: "scope"
      # Message must be a constant, not a built string; move dynamic parts to attrs.
      static-msg: true
      # Attribute keys are snake_case (component, request_id, trace_id, …).
      key-naming-case: snake
      # Don't mix key-value pairs and slog.Attr in one call.
      no-mixed-args: true

    errcheck:
      check-type-assertions: true

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

  exclusions:
    # Anchored regexes, not directory names: `paths` matches anywhere in the
    # path, so a bare `web` also excluded internal/jellycompat/web_component.go,
    # internal/webhooksync/, internal/notifications/webhook*.go and every other
    # non-test file with "web" in its name — 14 files that were being linted
    # before.
    paths:
      - ^web/
      - ^migrations/

    rules:
      # Allow repeated strings in test files
      - path: _test\.go
        linters:
          - goconst

      # Tests may recover a router from a handler to walk it (the route
      # inventory backstops do); they register nothing that ships.
      - path: _test\.go
        linters:
          - gocritic
        text: "^ruleguard: route inventory:"

      # Allow unchecked errors in test cleanup/defer
      - path: _test\.go
        text: "Error return value is not checked"
        linters:
          - errcheck

      # ---- Bloem calibration (additive; upstream settings above stay verbatim) ----
      # Expressed as exclusion rules so upstream's own settings are never
      # rewritten. CI lints only Bloem's own lines (scripts/bloem-lint-changed-ci.sh).

      # Deferred teardown: the returned error arrives after the function has
      # already decided its outcome, so there is nothing left to do with it and
      # nowhere to report it. Writing `defer func() { _ = c.Close() }()` at ~30
      # call sites buys no safety, so the intent is recorded once here instead.
      # errcheck reports the call expression, not its type, so this matches any
      # unchecked Close/Rollback/os.Remove(All). A Close that flushes buffered
      # writes must still be checked at its call site (see
      # jellycompat/web_component.go, which checks the success-path Close).
      - linters:
          - errcheck
        text: "^Error return value of `([^`]+\\.(Close|Rollback)|os\\.(Remove|RemoveAll))` is not checked"

      # goconst at upstream's min-len 3 / min-occurrences 3 reported 1,915
      # issues in a full uncapped run, essentially all domain vocabulary rather
      # than missing constants: metadata providers (tmdb, tvdb, imdb), codecs
      # (h264, hevc, aac, eac3), resolutions (1080p, 2160p), media kinds (movie,
      # series, ebook), hwaccel backends (qsv, vaapi), JSON and column names,
      # sort directions, and even "true"/"false". Extracting constants for
      # those adds indirection to literals already unambiguous at the use site.
      # Suppressing strings shorter than 20 bytes or repeated fewer than 5
      # times keeps what is worth acting on -- repeated settings keys, MIME
      # types, header names and status enums that usually already have a
      # declared constant -- and drops the noise (1,915 -> 31 issues).
      - linters:
          - goconst
        text: "^string `[^`]{0,19}` has "
      - linters:
          - goconst
        text: "^string `[^`]*` has [0-4] occurrences"

      # "cancelled" is this codebase's canonical persisted status value, not a
      # typo: adminjob.StatusCancelled, requests.OutcomeCancelled,
      # historyimport.RunStatusCancelled and metadata.NormalizeShowStatus all
      # emit it, and livetv/manga accept both spellings on input. Left flagged,
      # a --fix run rewrites those literals and the comments documenting them,
      # which silently changes stored values. Go's own context.Canceled keeps
      # the US spelling and is unaffected by this exception.
      - linters:
          - misspell
        text: "^`[Cc]ancelled` is a misspelling of "

      # Prairie's pinned Live TV implementation intentionally retains its
      # protocol vocabulary and repeated codec/status literals. Keep that
      # imported surface reviewable against its recorded source blobs instead
      # of mechanically rewriting it only to satisfy style linters.
      - path: ^internal/livetv/
        linters:
          - goconst
          - misspell

      - path: ^internal/playback/(audio_channels|live_.*)\.go$
        linters:
          - goconst

      - path: ^internal/playback/live_.*_test\.go$
        linters:
          - misspell

      - path: ^internal/jellycompat/handlers_livetv(_test)?\.go$
        linters:
          - goconst
          - misspell

      - path: ^internal/api/handlers/livetv\.go$
        linters:
          - goconst
