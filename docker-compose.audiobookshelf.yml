# Opt-in overlay: bloem-audiobookshelf, the private Audiobookshelf-protocol
# compatibility companion.
#
# Activate (from the repository root, together with the base file):
#
#   docker compose -f docker-compose.yml -f docker-compose.audiobookshelf.yml up -d
#
# Deployment contract (docs/operations/compatibility-applications.md):
#   - The companion runs on the internal bloem-compat network only. It has no
#     host ports; clients reach it exclusively through Bloem's gateway at the
#     canonical public address under /audiobookshelf/**.
#   - It receives NO Bloem database, Redis, media filesystem, Docker socket,
#     SECRET_KEY, provider credential, or tuner credential. Its only Bloem
#     contact is the private compatibility API over this network.
#   - Its persistence is disposable protocol state in a companion-owned named
#     volume (SQLite with WAL). Removing the volume loses only protocol state;
#     canonical media state lives in Bloem.
#   - Enrollment uses a single-use token mounted as a Docker secret file at
#     /run/secrets/bloem_compat_enrollment — never an environment value.
#     Create the token in Admin -> Compatibility Applications, write it to the
#     file below, enroll, then delete the file.
#   - The image is private. `docker login ghcr.io` with read access to
#     ghcr.io/bloem-studios is required before pulling.
#
# Structure is enforced by scripts/verify-compat-compose.sh.

networks:
  bloem-compat:
    # Internal: members get no host-port publishing and no outbound access.
    # The companion talks to Bloem, and nothing else.
    internal: true

volumes:
  # Disposable protocol state only (client token correlation, protocol caches,
  # event cursors). Safe to delete when the companion is uninstalled.
  bloem-audiobookshelf-state:

secrets:
  bloem_audiobookshelf_enrollment:
    # Single-use enrollment token issued by Admin -> Compatibility Applications.
    # Write it to this file (chmod 600) before `up`, delete it after enrollment
    # succeeds. The .secrets/ directory is gitignored.
    file: ${BLOEM_AUDIOBOOKSHELF_ENROLLMENT_FILE:-./.secrets/compat/bloem-audiobookshelf-enrollment.token}

services:
  silo:
    # Bloem joins the private companion network (for the gateway and the
    # private compatibility API) while keeping its normal networking.
    networks:
      default: {}
      bloem-compat: {}

  bloem-audiobookshelf:
    # Pin a version or digest for deterministic change control, e.g.
    # BLOEM_AUDIOBOOKSHELF_IMAGE=ghcr.io/bloem-studios/bloem-audiobookshelf@sha256:...
    image: ${BLOEM_AUDIOBOOKSHELF_IMAGE:-ghcr.io/bloem-studios/bloem-audiobookshelf:latest}
    restart: unless-stopped
    networks:
      bloem-compat:
        aliases:
          - bloem-audiobookshelf
    environment:
      # Base URL of Bloem's listener on the private network; the companion
      # calls /api/internal/compat/v1 beneath it.
      BLOEM_COMPAT_API_BASE_URL: http://silo:8080
      # Where the single-use enrollment token is mounted (Docker secret).
      BLOEM_COMPAT_ENROLLMENT_FILE: /run/secrets/bloem_compat_enrollment
      # Companion-owned disposable state directory (named volume below).
      BLOEM_COMPAT_STATE_DIR: /var/lib/bloem-compat
    secrets:
      - source: bloem_audiobookshelf_enrollment
        target: bloem_compat_enrollment
    volumes:
      - bloem-audiobookshelf-state:/var/lib/bloem-compat
    security_opt:
      - no-new-privileges:true
