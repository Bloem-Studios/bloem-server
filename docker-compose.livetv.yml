# Optional override for Live TV HDHomeRun LAN discovery (Linux hosts).
#
# Bridge-mode Docker cannot send/receive SiliconDust UDP broadcasts on port
# 65001 to the LAN. This override puts the Bloem application service on the host network
# so "Discover on LAN" works. Dispatcharr URL probing works without this file.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.livetv.yml up -d
#
# Or in .env (Linux/macOS):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.livetv.yml
#
# Notes:
# - Linux only. Docker Desktop (macOS/Windows) host networking is not a real
#   LAN attach — use URL probe for Dispatcharr / enter the HDHR discover URL.
# - With network_mode: host, published `ports:` are ignored; Bloem listens on
#   host :8080. Point clients at that host port,
#   or put a reverse proxy on the host in front of it.
# - postgres/redis stay on the compose network but publish 5432/6379 to the host,
#   so the application reaches them via 127.0.0.1.

services:
  silo:
    network_mode: host
    # Clear bridge-mode port publishes (ignored under host networking anyway).
    ports: !reset []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-silo}:${POSTGRES_PASSWORD:-silo}@127.0.0.1:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-silo}?sslmode=disable
      REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}
      # The base PORT variable controls bridge-mode host publishing. With host
      # networking the application keeps its base container listener on :8080.
      PORT: "8080"
