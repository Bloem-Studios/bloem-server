services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    shm_size: ${POSTGRES_SHM_SIZE:-8gb}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silo}
      POSTGRES_DB: ${POSTGRES_DB:-silo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${SILO_DATA_ROOT:-/opt/silo}/postgres:/var/lib/postgresql
    command: ["postgres", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-silo}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ${SILO_DATA_ROOT:-/opt/silo}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: ${MEILISEARCH_IMAGE:-getmeili/meilisearch:latest}
    restart: unless-stopped
    profiles: [search]
    entrypoint:
      - /bin/sh
      - -euc
      - |
        if [ -z "$${MEILI_MASTER_KEY:-}" ]; then
          echo "MEILI_MASTER_KEY is required when enabling the search profile" >&2
          exit 1
        fi
        exec /bin/meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
    ports:
      - "${MEILISEARCH_HOST:-127.0.0.1}:${MEILISEARCH_PORT:-7700}:7700"
    volumes:
      - ${SILO_DATA_ROOT:-/opt/silo}/meilisearch:/meili_data

  silo:
    image: ${SILO_IMAGE:-ghcr.io/silo-server/silo-server:latest}
    restart: unless-stopped
    environment:
      MODE: integrated
      # Keep the container listener fixed. PORT in .env is a host-side
      # published-port override.
      #
      # No JF_PORT/ABS_PORT here: the Jellyfin- and Audiobookshelf-compatible
      # APIs are reached through the compatibility gateway on this same PORT
      # by default — no extra listener, no extra published port. Setting
      # JF_PORT (and uncommenting the matching port mapping below) opts a
      # deployment back into a dedicated Jellyfin listener on :8096, e.g. for
      # a reverse-proxy setup built around that port; same for ABS_PORT/:13378.
      PORT: "8080"
      # Master key for at-rest credential encryption. Required — the server
      # refuses to start without it. Generate with: openssl rand -base64 48
      # Back it up SEPARATELY from your database dumps; losing it makes encrypted
      # secrets unrecoverable. See docs/architecture/secret-encryption.md.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
      DATABASE_URL: postgres://${POSTGRES_USER:-silo}:${POSTGRES_PASSWORD:-silo}@postgres:5432/${POSTGRES_DB:-silo}?sslmode=disable
      REDIS_URL: redis://redis:6379
      SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
      POSTGRES_TUNE: ${POSTGRES_TUNE:-auto}
    ports:
      - "${PORT:-8090}:8080"
      # Only needed if you explicitly re-enable a dedicated Jellyfin/ABS
      # listener via admin settings (jellyfin_compat.listen /
      # audiobookshelf_compat.listen) — both APIs are reached through the
      # compatibility gateway on the port above by default. Uncomment and
      # set JF_PORT/ABS_PORT in .env if you opt into a dedicated listener.
      # - "${JF_PORT:-8096}:8096"
      # - "${ABS_PORT:-13378}:13378"
    volumes:
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
      - ${SILO_DATA_ROOT:-/opt/silo}/plugins:/var/lib/silo/plugins
      - ${SILO_DATA_ROOT:-/opt/silo}/compat:/var/lib/silo/compat
      - ${SILO_DATA_ROOT:-/opt/silo}/transcode:/tmp/silo-transcode
      - ${SILO_DATA_ROOT:-/opt/silo}/catalog-seeds:/catalog-seeds:ro
      - /proc/meminfo:/host/proc/meminfo:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
  # Optional distributed-mode example. Most single-host installs should
  # just use the integrated service above.
  # silo-proxy:
  #   image: ${SILO_IMAGE:-ghcr.io/silo-server/silo-server:latest}
  #   restart: unless-stopped
  #   profiles: [proxy]
  #   environment:
  #     MODE: proxy
  #     # Must be the SAME SECRET_KEY as the primary node (shared encrypted data).
  #     SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
  #     DATABASE_URL: postgres://${POSTGRES_USER:-silo}:${POSTGRES_PASSWORD:-silo}@postgres:5432/${POSTGRES_DB:-silo}?sslmode=disable
  #     REDIS_URL: redis://redis:6379
  #     PORT: "8080"
  #   ports:
  #     - "${PROXY_PORT:-8083}:8080"
  #   volumes:
  #     - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - path: .env
  #       required: false

  # ---------------------------------------------------------------------------
  # Optional private compatibility companions (NOT enabled from this file).
  #
  # vondel-audiobookshelf and vondel-jellyfin are removable protocol facades
  # that talk to Vondel's private compatibility API. Activation is overlay-only
  # so their deployment contract stays in one reviewed place:
  #
  #   docker compose -f docker-compose.yml -f docker-compose.audiobookshelf.yml up -d
  #   docker compose -f docker-compose.yml -f docker-compose.jellyfin.yml up -d
  #
  # The overlays keep each companion on an internal network with no host ports,
  # a single-use enrollment token mounted as a Docker secret file, and one named
  # volume of disposable protocol state. Companions never receive the Vondel
  # database, Redis, media mounts, SECRET_KEY, provider or tuner credentials,
  # or the Docker socket, and their images stay in the private
  # ghcr.io/vondel-media registry. For illustration, a companion service looks
  # like this (see docker-compose.audiobookshelf.yml for the real contract):
  #
  # vondel-audiobookshelf:
  #   image: ghcr.io/vondel-media/vondel-audiobookshelf:latest   # private pull
  #   restart: unless-stopped
  #   networks: internal vondel-compat only — no ports, no egress
  #   secrets: single-use enrollment token at /run/secrets/vondel_compat_enrollment
  #   volumes: one named volume of disposable protocol state (SQLite/WAL)
  #
  # Operator guide: docs/operations/compatibility-applications.md
  # Structural enforcement: scripts/verify-compat-compose.sh
  # ---------------------------------------------------------------------------

  # Optional distributed-mode example. Most single-host installs should
  # just use the integrated service above.
  # silo-transcode:
  #   image: ${SILO_IMAGE:-ghcr.io/silo-server/silo-server:latest}
  #   restart: unless-stopped
  #   profiles: [transcode]
  #   environment:
  #     MODE: transcode
  #     # Must be the SAME SECRET_KEY as the primary node (shared encrypted data).
  #     SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env — generate one with openssl rand -base64 48}
  #     DATABASE_URL: postgres://${POSTGRES_USER:-silo}:${POSTGRES_PASSWORD:-silo}@postgres:5432/${POSTGRES_DB:-silo}?sslmode=disable
  #     REDIS_URL: redis://redis:6379
  #     SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
  #     PORT: "8080"
  #   ports:
  #     - "${TRANSCODE_PORT:-8082}:8080"
  #   volumes:
  #     - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env to the host media path}:${MEDIA_CONTAINER_ROOT:-/mnt/media}:ro
  #     - ${SILO_DATA_ROOT:-/opt/silo}/plugins:/var/lib/silo/plugins
  #     - ${SILO_DATA_ROOT:-/opt/silo}/transcode:/tmp/silo-transcode
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   env_file:
  #     - path: .env
  #       required: false
