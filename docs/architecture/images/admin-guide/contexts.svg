<text x="724" y="262" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">One organization only. For its organization</text>
<text x="724" y="283" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">administrators.</text>
<rect x="724" y="304" width="412" height="34" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
