<text x="742" y="495" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Libraries &amp; Entitlements</text>
<rect x="724" y="514" width="412" height="34" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
<text x="742" y="537" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Storage sources</text>
<rect x="724" y="556" width="412" height="34" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
<text x="742" y="579" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Invitations</text>
<rect x="724" y="598" width="412" height="34" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
<text x="742" y="621" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Policy Decisions</text>
<rect x="724" y="640" width="412" height="34" rx="8" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.2"/>
<text x="742" y="663" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Activity &amp; Audit</text>
<text x="40" y="734" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Admin pages also need a selected profile. Being a household's main profile does not make an account a platform administrator, and an organization administrator</text>
<text x="40" y="754" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">cannot open platform pages.</text>
