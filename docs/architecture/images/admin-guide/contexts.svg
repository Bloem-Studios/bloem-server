<text x="64" y="262" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">The whole server. For platform administrators.</text>
<text x="64" y="300" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">Platform (Bloem's pages)</text>
<rect x="64" y="312" width="120" height="26" rx="13.0" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="124.0" y="329.68" font-size="13" font-weight="600" fill="#101827" text-anchor="middle">Organizations</text>
<rect x="194" y="312" width="180" height="26" rx="13.0" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="284.0" y="329.68" font-size="13" font-weight="600" fill="#101827" text-anchor="middle">Entitlement Templates</text>
