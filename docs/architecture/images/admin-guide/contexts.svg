<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Two ways to administer</title>
<desc id="d">Choose context leads to two sidebars. Platform: the whole server, with Bloem's Platform pages and Silo's Monitor, Manage and Configure groups. An organization: nine pages for that organization only.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="789" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Two ways to administer</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Choose a context first. The sidebar then shows only the pages for that context.</text>
<rect x="480" y="112" width="240" height="48" rx="24" fill="#101827" stroke="none" stroke-width="1.5"/>
<text x="600" y="143" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Choose context</text>
<path d="M 480 136 L 350 136 L 350 196" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 720 136 L 930 136 L 930 196" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="200" width="620" height="500" rx="18" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
