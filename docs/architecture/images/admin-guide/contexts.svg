<text x="365.0" y="587.68" font-size="13" font-weight="600" fill="#101827" text-anchor="middle">Integrations</text>
<rect x="700" y="200" width="460" height="500" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
