<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Signing in on an organization's own domain</title>
<desc id="d">A made-up member of Riverside Club, whose organization has its own domain, tries to sign in at three addresses. On the club's domain the sign-in works and the page shows the club's name and colours. On another organization's domain it is refused with a message naming the club's address. On an address no organization registered, such as the server's IP address, it works. Below, a sign-in through the OAuth provider returns to the domain it started on, so each domain must be registered at the provider.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="711" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Signing in on an organization's own domain</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">A domain decides which name and colours a page shows, never what an account may reach.</text>
<rect x="40" y="124" width="1120" height="64" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">sam@riverside.example, a member of Riverside Club, signs in at:</text>
<text x="1140" y="162" font-size="13.5" font-weight="normal" fill="#6B7280" text-anchor="end">This example is made up.</text>
<rect x="40" y="212" width="360" height="176" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<circle cx="74" cy="250" r="14" fill="#10B981"/>
<path d="M67.7,250.28 L72.6,255.32 L81.0,245.1" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="256" font-size="16" font-weight="700" fill="#101827" text-anchor="start">watch.riverside.example</text>
<text x="62" y="290" font-size="11.5" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="0.8">RIVERSIDE CLUB'S OWN DOMAIN</text>
<text x="62" y="322" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Signed in. The page shows the club's name,</text>
<text x="62" y="343" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">logo and colours, and emails link here.</text>
<rect x="420" y="212" width="360" height="176" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
<circle cx="454" cy="250" r="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M447.7,243.7 L460.3,256.3 M460.3,243.7 L447.7,256.3" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="478" y="256" font-size="16" font-weight="700" fill="#101827" text-anchor="start">tv.other.example</text>
<text x="442" y="290" font-size="11.5" font-weight="700" fill="#B91C1C" text-anchor="start" letter-spacing="0.8">ANOTHER ORGANIZATION'S DOMAIN</text>
<text x="442" y="322" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Refused (409): “This account signs in at</text>
<text x="442" y="343" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">https://watch.riverside.example.”</text>
<rect x="800" y="212" width="360" height="176" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<circle cx="834" cy="250" r="14" fill="#10B981"/>
<path d="M827.7,250.28 L832.6,255.32 L841.0,245.1" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="858" y="256" font-size="16" font-weight="700" fill="#101827" text-anchor="start">The server's IP address</text>
<text x="822" y="290" font-size="11.5" font-weight="700" fill="#374151" text-anchor="start" letter-spacing="0.8">AN ADDRESS NOBODY REGISTERED</text>
<text x="822" y="322" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Signed in. An IP address or a home-network</text>
<text x="822" y="343" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">name always works, so an administrator can</text>
<text x="822" y="364" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">reach the server.</text>
<text x="40" y="426" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">An organization without a domain signs in at the server's public address. In production there is one organization, the default one, and the server's</text>
<text x="40" y="447" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">public address is its primary domain.</text>
<text x="40" y="494" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Signing in or out through the OAuth provider (Authentik)</text>
<rect x="40" y="514" width="340" height="112" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
<text x="58" y="546" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Start on a domain</text>
<text x="58" y="570" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The sign-in page on watch.riverside.example</text>
<text x="58" y="590" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">sends the browser to the provider.</text>
<line x1="384" y1="570" x2="426" y2="570" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430" y="514" width="340" height="112" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="448" y="546" font-size="16" font-weight="700" fill="#101827" text-anchor="start">The provider</text>
<text x="448" y="570" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Checks the password, then sends the browser</text>
<text x="448" y="590" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">back to that same domain's callback.</text>
<line x1="774" y1="570" x2="816" y2="570" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="514" width="340" height="112" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="838" y="546" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Finish on the domain</text>
<text x="838" y="570" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Where the browser's cookies are. Signing</text>
<text x="838" y="590" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">out returns to that domain's /login.</text>
<text x="40" y="676" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">So each domain's two callback addresses, and its /login when provider sign-out is on, must be registered at the provider before that domain's members use it.</text>
</svg>
