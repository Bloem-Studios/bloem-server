<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Editing an audiobook connection's passwords</title>
<desc id="d">Four edits side by side. A new password is saved and tied to its address. A blank password is kept while its address is unchanged. A blank password with a changed address is refused. A cleared address drops the password tied to it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="595" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Editing an audiobook connection's passwords</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Each password is tied to the address it was entered for. Bloem never sends it anywhere else.</text>
<rect x="40" y="124" width="265" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">A new password</text>
<text x="60" y="198" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">DOWNLOAD CLIENT ADDRESS</text>
<rect x="60" y="206" width="225" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.4"/>
<text x="72" y="230" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">dl.home.example</text>
<text x="60" y="274" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">PASSWORD</text>
<rect x="60" y="282" width="225" height="36" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
<text x="72" y="306" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">typed: ••••••••</text>
<line x1="172.5" y1="330" x2="172.5" y2="360" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="56" y="366" width="233" height="102" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<circle cx="82" cy="396" r="11" fill="#10B981"/>
<path d="M77.05,396.22 L80.9,400.18 L87.5,392.15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="102" y="401" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Saved, and tied to this</text>
<text x="102" y="421" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">address.</text>
<rect x="325" y="124" width="265" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="345" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Blank, same address</text>
<text x="345" y="198" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">DOWNLOAD CLIENT ADDRESS</text>
<rect x="345" y="206" width="225" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.4"/>
<text x="357" y="230" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">dl.home.example</text>
<text x="345" y="274" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">PASSWORD</text>
<rect x="345" y="282" width="225" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.4"/>
<text x="357" y="306" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">left blank</text>
<line x1="457.5" y1="330" x2="457.5" y2="360" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="341" y="366" width="233" height="102" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<circle cx="367" cy="396" r="11" fill="#10B981"/>
<path d="M362.05,396.22 L365.9,400.18 L372.5,392.15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="387" y="401" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">The saved password is</text>
<text x="387" y="421" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">kept.</text>
<rect x="610" y="124" width="265" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="630" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Blank, new address</text>
<text x="630" y="198" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">DOWNLOAD CLIENT ADDRESS</text>
<rect x="630" y="206" width="225" height="36" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
<text x="642" y="230" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">dl2.home.example</text>
<text x="630" y="274" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">PASSWORD</text>
<rect x="630" y="282" width="225" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.4"/>
<text x="642" y="306" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">left blank</text>
<line x1="742.5" y1="330" x2="742.5" y2="360" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="626" y="366" width="233" height="102" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
<circle cx="652" cy="396" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M647.05,391.05 L656.95,400.95 M656.95,391.05 L647.05,400.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="672" y="401" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Refused. Enter the</text>
<text x="672" y="421" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">password again for the</text>
<text x="672" y="441" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">new address.</text>
<rect x="895" y="124" width="265" height="360" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="915" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Address cleared</text>
<text x="915" y="198" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">DOWNLOAD CLIENT ADDRESS</text>
<rect x="915" y="206" width="225" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="927" y="230" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">cleared</text>
<text x="915" y="274" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start" letter-spacing="0.5">PASSWORD</text>
<rect x="915" y="282" width="225" height="36" rx="8" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="927" y="306" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start" font-style="italic">–</text>
<line x1="1027.5" y1="330" x2="1027.5" y2="360" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="911" y="366" width="233" height="102" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/>
<circle cx="937" cy="396" r="11" fill="#9CA3AF"/>
<path d="M932.05,396.22 L935.9,400.18 L942.5,392.15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="957" y="401" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">The password tied to</text>
<text x="957" y="421" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">that address is</text>
<text x="957" y="441" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">dropped.</text>
<text x="40" y="526" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">An edit keeps the connection, its library and the downloads in progress. Changing the download client's address makes downloads already handed to the old</text>
<text x="40" y="546" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">client fail their checks, so the editor warns before saving.</text>
</svg>
