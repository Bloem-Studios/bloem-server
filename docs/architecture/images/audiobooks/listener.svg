<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How Audiobookshelf apps reach Bloem</title>
<desc id="d">An Audiobookshelf app connects to its own port, 13378, which listens only while the administrator allows Audiobookshelf apps. It signs in with the account and profile in the username and the PIN after the password. Silo's Audiobookshelf-compatible server answers, and Bloem's organization filter limits it to the libraries of the account's own organization. Bloem's own apps use the main address instead.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How Audiobookshelf apps reach Bloem</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's Audiobookshelf-compatible server, on its own port, limited to one organization's libraries.</text>
<rect x="40" y="132" width="260" height="150" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
<text x="58" y="164" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Audiobookshelf app</text>
<text x="58" y="188" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Any app made for Audiobookshelf,</text>
<text x="58" y="208" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">for listening to audiobooks and</text>
<text x="58" y="228" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">podcasts.</text>
<line x1="304" y1="206" x2="352" y2="206" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="356" y="124" width="300" height="166" rx="14" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.8"/>
<text x="506" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="middle">Its own port: 13378</text>
<text x="506" y="188" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Listens only while “Allow</text>
<text x="506" y="208" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Audiobookshelf apps to connect” is</text>
<text x="506" y="228" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">on. It is on unless an administrator</text>
<text x="506" y="248" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">turns it off.</text>
<line x1="660" y1="206" x2="708" y2="206" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="124" width="448" height="166" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.8"/>
<text x="736" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Sign-in</text>
<text x="736" y="192" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">Username</text>
<rect x="736" y="200" width="190" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="750" y="224" font-size="15" font-weight="600" fill="#101827" text-anchor="start">sam#Kids</text>
<text x="944" y="192" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">Password</text>
<rect x="944" y="200" width="192" height="36" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="958" y="224" font-size="15" font-weight="600" fill="#101827" text-anchor="start">password#1234</text>
<text x="736" y="266" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Account # profile, and the PIN after the password.</text>
<path d="M936,294 L936,330 L506,330 L506,352" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="356" y="356" width="300" height="132" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="506" y="392" font-size="17" font-weight="700" fill="#101827" text-anchor="middle">Silo's server</text>
<text x="506" y="418" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Silo's code in internal/audiobooks,</text>
<text x="506" y="438" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">with one Bloem change to how retries</text>
<text x="506" y="458" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">are counted.</text>
<line x1="660" y1="422" x2="708" y2="422" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="712" y="356" width="448" height="132" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="730" y="388" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem's organization filter</text>
<text x="730" y="412" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The app sees only the libraries of the account's own</text>
<text x="730" y="432" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">organization, with its plan's and profile's limits.</text>
<text x="40" y="528" font-size="14" font-weight="normal" fill="#6B7280" text-anchor="start">Bloem's own apps and the web app play audiobooks through the main address instead.</text>
</svg>
