<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">What the web app has, and what it calls</title>
<desc id="d">The web app built into Bloem Server, in three parts: what viewers use, what an organization administrator uses, and what a platform administrator uses. Silo's screens are kept; Bloem adds its own. Below, the two APIs it calls: Silo's /api/v2 for everything Silo has and Bloem's /api/bloem/v2 for Bloem's features. It calls none of Silo's /api/v1.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="799" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">What the web app has, and what it calls</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's web app with Bloem's screens added. Grey items are Silo's, kept as Silo ships them.</text>
<rect x="40" y="124" width="360" height="400" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="60" y="160" font-size="18" font-weight="700" fill="#101827" text-anchor="start">For viewers</text>
<rect x="58" y="180" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="74" y="206" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Home with campaign cards</text>
<rect x="58" y="228" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="74" y="254" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Seasonal effects</text>
<rect x="58" y="276" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="74" y="302" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Live TV, guide, recordings</text>
<rect x="58" y="324" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="74" y="350" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Playback cards in the player</text>
<rect x="58" y="372" width="324" height="40" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="74" y="398" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Inbox and announcements</text>
<rect x="58" y="420" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
<text x="74" y="446" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Profile sign-ins</text>
<rect x="58" y="468" width="324" height="40" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="74" y="494" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Catalog, player, profiles, requests</text>
<rect x="420" y="124" width="360" height="400" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
<text x="440" y="160" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Organization administrator</text>
<rect x="438" y="180" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.2"/>
<text x="454" y="206" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">People and their plans</text>
