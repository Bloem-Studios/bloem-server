<rect x="818" y="276" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.2"/>
<text x="834" y="302" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Campaigns &amp; seasonal packs</text>
<rect x="818" y="324" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.2"/>
<text x="834" y="350" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Announcements</text>
<rect x="818" y="372" width="324" height="40" rx="10" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.2"/>
<text x="834" y="398" font-size="14.5" font-weight="600" fill="#101827" text-anchor="start">Live TV sources</text>
<rect x="818" y="420" width="324" height="40" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="834" y="446" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's server settings</text>
<rect x="40" y="568" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="602" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Silo's /api/v2</text>
<text x="60" y="630" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Everything Silo has: accounts, libraries, the catalog, playback,</text>
<text x="60" y="650" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">settings. Through Silo's own web code.</text>
<rect x="620" y="568" width="540" height="120" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="640" y="602" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem's /api/bloem/v2</text>
<text x="640" y="630" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem's features: organizations, plans, Live TV, campaigns, seasonal</text>
<text x="640" y="650" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">packs, announcements, profile sign-ins.</text>
<circle cx="64" cy="726" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M58.6,720.6 L69.4,731.4 M69.4,720.6 L58.6,731.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="86" y="731" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Silo's old v1 API: not called since 2026-11-01, and retired by Silo on 2026-11-11.</text>
<text x="40" y="770" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Each feature's status, evidence and limits are in the tables on this page.</text>
</svg>
