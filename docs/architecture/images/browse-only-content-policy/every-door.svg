<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="672" viewBox="0 0 1200 672" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Browse-only: checked at every door</title>
<desc id="d">A browse-only account can open the catalog: titles, descriptions, seasons and episodes, artwork and trailers hosted elsewhere. Six doors that deliver content (video and its stream links, the ebook reader, theme songs, thumbnails while scrubbing, Live TV and plugins) each check playback again on every request, and refuse.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="671" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Browse-only: checked at every door</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Hiding the play button is not enough. Every place content leaves the server checks again.</text>
<rect x="40" y="260" width="250" height="150" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="165" y="310" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">Browse-only</text>
<text x="165" y="336" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">account</text>
<text x="165" y="368" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Playback is off</text>
<path d="M294,310 C330,310 330,180 376,180" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M294,360 C330,360 330,430 376,430" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="380" y="124" width="780" height="112" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<circle cx="412" cy="162" r="14" fill="#10B981"/>
<path d="M405.7,162.28 L410.6,167.32 L419.0,157.1" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="438" y="168" font-size="18" font-weight="700" fill="#101827" text-anchor="start">The catalog is open</text>
<text x="438" y="198" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Titles, descriptions, seasons and episodes, artwork, and trailers hosted elsewhere. Nothing is</text>
<text x="438" y="218" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">taken out of the catalog.</text>
<rect x="380" y="262" width="780" height="332" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="404" y="296" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Doors that deliver content</text>
<rect x="400" y="316" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="428" cy="356" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M422.6,350.6 L433.4,361.4 M433.4,350.6 L422.6,361.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="452" y="346" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Video</text>
<text x="452" y="368" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Starting a stream, and its stream links</text>
<rect x="780" y="316" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="808" cy="356" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M802.6,350.6 L813.4,361.4 M813.4,350.6 L802.6,361.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="832" y="346" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Ebook reader</text>
<text x="832" y="368" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Opening a book, whether stored here or</text>
<text x="832" y="384" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">elsewhere</text>
<rect x="400" y="406" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="428" cy="446" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M422.6,440.6 L433.4,451.4 M433.4,440.6 L422.6,451.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="452" y="436" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Theme songs</text>
<text x="452" y="458" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Playing a title's theme music</text>
<rect x="780" y="406" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="808" cy="446" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M802.6,440.6 L813.4,451.4 M813.4,440.6 L802.6,451.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="832" y="436" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Thumbnails</text>
<text x="832" y="458" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">The pictures shown while scrubbing</text>
<rect x="400" y="496" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="428" cy="536" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M422.6,530.6 L433.4,541.4 M433.4,530.6 L422.6,541.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="452" y="526" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Live TV</text>
<text x="452" y="548" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Starting a channel and every piece of it</text>
<rect x="780" y="496" width="360" height="80" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
<circle cx="808" cy="536" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M802.6,530.6 L813.4,541.4 M813.4,530.6 L802.6,541.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="832" y="526" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Plugins</text>
<text x="832" y="548" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Anything a plugin serves, apart from public</text>
<text x="832" y="564" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">sign-in pictures</text>
<text x="40" y="622" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Each door reads the account's settings as they are now, on every request. Switching playback off takes effect on the next request, even in an app that is</text>
<text x="40" y="642" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">already open.</text>
</svg>
