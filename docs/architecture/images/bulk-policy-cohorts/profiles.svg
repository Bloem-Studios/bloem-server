<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">What happens to profiles</title>
<desc id="d">An account on policy A with three profiles: two follow the account and one, Kids, has a policy of its own. After moving the account to policy B, the two that follow it move to B and Kids stays on its own policy, unless Move custom profiles too was ticked.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="519" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">What happens to profiles</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Profiles that follow the account move with it. A profile with its own policy stays, unless you say so.</text>
<rect x="40" y="124" width="480" height="290" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<text x="64" y="160" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Before</text>
<rect x="346" y="140" width="150" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="421.0" y="157.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Account: policy A</text>
<rect x="64" y="186" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="84" y="211" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Anna</text>
<text x="84" y="232" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">follows the account</text>
<rect x="398" y="201" width="82" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="439.0" y="218.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">policy A</text>
<rect x="64" y="258" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="84" y="283" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Tom</text>
<text x="84" y="304" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">follows the account</text>
<rect x="398" y="273" width="82" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="439.0" y="290.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">policy A</text>
<rect x="64" y="330" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="84" y="355" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Kids</text>
<text x="84" y="376" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">a policy of its own (custom)</text>
<rect x="375" y="345" width="105" height="26" rx="13.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="427.5" y="362.68" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">Kids policy</text>
<line x1="528" y1="268" x2="676" y2="268" stroke="#9CA3AF" stroke-width="3" marker-end="url(#arrow)"/>
<text x="602" y="252" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Move to B</text>
<rect x="680" y="124" width="480" height="290" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<text x="704" y="160" font-size="18" font-weight="700" fill="#101827" text-anchor="start">After</text>
<rect x="986" y="140" width="150" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="1061.0" y="157.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">Account: policy B</text>
<rect x="704" y="186" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="724" y="211" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Anna</text>
<text x="724" y="232" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">moved with the account</text>
<rect x="1038" y="201" width="82" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="1079.0" y="218.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">policy B</text>
<rect x="704" y="258" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="724" y="283" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Tom</text>
<text x="724" y="304" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">moved with the account</text>
<rect x="1038" y="273" width="82" height="26" rx="13.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="1079.0" y="290.68" font-size="13" font-weight="600" fill="#0F766E" text-anchor="middle">policy B</text>
<rect x="704" y="330" width="432" height="58" rx="12" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="724" y="355" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Kids</text>
<text x="724" y="376" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">stayed (box not ticked)</text>
<rect x="1015" y="345" width="105" height="26" rx="13.0" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
<text x="1067.5" y="362.68" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">Kids policy</text>
<text x="40" y="470" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">Tick “Move custom profiles too” to move Kids as well. It is off unless you turn it on.</text>
</svg>
