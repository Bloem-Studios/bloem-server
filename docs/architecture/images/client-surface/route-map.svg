<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="781" viewBox="0 0 1200 781" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">The parts of Bloem's native API</title>
<desc id="d">Four bands, one for each kind of credential. Public routes need nothing. Viewer routes need an account sign-in and a chosen profile. A few routes need the account sign-in alone. Administration needs an administrator pass, or an administrator's API key on the storefront's platform routes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="780" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">The parts of Bloem's native API</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Everything under /api/bloem/v1, grouped by what a caller must show to use it.</text>
<rect x="40" y="120" width="1120" height="120" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="64" y="158" font-size="19" font-weight="700" fill="#374151" text-anchor="start">Public</text>
<text x="64" y="184" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Nothing: a client asks before it signs</text>
<text x="64" y="203" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">in.</text>
<rect x="360" y="142" width="124" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="422.0" y="160.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/capabilities</text>
<rect x="494" y="142" width="147" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="567.5" y="160.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/server/identity</text>
<rect x="651" y="142" width="147" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="724.5" y="160.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/ambience/public</text>
<rect x="808" y="142" width="194" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="905.0" y="160.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/ambience/assets/{ref}</text>
<rect x="360" y="178.5" width="155" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="437.5" y="196.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/preview/sessions</text>
<rect x="525" y="178.5" width="139" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="594.5" y="196.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/preview/status</text>
<rect x="40" y="256" width="1120" height="141.5" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<text x="64" y="294" font-size="19" font-weight="700" fill="#047857" text-anchor="start">Viewer</text>
<text x="64" y="320" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">An account sign-in and X-Profile-Id,</text>
<text x="64" y="339" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">with the PIN proof when needed.</text>
<rect x="360" y="278" width="108" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="414.0" y="296.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/watch/home</text>
