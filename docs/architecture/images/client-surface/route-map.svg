<text x="492.5" y="332.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/catalog/items/{id}/collections</text>
<rect x="635" y="314.5" width="132" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="701.0" y="332.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/notifications</text>
<rect x="777" y="314.5" width="108" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="831.0" y="332.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/livetv/...</text>
<rect x="895" y="314.5" width="92" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="941.0" y="332.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/ambience</text>
<rect x="997" y="314.5" width="108" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="1051.0" y="332.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/promotions</text>
<rect x="360" y="351.0" width="132" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="426.0" y="369.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/book-requests</text>
<rect x="502" y="351.0" width="139" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="571.5" y="369.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/ebook-requests</text>
<rect x="40" y="413.5" width="1120" height="120" rx="16" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.6"/>
<text x="64" y="451.5" font-size="19" font-weight="700" fill="#0369A1" text-anchor="start">Account only</text>
<text x="64" y="477.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">An account sign-in, no administrator</text>
<text x="64" y="496.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">pass.</text>
<rect x="360" y="435.5" width="132" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="426.0" y="453.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/organizations</text>
<rect x="502" y="435.5" width="132" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="568.0" y="453.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/admin/session</text>
<rect x="644" y="435.5" width="218" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="753.0" y="453.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/profile-credentials/{id}</text>
<rect x="40" y="549.5" width="1120" height="141.5" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<text x="64" y="587.5" font-size="19" font-weight="700" fill="#4338CA" text-anchor="start">Administration</text>
<text x="64" y="613.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">An administrator pass from</text>
<text x="64" y="632.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">/admin/session; some platform routes</text>
<text x="64" y="651.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">also take an administrator's API key.</text>
<rect x="360" y="571.5" width="202" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
