<rect x="603" y="644.5" width="288" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="747.0" y="662.61" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/admin/platform/native-storage/...</text>
<text x="40" y="737.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Profile sign-ins reach only the book request routes here. A route that is not built on this server answers 404; capabilities say what this build can do.</text>
</svg>
