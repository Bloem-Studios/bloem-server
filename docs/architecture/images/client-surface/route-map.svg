<rect x="919" y="278" width="124" height="26.5" rx="13.25" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="981.0" y="296.11" font-size="13.5" font-weight="600" fill="#101827" text-anchor="middle">/persons/{id}</text>
