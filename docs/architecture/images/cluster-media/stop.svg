<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Stopping playback frees a screen at once</title>
<desc id="d">Three steps: the viewer presses stop, and only the profile that started the video may stop it; the stop is written to the database and the screen it held is freed in the same step, on every server; within about fifteen seconds the server that was streaming notices the stop and tidies up.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="439" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Stopping playback frees a screen at once</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">The screen is free the moment the stop is saved. The tidying up follows within seconds.</text>
<rect x="40" y="128" width="352" height="176" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<circle cx="68" cy="158" r="13" fill="#10B981"/>
<text x="68" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="58" y="206" font-size="18" font-weight="700" fill="#101827" text-anchor="start">The viewer presses stop</text>
<text x="58" y="236" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Only the profile that started the video may</text>
<text x="58" y="256" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">stop it. Another profile on the account is</text>
<text x="58" y="276" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">refused.</text>
<line x1="396" y1="216.0" x2="420" y2="216.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424" y="128" width="352" height="176" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
<circle cx="452" cy="158" r="13" fill="#6366F1"/>
<text x="452" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="442" y="206" font-size="18" font-weight="700" fill="#101827" text-anchor="start">The stop is saved</text>
<text x="442" y="236" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Written to the database. The screen it held</text>
<text x="442" y="256" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">is freed in the same step, on every server.</text>
<line x1="780" y1="216.0" x2="804" y2="216.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="808" y="128" width="352" height="176" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.5"/>
<circle cx="836" cy="158" r="13" fill="#FA6400"/>
<text x="836" y="163" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="826" y="206" font-size="18" font-weight="700" fill="#101827" text-anchor="start">The server tidies up</text>
<text x="826" y="236" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Within about 15 seconds the server that was</text>
<text x="826" y="256" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">streaming notices, stops the stream and</text>
<text x="826" y="276" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">removes its files.</text>
<text x="584.0" y="338" font-size="14" font-weight="600" fill="#4338CA" text-anchor="middle">Screen free here</text>
<text x="40" y="400" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">If the database cannot be reached, Bloem waits rather than guessing that a session has stopped.</text>
</svg>
