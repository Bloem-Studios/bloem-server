<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How Bloem keeps up with Silo</title>
<desc id="d">A merge bot takes each batch of Silo's work. Silo's main has new commits and has been quiet for 30 minutes; a free check every 10 minutes starts one batch at a time, each in its own T3 thread the owner can watch and answer; the merge takes Silo's side of every conflict. If Bloem still works, after the review list and the full local gate, the merge is pushed to Bloem's main, Bloem CI checks that exact commit, the bot deploys it, writes the receipt and sends one message. If not, Bloem adapts on its own lines with a test. When a check cannot be fixed, Bloem cannot keep working without editing Silo's lines, CI stays red or the deploy fails, the bot stops in its thread and blocks the next batch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="739" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How Bloem keeps up with Silo</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">A merge bot takes in each batch of Silo's work, checks that Bloem still works, and deploys it.</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Each Silo batch</text>
<rect x="40" y="156" width="260" height="120" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.8"/>
<text x="58" y="188" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Silo's main</text>
<text x="58" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">New commits, then 30 quiet</text>
<text x="58" y="232" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">minutes. The batch is all of it.</text>
<line x1="304" y1="216" x2="322" y2="216" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="326" y="156" width="260" height="120" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="344" y="188" font-size="17" font-weight="700" fill="#101827" text-anchor="start">The check</text>
<text x="344" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Every 10 minutes, at no cost.</text>
<text x="344" y="232" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">One batch at a time.</text>
<line x1="590" y1="216" x2="608" y2="216" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="156" width="260" height="120" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="630" y="188" font-size="17" font-weight="700" fill="#101827" text-anchor="start">One thread per batch</text>
<text x="630" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Its own T3 thread, which the</text>
<text x="630" y="232" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">owner can watch and answer.</text>
<line x1="876" y1="216" x2="894" y2="216" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="898" y="156" width="260" height="120" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="916" y="188" font-size="17" font-weight="700" fill="#101827" text-anchor="start">The merge</text>
<text x="916" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo wins every conflict, word</text>
<text x="916" y="232" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">for word.</text>
<line x1="1028" y1="278" x2="1028" y2="300" stroke="#9CA3AF" stroke-width="2"/>
<line x1="1028" y1="300" x2="130" y2="300" stroke="#9CA3AF" stroke-width="2"/>
<line x1="130" y1="300" x2="130" y2="318" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M130,322 L220,388 L130,454 L40,388 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
<text x="130" y="384" font-size="14" font-weight="700" fill="#101827" text-anchor="middle">Does Bloem</text>
<text x="130" y="402" font-size="14" font-weight="700" fill="#101827" text-anchor="middle">still work?</text>
<line x1="224" y1="388" x2="254" y2="388" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="239" y="378" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">Yes</text>
<rect x="258" y="322" width="210" height="132" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="276" y="354" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem's main</text>
<text x="276" y="378" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Pushed once the review</text>
<text x="276" y="398" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">and the full local gate</text>
<text x="276" y="418" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">pass.</text>
<line x1="472" y1="388" x2="494" y2="388" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="498" y="322" width="210" height="132" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="516" y="354" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem CI</text>
<text x="516" y="378" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">On that exact commit. A</text>
<text x="516" y="398" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">failed job runs once</text>
<text x="516" y="418" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">more.</text>
<line x1="712" y1="388" x2="734" y2="388" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="738" y="322" width="200" height="132" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
<text x="756" y="354" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Deploy</text>
<text x="756" y="378" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Only a commit CI</text>
<text x="756" y="398" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">passed. A snapshot and</text>
<text x="756" y="418" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">a restore point first.</text>
<line x1="942" y1="388" x2="964" y2="388" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="968" y="322" width="192" height="132" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="986" y="354" font-size="17" font-weight="700" fill="#101827" text-anchor="start">One message</text>
<text x="986" y="378" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The receipt, then</text>
<text x="986" y="398" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">deployed, stuck or</text>
<text x="986" y="418" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">rolled back.</text>
<line x1="130" y1="458" x2="130" y2="510" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="142" y="490" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start">No</text>
<rect x="40" y="514" width="330" height="166" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="58" y="546" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem adapts</text>
<text x="58" y="570" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Where Silo's change would break Bloem,</text>
<text x="58" y="590" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem's behavior goes back on its own</text>
<text x="58" y="610" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">lines, with a test that fails without it.</text>
<text x="58" y="630" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Then every check again.</text>
<line x1="374" y1="597" x2="456" y2="597" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="415" y="585" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="middle">cannot fix</text>
<line x1="603.0" y1="458" x2="603.0" y2="510" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="613.0" y="490" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">stays red</text>
<line x1="838.0" y1="458" x2="838.0" y2="510" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="848.0" y="490" font-size="12.5" font-weight="700" fill="#B91C1C" text-anchor="start">fails or rolls back</text>
<rect x="460" y="514" width="700" height="166" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
<text x="478" y="546" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Stops for the owner</text>
<text x="478" y="570" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">The bot stops in its thread, writes what failed, what it tried and what it suggests, and</text>
<text x="478" y="590" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">sends the stuck message. No new batch starts until the owner answers in that thread or</text>
<text x="478" y="610" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">releases it. A change to Silo's lines is never the way out.</text>
</svg>
