<line x1="670" y1="250" x2="745" y2="340" stroke="#FA6400" stroke-width="3"/>
<line x1="745" y1="340" x2="1130" y2="340" stroke="#FA6400" stroke-width="3"/>
<circle cx="745" cy="340" r="9" fill="#FA6400"/>
<circle cx="820" cy="340" r="9" fill="#FA6400"/>
<circle cx="970" cy="340" r="9" fill="#FA6400"/>
<circle cx="1120" cy="340" r="9" fill="#FA6400"/>
