<circle cx="1045" cy="340" r="14" fill="#FFFFFF" stroke="#FA6400" stroke-width="2"/>
<circle cx="1045" cy="340" r="9" fill="#FA6400"/>
<text x="902" y="298" font-size="12.5" font-weight="normal" fill="#075985" text-anchor="start">merge</text>
<text x="1052" y="298" font-size="12.5" font-weight="normal" fill="#075985" text-anchor="start">merge</text>
<circle cx="656" cy="415" r="10" fill="#10B981"/>
<path d="M651.5,415.2 L655.0,418.8 L661.0,411.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="420" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Bloem's main shares Silo's history.</text>
<circle cx="656" cy="461" r="10" fill="#10B981"/>
<path d="M651.5,461.2 L655.0,464.8 L661.0,457.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="466" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Silo's work comes in as ordinary merges, daily.</text>
<circle cx="656" cy="507" r="10" fill="#10B981"/>
<path d="M651.5,507.2 L655.0,510.8 L661.0,503.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="512" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">The module path stays Silo's own.</text>
<circle cx="652" cy="562" r="9" fill="#0284C7"/>
<text x="668" y="567" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's commit</text>
<circle cx="790" cy="562" r="9" fill="#FA6400"/>
<text x="806" y="567" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem's own commit</text>
<circle cx="966" cy="562" r="14" fill="#FFFFFF" stroke="#FA6400" stroke-width="2"/>
<circle cx="966" cy="562" r="9" fill="#FA6400"/>
<text x="986" y="567" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">Silo merged in</text>
<text x="40" y="630" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Renaming the module path could still happen any time. Losing the ability to merge could not be undone, so the module path stays</text>
<text x="40" y="650" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">github.com/Silo-Server/silo-server.</text>
