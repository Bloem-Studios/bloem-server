<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">A tracking fork, not a copy</title>
<desc id="d">Left: the hard fork Bloem tried first, a new first commit with no link to Silo's history and the module renamed in 1,178 files, so every Silo change had to be copied by hand. Right: the tracking fork Bloem is, sharing Silo's history, with Silo's work merged in again and again beside Bloem's own commits.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="699" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">A tracking fork, not a copy</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem shares Silo's history, so each Silo change is merged in rather than copied by hand.</text>
<rect x="40" y="124" width="540" height="470" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="64" y="162" font-size="19" font-weight="700" fill="#101827" text-anchor="start">Tried first, and dropped</text>
<text x="64" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">A hard fork</text>
<text x="64" y="226" font-size="13.5" font-weight="600" fill="#075985" text-anchor="start">Silo's history</text>
<line x1="90" y1="250" x2="540" y2="250" stroke="#0284C7" stroke-width="3"/>
<circle cx="100" cy="250" r="9" fill="#0284C7"/>
