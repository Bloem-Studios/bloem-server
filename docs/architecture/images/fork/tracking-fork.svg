<circle cx="380" cy="340" r="9" fill="#FA6400"/>
<circle cx="450" cy="340" r="9" fill="#FA6400"/>
<circle cx="520" cy="340" r="9" fill="#FA6400"/>
<line x1="380" y1="262" x2="380" y2="326" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="380" cy="295" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M374.6,289.6 L385.4,300.4 M385.4,289.6 L374.6,300.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="76" cy="415" r="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.5,410.5 L80.5,419.5 M80.5,410.5 L71.5,419.5" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="420" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">A new first commit, with no link to Silo's history.</text>
<circle cx="76" cy="461" r="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.5,456.5 L80.5,465.5 M80.5,456.5 L71.5,465.5" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="466" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">The module path renamed: 1,178 files changed.</text>
<circle cx="76" cy="507" r="10" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.5,502.5 L80.5,511.5 M80.5,502.5 L71.5,511.5" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="96" y="512" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Every Silo change copied by hand, and in conflict.</text>
<text x="64" y="566" font-size="13.5" font-weight="normal" fill="#6B7280" text-anchor="start">Replaced on 13 August 2026</text>
<rect x="620" y="124" width="540" height="470" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="644" y="162" font-size="19" font-weight="700" fill="#101827" text-anchor="start">What Bloem is</text>
<text x="644" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">A tracking fork</text>
<text x="644" y="226" font-size="13.5" font-weight="600" fill="#075985" text-anchor="start">Silo's history</text>
<line x1="660" y1="250" x2="1130" y2="250" stroke="#0284C7" stroke-width="3"/>
<circle cx="670" cy="250" r="9" fill="#0284C7"/>
