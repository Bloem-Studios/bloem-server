<circle cx="240" cy="250" r="9" fill="#0284C7"/>
<circle cx="310" cy="250" r="9" fill="#0284C7"/>
<circle cx="380" cy="250" r="9" fill="#0284C7"/>
<circle cx="450" cy="250" r="9" fill="#0284C7"/>
<circle cx="520" cy="250" r="9" fill="#0284C7"/>
<text x="64" y="316" font-size="13.5" font-weight="600" fill="#C2410C" text-anchor="start">Bloem, as a copy</text>
<line x1="100" y1="340" x2="540" y2="340" stroke="#FA6400" stroke-width="3"/>
<circle cx="100" cy="340" r="14" fill="#FFFFFF" stroke="#FA6400" stroke-width="2"/>
<circle cx="100" cy="340" r="9" fill="#FA6400"/>
