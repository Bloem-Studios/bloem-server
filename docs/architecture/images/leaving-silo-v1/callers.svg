<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Who still calls Silo's /api/v1</title>
<desc id="d">A grid. Rows are the apps that talk to a Bloem server: the storefront, the web app, Bloem's phone and TV apps, and Silo's own apps. Columns are Silo's /api/v1, Silo's /api/v2 and Bloem's /api/bloem/v1. The storefront and the web app left /api/v1 on 31 October and 1 November 2026; Bloem's phone and TV apps still call part of it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Who still calls Silo's /api/v1</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Silo will retire /api/v1. Each caller moves to Silo's /api/v2 or to Bloem's own API.</text>
<rect x="334" y="118" width="268" height="64" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
<text x="468.0" y="146" font-size="16" font-weight="700" fill="#101827" text-anchor="middle">Silo's /api/v1</text>
<text x="468.0" y="168" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="middle">Frozen; to be retired</text>
<rect x="610" y="118" width="268" height="64" rx="12" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
<text x="744.0" y="146" font-size="16" font-weight="700" fill="#101827" text-anchor="middle">Silo's /api/v2</text>
<text x="744.0" y="168" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="middle">Silo's stable API</text>
<rect x="886" y="118" width="268" height="64" rx="12" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.6"/>
<text x="1020.0" y="146" font-size="16" font-weight="700" fill="#101827" text-anchor="middle">Bloem's /api/bloem/v1</text>
<text x="1020.0" y="168" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="middle">Bloem's own features</text>
<rect x="40" y="198" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="232" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">The storefront</text>
<text x="60" y="254" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem Garden</text>
<rect x="334" y="198" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="360" cy="237.0" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M354.6,231.6 L365.4,242.4 M365.4,231.6 L354.6,242.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="382" y="242.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Left on 31 October 2026</text>
<rect x="610" y="198" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="636" cy="237.0" r="12" fill="#10B981"/>
<path d="M630.6,237.24 L634.8,241.56 L642.0,232.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="658" y="242.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Accounts, libraries, sessions</text>
<rect x="886" y="198" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="912" cy="237.0" r="12" fill="#10B981"/>
<path d="M906.6,237.24 L910.8,241.56 L918.0,232.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="934" y="242.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Organizations, plans, messages</text>
<rect x="40" y="286" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="320" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">The web app</text>
<text x="60" y="342" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">In the browser</text>
<rect x="334" y="286" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="360" cy="325.0" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M354.6,319.6 L365.4,330.4 M365.4,319.6 L354.6,330.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="382" y="330.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Left on 1 November 2026</text>
<rect x="610" y="286" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="636" cy="325.0" r="12" fill="#10B981"/>
<path d="M630.6,325.24 L634.8,329.56 L642.0,320.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="658" y="330.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Through Silo's own web code</text>
<rect x="886" y="286" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="912" cy="325.0" r="12" fill="#10B981"/>
<path d="M906.6,325.24 L910.8,329.56 L918.0,320.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="934" y="330.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Live TV, campaigns, seasons</text>
<rect x="40" y="374" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="408" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Bloem's phone and TV apps</text>
<text x="60" y="430" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Android and Apple</text>
<rect x="334" y="374" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="360" cy="413.0" r="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
<path d="M354.6,413.0 L365.4,413.0" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
<text x="382" y="409.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Campaigns, remote control,</text>
<text x="382" y="427.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">profile sign-in</text>
<rect x="610" y="374" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="636" cy="413.0" r="12" fill="#10B981"/>
<path d="M630.6,413.24 L634.8,417.56 L642.0,408.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="658" y="418.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Most screens</text>
<rect x="886" y="374" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="912" cy="413.0" r="12" fill="#10B981"/>
<path d="M906.6,413.24 L910.8,417.56 L918.0,408.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="934" y="418.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Watch, people, server identity</text>
<rect x="40" y="462" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="496" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Silo's own apps</text>
<text x="60" y="518" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Built for Silo</text>
<rect x="334" y="462" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="360" cy="501.0" r="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5"/>
<path d="M354.6,501.0 L365.4,501.0" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
<text x="382" y="506.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">At most a health check</text>
<rect x="610" y="462" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="636" cy="501.0" r="12" fill="#10B981"/>
<path d="M630.6,501.24 L634.8,505.56 L642.0,496.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="658" y="506.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Everything they use</text>
<rect x="886" y="462" width="268" height="78" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="912" cy="501.0" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M906.6,495.6 L917.4,506.4 M917.4,495.6 L906.6,506.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="934" y="506.0" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">They know nothing of it</text>
<text x="40" y="580" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">When Silo answers /api/v1 with 410 Gone, the routes Bloem still keeps there go with it. Each one already has a replacement, or gets one when the phone apps</text>
<text x="40" y="600" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">move.</text>
</svg>
