<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where Live TV comes from</title>
<desc id="d">Three kinds of source, a network tuner, Dispatcharr and an Xtream provider, feed channels into Bloem, which adds a programme guide and a recorder. Bloem's own apps and the web app show Live TV; Silo's apps and Jellyfin apps do not.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Where Live TV comes from</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">A platform administrator connects the sources. Bloem turns them into channels with a guide.</text>
<text x="40" y="136" font-size="17" font-weight="700" fill="#101827" text-anchor="start">The sources</text>
<rect x="40" y="152" width="380" height="148" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
<text x="58" y="184" font-size="17" font-weight="700" fill="#101827" text-anchor="start">A tuner on your network</text>
<text x="58" y="208" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">A SiliconDust HDHomeRun box on an antenna or</text>
<text x="58" y="228" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">cable. Bloem finds it on the network, or you</text>
<text x="58" y="248" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">give its address.</text>
<line x1="424" y1="226" x2="486" y2="226" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="320" width="380" height="148" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
<text x="58" y="352" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Dispatcharr</text>
<text x="58" y="376" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">A program that makes IPTV sources look like an</text>
<text x="58" y="396" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">HDHomeRun tuner, so Bloem treats it as one.</text>
<line x1="424" y1="394" x2="486" y2="394" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="488" width="380" height="148" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
<text x="58" y="520" font-size="17" font-weight="700" fill="#101827" text-anchor="start">An Xtream provider</text>
<text x="58" y="544" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">A paid IPTV service on the internet. Bloem</text>
<text x="58" y="564" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">takes its live channels only, never its films</text>
<text x="58" y="584" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">or series, and stores its password encrypted.</text>
<line x1="424" y1="562" x2="486" y2="562" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="490" y="152" width="340" height="484" rx="18" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<text x="660" y="190" font-size="22" font-weight="700" fill="#101827" text-anchor="middle">Bloem</text>
<rect x="510" y="212" width="300" height="128" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.4"/>
<text x="528" y="242" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Channels</text>
<text x="528" y="266" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Each source's channels. An</text>
<text x="528" y="285" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">administrator can adjust them or switch</text>
<text x="528" y="304" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">them off.</text>
<rect x="510" y="352" width="300" height="128" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.4"/>
<text x="528" y="382" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Programme guide</text>
<text x="528" y="406" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">From Schedules Direct, an XML lineup or</text>
<text x="528" y="425" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">the Xtream provider's own guide. Up to</text>
<text x="528" y="444" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">three guides at once.</text>
<rect x="510" y="492" width="300" height="128" rx="12" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.4"/>
<text x="528" y="522" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Recorder</text>
<text x="528" y="546" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Records a programme or a whole series</text>
<text x="528" y="565" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">to a folder on the server.</text>
<text x="890" y="136" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Where viewers watch</text>
<line x1="834" y1="330" x2="886" y2="260" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="890" y="152" width="270" height="214" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<circle cx="918" cy="184" r="12" fill="#10B981"/>
<path d="M912.6,184.24 L916.8,188.56 L924.0,179.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="940" y="190" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem's apps</text>
<text x="910" y="220" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The web app and Bloem's Android</text>
<text x="910" y="240" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">and Apple apps: the channel list,</text>
<text x="910" y="260" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">the guide, live playback and</text>
<text x="910" y="280" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">recordings.</text>
<line x1="834" y1="470" x2="886" y2="500" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="890" y="420" width="270" height="216" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
<circle cx="918" cy="452" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M912.6,446.6 L923.4,457.4 M923.4,446.6 L912.6,457.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="940" y="458" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Other apps</text>
<text x="910" y="488" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's own apps, and Jellyfin and</text>
<text x="910" y="508" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Audiobookshelf apps, get no Live</text>
<text x="910" y="528" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">TV. They do not know Bloem's Live</text>
<text x="910" y="548" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">TV and Bloem does not offer it to</text>
<text x="910" y="568" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">them.</text>
<text x="40" y="680" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Bloem only plays channels from a source an administrator set up. It never plays a web address someone pastes in, and it does not import an IPTV provider's films</text>
<text x="40" y="700" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">or series.</text>
</svg>
