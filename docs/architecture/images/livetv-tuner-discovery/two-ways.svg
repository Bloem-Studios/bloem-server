<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Two ways Bloem finds a tuner</title>
<desc id="d">Left: Search my network. Bloem sends a broadcast on UDP port 65001, and HDHomeRun tuners and Dispatcharr answer; each answer is checked over HTTP and listed, with tuners already added marked Added. Right: tuner address only, or adding a tuner by address. Bloem tries discover.json at the usual places, including Dispatcharr's /hdhr/ path and port 9191, and stores the tuner's identity from the answer. Below: an Xtream provider is added with its own form instead.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Two ways Bloem finds a tuner</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Listen for tuners on the local network, or try the address you give. Either way, Bloem checks first.</text>
<rect x="40" y="124" width="540" height="476" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="64" y="160" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Search my network</text>
<text x="64" y="184" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Needs Bloem on the local network itself.</text>
<rect x="64" y="208" width="200" height="92" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="82" y="240" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Bloem</text>
<text x="82" y="264" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Broadcasts a question.</text>
<rect x="356" y="208" width="200" height="92" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
<text x="374" y="240" font-size="17" font-weight="700" fill="#101827" text-anchor="start">HDHomeRun</text>
<text x="374" y="264" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">on an antenna or cable</text>
<rect x="356" y="314" width="200" height="92" rx="14" fill="#FDF2F8" stroke="#DB2777" stroke-width="1.8"/>
<text x="374" y="346" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Dispatcharr</text>
<text x="374" y="370" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">pretending to be one</text>
<path d="M268,246 C300,246 320,254 352,254" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
<path d="M268,262 C300,262 320,354 352,354" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
<text x="196" y="340" font-size="13.5" font-weight="600" fill="#6B7280" text-anchor="start">UDP port 65001</text>
<circle cx="80" cy="435" r="12" fill="#10B981"/>
<text x="80" y="440" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="102" y="440" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Each answer is checked over HTTP.</text>
<circle cx="80" cy="475" r="12" fill="#10B981"/>
<text x="80" y="480" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="102" y="480" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Found tuners are listed; ones already added say Added.</text>
<circle cx="80" cy="515" r="12" fill="#10B981"/>
<text x="80" y="520" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="102" y="520" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">You press Add.</text>
<text x="64" y="574" font-size="13.5" font-weight="normal" fill="#6B7280" text-anchor="start">In Docker, a bridge network usually can't broadcast to the local network.</text>
<rect x="620" y="124" width="540" height="476" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="644" y="160" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Tuner address</text>
<text x="644" y="184" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">You give a host or base address; Bloem tries, in order:</text>
<rect x="644" y="214" width="492" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
<text x="660" y="240" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#101827">{base}/hdhr/discover.json</text>
<rect x="644" y="264" width="492" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
<text x="660" y="290" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#101827">{base}/discover.json</text>
<rect x="644" y="314" width="492" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
<text x="660" y="340" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#101827">http://{host}:9191/hdhr/discover.json</text>
<rect x="644" y="364" width="492" height="40" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
<text x="660" y="390" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#101827">https://{host}:9191/hdhr/discover.json</text>
<text x="644" y="430" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">An address ending in /discover.json is used as given; one ending in</text>
<text x="644" y="449" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">/hdhr gets /discover.json added. The port 9191 tries are skipped when</text>
<text x="644" y="468" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">you already gave 9191.</text>
<circle cx="656" cy="514" r="11" fill="#10B981"/>
<path d="M651.05,514.22 L654.9,518.18 L661.5,510.15" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="519" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">The first answer gives the tuner's identity. You never type a</text>
<text x="676" y="539" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">device ID.</text>
<rect x="40" y="624" width="1120" height="96" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
<text x="64" y="658" font-size="17" font-weight="700" fill="#101827" text-anchor="start">An Xtream provider is different</text>
<text x="64" y="686" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">It is a service on the internet, added with its own form and a username and password. It needs outgoing HTTP(S), not discovery or host networking.</text>
</svg>
