<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Five ways Bloem talks to viewers</title>
<desc id="d">Five cards: announcements in the inbox, promotion cards on Home and before playback, playback cards during a video, seasonal effects on Home and the sign-in page, and the upgrade prompt. Each says where it appears, who writes it and its main rule.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="667" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Five ways Bloem talks to viewers</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Silo has the inbox. Bloem adds what goes into it, and a few things around it.</text>
<rect x="40" y="124" width="360" height="224" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
<text x="60" y="162" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Announcements</text>
<text x="60" y="188" font-size="11.5" font-weight="700" fill="#4338CA" text-anchor="start" letter-spacing="0.8">IN THE INBOX</text>
<text x="60" y="220" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">An administrator writes a message for</text>
<text x="60" y="241" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">everyone, an account role, an organization,</text>
<text x="60" y="262" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">people with a library, or chosen accounts.</text>
<text x="60" y="283" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Information, warning or critical; a critical</text>
<text x="60" y="304" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">one cannot be dismissed. It can expire.</text>
<rect x="420" y="124" width="360" height="224" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.8"/>
<text x="440" y="162" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Promotion cards</text>
<text x="440" y="188" font-size="11.5" font-weight="700" fill="#86198F" text-anchor="start" letter-spacing="0.8">ON HOME, A TITLE'S PAGE OR BEFORE IT PLAYS</text>
<text x="440" y="220" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">A campaign card with artwork and a button.</text>
<text x="440" y="241" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Home cards are off by default. Children</text>
<text x="440" y="262" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">never see them, and “Continue” is always</text>
<text x="440" y="283" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">there before playback.</text>
<rect x="800" y="124" width="360" height="224" rx="16" fill="#FDF4FF" stroke="#C026D3" stroke-width="1.8"/>
<text x="820" y="162" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Playback cards</text>
<text x="820" y="188" font-size="11.5" font-weight="700" fill="#86198F" text-anchor="start" letter-spacing="0.8">OVER THE VIDEO, AT A CHAPTER</text>
<text x="820" y="220" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">A short card that floats over the picture</text>
<text x="820" y="241" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">for 5 to 60 seconds. It never pauses the</text>
<text x="820" y="262" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">video or takes the sound. Adults only. The</text>
<text x="820" y="283" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">viewer can save it to their inbox.</text>
<rect x="40" y="368" width="360" height="260" rx="16" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="60" y="406" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Seasonal effects</text>
<text x="60" y="432" font-size="11.5" font-weight="700" fill="#0F766E" text-anchor="start" letter-spacing="0.8">ON HOME AND THE SIGN-IN PAGE</text>
<text x="60" y="464" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Snow, banners or small pictures for a</text>
<text x="60" y="485" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">season, switched on and off by a yearly</text>
<text x="60" y="506" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">calendar. Hidden while a video plays.</text>
<rect x="420" y="368" width="360" height="260" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.8"/>
<text x="440" y="406" font-size="20" font-weight="700" fill="#101827" text-anchor="start">Upgrade prompt</text>
<text x="440" y="432" font-size="11.5" font-weight="700" fill="#B45309" text-anchor="start" letter-spacing="0.8">IN THE INBOX, WHEN A STREAM IS REFUSED</text>
<text x="440" y="464" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">When every screen on the plan is busy, an</text>
<text x="440" y="485" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">offer to upgrade. At most once a day per</text>
<text x="440" y="506" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">profile.</text>
<rect x="800" y="368" width="360" height="260" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="820" y="406" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Who writes them</text>
<text x="820" y="436" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">A platform administrator, in the admin</text>
<text x="820" y="456" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">console. Announcements are under</text>
<text x="820" y="476" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Integrations; campaigns and seasonal packs</text>
<text x="820" y="496" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">under Campaigns &amp; seasonal packs.</text>
<text x="820" y="528" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The storefront (Bloem Garden) can write</text>
<text x="820" y="548" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">campaigns and seasonal packs too. Bloem</text>
<text x="820" y="568" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">stores them, so they keep working when the</text>
<text x="820" y="588" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">storefront is offline.</text>
</svg>
