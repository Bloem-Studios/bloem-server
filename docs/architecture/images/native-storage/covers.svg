<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where a stored book's cover comes from</title>
<desc id="d">An app asks for a cover with a signed address that stays the same for a week. Bloem first checks that the viewer may still see the book; if not, there is no cover. Then it serves a kept copy, or a copy from the optional cover cache, or reads the cover once from the source, at most 16 at a time on each server, and keeps a copy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="619" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Where a stored book's cover comes from</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Every request is checked against the viewer first. The source is read only once per cover.</text>
<rect x="40" y="128" width="300" height="112" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.8"/>
<text x="58" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">The app asks</text>
<text x="58" y="184" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">With a signed cover address. It</text>
<text x="58" y="204" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">stays the same for a week, so apps</text>
<text x="58" y="224" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">keep the cover.</text>
<line x1="344" y1="184" x2="396" y2="184" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="400" y="128" width="360" height="112" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
<text x="418" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">May this viewer see the book?</text>
<text x="418" y="184" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Checked on every request, before any copy is</text>
<text x="418" y="204" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">served.</text>
<line x1="764" y1="184" x2="816" y2="184" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="780" y="174" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">No</text>
<rect x="820" y="128" width="340" height="112" rx="14" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
<text x="838" y="160" font-size="17" font-weight="700" fill="#101827" text-anchor="start">No cover</text>
<text x="838" y="184" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">A hidden or removed book, or a viewer</text>
<text x="838" y="204" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">whose access was taken away, gets none.</text>
<path d="M 580 244 L 580 266 L 215 266 L 215 300" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<text x="594" y="260" font-size="14" font-weight="700" fill="#047857" text-anchor="start">Yes</text>
<rect x="40" y="304" width="350" height="124" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="58" y="336" font-size="17" font-weight="700" fill="#101827" text-anchor="start">1. A kept copy</text>
<text x="58" y="360" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem keeps each cover anyone has viewed in</text>
<text x="58" y="380" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">artwork storage. Served from there.</text>
<line x1="394" y1="366" x2="421" y2="366" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="425" y="304" width="350" height="124" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="443" y="336" font-size="17" font-weight="700" fill="#101827" text-anchor="start">2. The cover cache</text>
<text x="443" y="360" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">An optional Redis of its own. Checked when</text>
<text x="443" y="380" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">there is no kept copy.</text>
<line x1="779" y1="366" x2="806" y2="366" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="810" y="304" width="350" height="124" rx="14" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.8"/>
<text x="828" y="336" font-size="17" font-weight="700" fill="#101827" text-anchor="start">3. Read from the source</text>
<text x="828" y="360" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Once, shared by everyone asking at that</text>
<text x="828" y="380" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">moment. At most 16 at a time on each</text>
<text x="828" y="400" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">server. Then a copy is kept.</text>
<text x="40" y="460" font-size="14.5" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem tries them in this order and stops at the first that has the cover.</text>
<rect x="40" y="484" width="1120" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="62" y="516" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Good to know</text>
<text x="62" y="542" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">A changed cover gets a new address, so nobody sees an old one. A daily task removes kept copies that no book uses any more. If the source is</text>
<text x="62" y="562" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">unavailable, apps show a blurred placeholder.</text>
</svg>
