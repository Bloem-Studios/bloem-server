<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How Bloem decides what someone may reach</title>
<desc id="d">Four steps: Bloem works out who is asking from the sign-in, loads that organization's facts from the database, asks the built-in policy engine, and applies the answer in the database query that reads the catalog or starts playback. Below, the failures that refuse the request instead of guessing.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="639" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How Bloem decides what someone may reach</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">The database holds the facts, the policy engine decides, and the query applies the answer.</text>
<rect x="40" y="124" width="262" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="40" y="124" width="8" height="150" rx="4" fill="#10B981" stroke="none" stroke-width="1.5"/>
<circle cx="74" cy="152" r="12" fill="#10B981"/>
<text x="74" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="96" y="158" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Who is asking?</text>
<text x="64" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The account, the profile and</text>
<text x="64" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">their organization, worked out</text>
<text x="64" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">by the server, never taken from</text>
<text x="64" y="246" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">the request.</text>
<line x1="304" y1="199.0" x2="324" y2="199.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="326" y="124" width="262" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="326" y="124" width="8" height="150" rx="4" fill="#6366F1" stroke="none" stroke-width="1.5"/>
<circle cx="360" cy="152" r="12" fill="#6366F1"/>
<text x="360" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="382" y="158" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Load the facts</text>
<text x="350" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Organization, membership, the</text>
<text x="350" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">profile's group, who owns each</text>
<text x="350" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">library and which grants are</text>
<text x="350" y="246" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">active.</text>
<line x1="590" y1="199.0" x2="610" y2="199.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="612" y="124" width="262" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="612" y="124" width="8" height="150" rx="4" fill="#14B8A6" stroke="none" stroke-width="1.5"/>
<circle cx="646" cy="152" r="12" fill="#14B8A6"/>
<text x="646" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="668" y="158" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Ask the policy engine</text>
<text x="636" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's built-in engine (OPA)</text>
<text x="636" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">gets the facts and returns what</text>
<text x="636" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">is allowed.</text>
<line x1="876" y1="199.0" x2="896" y2="199.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="898" y="124" width="262" height="150" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="898" y="124" width="8" height="150" rx="4" fill="#FA6400" stroke="none" stroke-width="1.5"/>
<circle cx="932" cy="152" r="12" fill="#FA6400"/>
<text x="932" y="157" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="954" y="158" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Apply it in the query</text>
<text x="922" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The catalog and playback</text>
<text x="922" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">queries read only what the</text>
<text x="922" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">answer allows.</text>
<rect x="40" y="300" width="1120" height="300" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.6"/>
<text x="64" y="336" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="start">Any doubt refuses the request</text>
<text x="64" y="362" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Bloem never guesses and never falls back to a looser check.</text>
<circle cx="76" cy="405" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.05,400.05 L80.95,409.95 M80.95,400.05 L71.05,409.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="98" y="410" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">A fact is missing, or belongs to someone else</text>
<circle cx="624" cy="405" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M619.05,400.05 L628.95,409.95 M628.95,400.05 L619.05,409.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="646" y="410" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">The membership or organization changed since the sign-in</text>
<circle cx="76" cy="463" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.05,458.05 L80.95,467.95 M80.95,458.05 L71.05,467.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="98" y="468" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">Who owns a library cannot be worked out</text>
<circle cx="624" cy="463" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M619.05,458.05 L628.95,467.95 M628.95,458.05 L619.05,467.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="646" y="468" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">The ownership tables cannot be read</text>
<circle cx="76" cy="521" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M71.05,516.05 L80.95,525.95 M80.95,516.05 L71.05,525.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="98" y="526" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">The policy engine is slow, fails or gives an odd answer</text>
<circle cx="624" cy="521" r="11" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M619.05,516.05 L628.95,525.95 M628.95,516.05 L619.05,525.95" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="646" y="526" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">A hidden or foreign library: it looks the same as a missing one</text>
<text x="64" y="580" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Repeated refusals of this kind are an incident: stop the traffic, keep the evidence, repair, and run the checks again.</text>
</svg>
