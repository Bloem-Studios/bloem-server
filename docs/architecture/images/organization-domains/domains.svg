<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">One server, several addresses</title>
<desc id="d">Four browser windows reach one Bloem server: the server's public address shows the default organization's branding, two organizations' own addresses show their own names, logos and colours, and an unregistered address such as an IP address shows the server's branding. Inside the server, a list maps each registered address to its organization, which picks the branding and the address emails link to.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">One server, several addresses</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Each organization can have addresses of its own, with its own name, logo and colours.</text>
<rect x="40" y="124" width="420" height="106" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<path d="M41,156 L459,156" stroke="#E5E7EB" stroke-width="1.5"/>
