<text x="60" y="478" font-size="16" font-weight="700" fill="#101827" text-anchor="start">A platform account</text>
<text x="60" y="500" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">An operator's own account</text>
<rect x="344" y="442" width="272" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="376" cy="479" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M370.6,473.6 L381.4,484.4 M381.4,473.6 L370.6,484.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<rect x="624" y="442" width="272" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="656" cy="479" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M650.6,473.6 L661.4,484.4 M661.4,473.6 L650.6,484.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<rect x="904" y="442" width="272" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="936" cy="479" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M930.6,473.6 L941.4,484.4 M941.4,473.6 L930.6,484.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="962" y="473" font-size="13" font-weight="normal" fill="#101827" text-anchor="start">Only where the server Owner</text>
<text x="962" y="490" font-size="13" font-weight="normal" fill="#101827" text-anchor="start">rule allows</text>
<text x="60" y="522" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">A refusal is a 409 with a reason, never a 403: apps read a 403 as losing the organization.</text>
</svg>
