<text x="60" y="394" font-size="16" font-weight="700" fill="#101827" text-anchor="start">The organization owner</text>
<text x="60" y="416" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">The person who runs it</text>
