<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Who may act on whom</title>
<desc id="d">A grid. Rows are four kinds of person an administrator might help: an ordinary member, another administrator, the organization owner and a platform account. Columns are three helpers: an organization administrator, the organization owner and the platform operator. Each cell says yes or no.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Who may act on whom</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Resetting a password, signing out and editing profiles follow one table. Nobody acts on themselves.</text>
<rect x="344" y="120" width="272" height="50" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<text x="480.0" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Organization administrator</text>
<rect x="624" y="120" width="272" height="50" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<text x="760.0" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Organization owner</text>
<rect x="904" y="120" width="272" height="50" rx="10" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.6"/>
<text x="1040.0" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Platform operator</text>
<rect x="40" y="190" width="280" height="74" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="226" font-size="16" font-weight="700" fill="#101827" text-anchor="start">An ordinary member</text>
<text x="60" y="248" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Anyone who is not an administrator</text>
<rect x="344" y="190" width="272" height="74" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="376" cy="227" r="12" fill="#10B981"/>
