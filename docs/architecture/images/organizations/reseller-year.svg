<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Example: a year with Riverside Club</title>
<desc id="d">A timeline of eight events in a reseller organization's year, each with the organization's state after it: bought, first admin, members added and one refused, a missed payment and its fix, a seat cut below the number of members and its fix, and cancellation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="859" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Example: a year with Riverside Club</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">What the club, the storefront and Bloem each do, and the organization's state after each step.</text>
<line x1="230" y1="142" x2="230" y2="764" stroke="#E5E7EB" stroke-width="4"/>
<text x="40" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">January 5</text>
<circle cx="230" cy="157" r="10" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="132" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="132" width="6" height="70" rx="3" fill="#9CA3AF" stroke="none" stroke-width="1.5"/>
<text x="280" y="160" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The club buys 10 seats and 2 conversions on the storefront.</text>
<text x="280" y="184" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The storefront asks Bloem to create the organization.</text>
<rect x="970" y="144" width="190" height="46" rx="23" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
<text x="1065" y="173" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">Getting ready</text>
<text x="40" y="248" font-size="16" font-weight="700" fill="#101827" text-anchor="start">January 5</text>
<circle cx="230" cy="243" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="218" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="218" width="6" height="70" rx="3" fill="#10B981" stroke="none" stroke-width="1.5"/>
<text x="280" y="246" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The storefront adds the coach's account as its admin.</text>
<text x="280" y="270" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem grants the starting libraries.</text>
<rect x="970" y="230" width="190" height="46" rx="23" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1065" y="259" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">Active</text>
<text x="40" y="334" font-size="16" font-weight="700" fill="#101827" text-anchor="start">February</text>
<circle cx="230" cy="329" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="304" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="304" width="6" height="70" rx="3" fill="#10B981" stroke="none" stroke-width="1.5"/>
<text x="280" y="332" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The coach adds 9 members, filling all 10 seats.</text>
<text x="280" y="356" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">An 11th member is refused: no seat is free.</text>
<rect x="970" y="316" width="190" height="46" rx="23" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1065" y="345" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">Active</text>
<text x="40" y="420" font-size="16" font-weight="700" fill="#101827" text-anchor="start">March 1</text>
<circle cx="230" cy="415" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="390" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="390" width="6" height="70" rx="3" fill="#F59E0B" stroke="none" stroke-width="1.5"/>
<text x="280" y="418" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The club's payment fails. The storefront suspends it.</text>
<text x="280" y="442" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Members are refused until it is lifted.</text>
<rect x="970" y="402" width="190" height="46" rx="23" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="1065" y="431" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Suspended</text>
<text x="40" y="506" font-size="16" font-weight="700" fill="#101827" text-anchor="start">March 3</text>
<circle cx="230" cy="501" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="476" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="476" width="6" height="70" rx="3" fill="#10B981" stroke="none" stroke-width="1.5"/>
<text x="280" y="504" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The club pays. The storefront lifts the suspension.</text>
<text x="280" y="528" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Everyone can watch again.</text>
<rect x="970" y="488" width="190" height="46" rx="23" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1065" y="517" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">Active</text>
<text x="40" y="592" font-size="16" font-weight="700" fill="#101827" text-anchor="start">June</text>
<circle cx="230" cy="587" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="562" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="562" width="6" height="70" rx="3" fill="#F59E0B" stroke="none" stroke-width="1.5"/>
<text x="280" y="590" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The club changes to 6 seats while it has 10 members.</text>
<text x="280" y="614" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Too many people for its seats: suspended straight away.</text>
<rect x="970" y="574" width="190" height="46" rx="23" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
<text x="1065" y="603" font-size="16" font-weight="700" fill="#B45309" text-anchor="middle">Suspended</text>
<text x="40" y="678" font-size="16" font-weight="700" fill="#101827" text-anchor="start">June</text>
<circle cx="230" cy="673" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="648" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="648" width="6" height="70" rx="3" fill="#10B981" stroke="none" stroke-width="1.5"/>
<text x="280" y="676" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The coach removes 4 members.</text>
<text x="280" y="700" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Back within its seats, it becomes active again by itself.</text>
<rect x="970" y="660" width="190" height="46" rx="23" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<text x="1065" y="689" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">Active</text>
<text x="40" y="764" font-size="16" font-weight="700" fill="#101827" text-anchor="start">December</text>
<circle cx="230" cy="759" r="10" fill="#9CA3AF" stroke="#FFFFFF" stroke-width="3"/>
<rect x="258" y="734" width="690" height="70" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="258" y="734" width="6" height="70" rx="3" fill="#9CA3AF" stroke="none" stroke-width="1.5"/>
<text x="280" y="762" font-size="15.5" font-weight="600" fill="#101827" text-anchor="start">The club cancels. The storefront ends it.</text>
<text x="280" y="786" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Members removed; accounts with no other home deleted.</text>
<rect x="970" y="746" width="190" height="46" rx="23" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
<text x="1065" y="775" font-size="16" font-weight="700" fill="#374151" text-anchor="middle">Retired</text>
</svg>
