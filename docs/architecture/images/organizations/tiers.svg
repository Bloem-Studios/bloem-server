<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How Bloem is organized</title>
<desc id="d">Four nested tiers: the platform contains organizations, organizations contain accounts, accounts contain profiles. A legend explains each tier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="839" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How Bloem is organized</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Four tiers. Each one lives inside the one above it.</text>
<rect x="40" y="112" width="760" height="690" rx="20" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<circle cx="66" cy="141" r="13" fill="#FA6400"/>
<text x="66" y="146" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="88" y="146" font-size="14" font-weight="700" fill="#C2410C" text-anchor="start" letter-spacing="1">THE PLATFORM</text>
<text x="64" y="174" font-size="15" font-weight="normal" fill="#101827" text-anchor="start">The Bloem service: its servers, its libraries and its platform administrators.</text>
<text x="64" y="206" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">Platform libraries</text>
<rect x="64" y="216" width="71" height="27" rx="13.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="99.5" y="234.54" font-size="14" font-weight="600" fill="#101827" text-anchor="middle">Movies</text>
<rect x="145" y="216" width="71" height="27" rx="13.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="180.5" y="234.54" font-size="14" font-weight="600" fill="#101827" text-anchor="middle">Series</text>
<rect x="226" y="216" width="103" height="27" rx="13.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="277.5" y="234.54" font-size="14" font-weight="600" fill="#101827" text-anchor="middle">Audiobooks</text>
<rect x="339" y="216" width="71" height="27" rx="13.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="374.5" y="234.54" font-size="14" font-weight="600" fill="#101827" text-anchor="middle">Ebooks</text>
<rect x="420" y="216" width="79" height="27" rx="13.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="459.5" y="234.54" font-size="14" font-weight="600" fill="#101827" text-anchor="middle">Live TV</text>
<rect x="64" y="268" width="348" height="516" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<circle cx="86" cy="294" r="12" fill="#6366F1"/>
<text x="86" y="299" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="106" y="299" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start" letter-spacing="1">ORGANIZATION</text>
<text x="84" y="326" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Default organization</text>
<text x="84" y="348" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem's own direct customers,</text>
<text x="84" y="366" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">each account managed one by one.</text>
<rect x="428" y="268" width="348" height="516" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<circle cx="450" cy="294" r="12" fill="#6366F1"/>
<text x="450" y="299" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="470" y="299" font-size="13" font-weight="700" fill="#4338CA" text-anchor="start" letter-spacing="1">ORGANIZATION</text>
<text x="448" y="326" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Riverside Club</text>
<text x="448" y="348" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">A reseller sold a block of seats on</text>
<text x="448" y="366" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">the storefront: 10 seats, 2 shared</text>
<text x="448" y="384" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">video conversions.</text>
<rect x="448" y="394" width="224" height="25" rx="12.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="560.0" y="410.82" font-size="12" font-weight="600" fill="#101827" text-anchor="middle">Its own library: Club matches</text>
<rect x="84" y="394" width="238" height="25" rx="12.5" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.2"/>
<text x="203.0" y="410.82" font-size="12" font-weight="600" fill="#101827" text-anchor="middle">Granted: every platform library</text>
<rect x="84" y="432" width="308" height="162" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<circle cx="102" cy="454" r="11" fill="#10B981"/>
<text x="102" y="459" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="120" y="459" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="1">ACCOUNT</text>
<text x="100" y="484" font-size="15" font-weight="600" fill="#101827" text-anchor="start">jansen@example.com</text>
<rect x="257" y="442" width="119" height="25" rx="12.5" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="316.5" y="458.82" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">Plan: Standard</text>
<circle cx="102" cy="510" r="11" fill="#0EA5E9"/>
<text x="102" y="515" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="120" y="515" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">PROFILES</text>
<rect x="100.0" y="528" width="85.33333333333333" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="142.66666666666666" y="550" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Anna</text>
<text x="142.66666666666666" y="569" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="middle">PIN</text>
<rect x="195.33333333333331" y="528" width="85.33333333333333" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="237.99999999999997" y="559" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Tom</text>
<rect x="290.66666666666663" y="528" width="85.33333333333333" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="333.3333333333333" y="550" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Kids</text>
<text x="333.3333333333333" y="569" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="middle">ages 7+</text>
<rect x="84" y="606" width="308" height="162" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<circle cx="102" cy="628" r="11" fill="#10B981"/>
<text x="102" y="633" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="120" y="633" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="1">ACCOUNT</text>
<text x="100" y="658" font-size="15" font-weight="600" fill="#101827" text-anchor="start">devries@example.com</text>
<rect x="264" y="616" width="112" height="25" rx="12.5" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="320.0" y="632.82" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">Plan: Premium</text>
<circle cx="102" cy="684" r="11" fill="#0EA5E9"/>
<text x="102" y="689" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="120" y="689" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">PROFILES</text>
<rect x="100.0" y="702" width="133.0" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="166.5" y="733" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Eva</text>
<rect x="243.0" y="702" width="133.0" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="309.5" y="733" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Sem</text>
<rect x="448" y="432" width="308" height="162" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<circle cx="466" cy="454" r="11" fill="#10B981"/>
<text x="466" y="459" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="484" y="459" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="1">ACCOUNT</text>
<text x="464" y="484" font-size="15" font-weight="600" fill="#101827" text-anchor="start">coach@riverside.example</text>
<rect x="683" y="442" width="57" height="25" rx="12.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/>
<text x="711.5" y="458.82" font-size="12" font-weight="600" fill="#4338CA" text-anchor="middle">Admin</text>
<circle cx="466" cy="510" r="11" fill="#0EA5E9"/>
<text x="466" y="515" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="484" y="515" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">PROFILES</text>
<rect x="464.0" y="528" width="276.0" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="602.0" y="559" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Coach</text>
<rect x="448" y="606" width="308" height="162" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
<circle cx="466" cy="628" r="11" fill="#10B981"/>
<text x="466" y="633" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="484" y="633" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" letter-spacing="1">ACCOUNT</text>
<text x="464" y="658" font-size="15" font-weight="600" fill="#101827" text-anchor="start">sam@riverside.example</text>
<rect x="676" y="616" width="64" height="25" rx="12.5" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="708.0" y="632.82" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">Member</text>
<circle cx="466" cy="684" r="11" fill="#0EA5E9"/>
<text x="466" y="689" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="484" y="689" font-size="12.5" font-weight="700" fill="#0369A1" text-anchor="start" letter-spacing="1">PROFILES</text>
<rect x="464.0" y="702" width="133.0" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="530.5" y="733" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Sam</text>
<rect x="607.0" y="702" width="133.0" height="52" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
<text x="673.5" y="724" font-size="15" font-weight="600" fill="#101827" text-anchor="middle">Lee</text>
<text x="673.5" y="743" font-size="12" font-weight="normal" fill="#4B5563" text-anchor="middle">ages 12+</text>
<text x="828" y="146" font-size="17" font-weight="700" fill="#101827" text-anchor="start">What each tier means</text>
<rect x="828" y="166" width="332" height="118" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="828" y="166" width="8" height="118" rx="4" fill="#FA6400" stroke="none" stroke-width="1.5"/>
<circle cx="862" cy="192" r="12" fill="#FA6400"/>
<text x="862" y="197" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="884" y="198" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Platform</text>
<text x="852" y="224" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The Bloem service itself. It owns</text>
<text x="852" y="244" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">the servers and the main libraries.</text>
<text x="852" y="264" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Run by platform administrators.</text>
<rect x="828" y="298" width="332" height="138" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="828" y="298" width="8" height="138" rx="4" fill="#6366F1" stroke="none" stroke-width="1.5"/>
<circle cx="862" cy="324" r="12" fill="#6366F1"/>
<text x="862" y="329" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="884" y="330" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Organization</text>
<text x="852" y="356" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">One customer: Bloem's direct customers</text>
<text x="852" y="376" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">together, or a reseller, club or business.</text>
<text x="852" y="396" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Sees only its own people, libraries</text>
<text x="852" y="416" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">and settings. Run by its admin.</text>
<rect x="828" y="450" width="332" height="138" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="828" y="450" width="8" height="138" rx="4" fill="#10B981" stroke="none" stroke-width="1.5"/>
<circle cx="862" cy="476" r="12" fill="#10B981"/>
<text x="862" y="481" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="884" y="482" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Account</text>
<text x="852" y="508" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">One sign-in (email and password).</text>
<text x="852" y="528" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Belongs to exactly one organization.</text>
<text x="852" y="548" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Its plan sets screens, quality and</text>
<text x="852" y="568" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">downloads.</text>
<rect x="828" y="602" width="332" height="118" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="828" y="602" width="8" height="118" rx="4" fill="#0EA5E9" stroke="none" stroke-width="1.5"/>
<circle cx="862" cy="628" r="12" fill="#0EA5E9"/>
<text x="862" y="633" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="884" y="634" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Profile</text>
<text x="852" y="660" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">One person using the account. Can</text>
<text x="852" y="680" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">have a PIN, an age limit and only</text>
<text x="852" y="700" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">the libraries chosen for them.</text>
</svg>
