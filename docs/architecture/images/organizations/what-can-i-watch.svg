<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">What can this person watch?</title>
<desc id="d">A funnel. The server's libraries narrow to what the organization may use, then to what the account's plan allows, then to what the profile may see, which is what appears on screen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">What can this person watch?</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">The organization sets the outer limit. The plan and the profile narrow it down.</text>
<text x="880" y="112" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Who sets it</text>
<rect x="40.0" y="120" width="760" height="96" rx="16" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<circle cx="70.0" cy="168.0" r="14" fill="#FA6400"/>
<text x="70.0" y="173.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="434" y="160" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">Everything on the Bloem server</text>
<text x="434" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">All libraries: movies, series, audiobooks, ebooks, Live TV</text>
<rect x="880" y="126" width="280" height="84" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="880" y="126" width="6" height="84" rx="3" fill="#FA6400" stroke="none" stroke-width="1.5"/>
<text x="902" y="163.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Platform administrators</text>
<text x="902" y="182.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">add libraries.</text>
<line x1="808.0" y1="168.0" x2="872" y2="168.0" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="420" y1="218" x2="420" y2="239" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="88.0" y="242" width="664" height="96" rx="16" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
<circle cx="118.0" cy="290.0" r="14" fill="#6366F1"/>
<text x="118.0" y="295.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="434" y="282" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">What the organization may use</text>
<text x="434" y="308" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Libraries it owns, plus platform libraries granted to it</text>
<rect x="880" y="248" width="280" height="84" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="880" y="248" width="6" height="84" rx="3" fill="#6366F1" stroke="none" stroke-width="1.5"/>
<text x="902" y="276.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Platform administrators grant</text>
<text x="902" y="295.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">libraries. A new organization</text>
<text x="902" y="314.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">gets a standard starting set.</text>
<line x1="760.0" y1="290.0" x2="872" y2="290.0" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="420" y1="340" x2="420" y2="361" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="136.0" y="364" width="568" height="96" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
<circle cx="166.0" cy="412.0" r="14" fill="#10B981"/>
<text x="166.0" y="417.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="434" y="404" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">What the account's plan allows</text>
<text x="434" y="430" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Which libraries, how many screens, quality, downloads</text>
<rect x="880" y="370" width="280" height="84" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="880" y="370" width="6" height="84" rx="3" fill="#10B981" stroke="none" stroke-width="1.5"/>
<text x="902" y="398.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">The plan the storefront or an</text>
<text x="902" y="417.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">admin puts the account on. An</text>
<text x="902" y="436.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">admin can adjust one account.</text>
<line x1="712.0" y1="412.0" x2="872" y2="412.0" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="420" y1="462" x2="420" y2="483" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="184.0" y="486" width="472" height="96" rx="16" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
<circle cx="214.0" cy="534.0" r="14" fill="#0EA5E9"/>
<text x="214.0" y="539.0" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="434" y="526" font-size="19" font-weight="700" fill="#101827" text-anchor="middle">What this profile may see</text>
<text x="434" y="552" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Kids profiles, age limits, a chosen set of libraries</text>
<rect x="880" y="492" width="280" height="84" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<rect x="880" y="492" width="6" height="84" rx="3" fill="#0EA5E9" stroke="none" stroke-width="1.5"/>
<text x="902" y="529.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">The account's main profile,</text>
<text x="902" y="548.5" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">who manages the household.</text>
<line x1="664.0" y1="534.0" x2="872" y2="534.0" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="420" y1="584" x2="420" y2="605" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="250" y="608" width="340" height="72" rx="36" fill="#101827" stroke="none" stroke-width="1.5"/>
<text x="420" y="653" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">What appears on screen</text>
<text x="40" y="720" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Step 2 is a hard ceiling: nothing below it can reach a library the organization does not own or hold.</text>
<text x="40" y="742" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">A browse-only plan shows the catalog but never plays anything.</text>
</svg>
