<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How a Bloem commit becomes an image</title>
<desc id="d">A commit on main passes Bloem CI. Bloem Image then publishes an image tagged with the full commit SHA and moves edge while the commit is still main's newest. After a deploy of that commit passes verification, Bloem Release points latest and a dated tag such as 2026.11.17 at the same image. Below: Silo's own tags, build-N, latest and the full SHA, belong to Silo's all-in-one image and are not published for Bloem.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="599" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How a Bloem commit becomes an image</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">One image per commit, named by the commit. Release tags point at it.</text>
<rect x="40" y="130" width="200" height="160" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="58" y="162" font-size="17" font-weight="700" fill="#101827" text-anchor="start">A commit on main</text>
<text x="58" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The source an image is</text>
<text x="58" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">built from, with the</text>
<text x="58" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo revision it</text>
<text x="58" y="246" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">includes.</text>
<line x1="244" y1="210" x2="296" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="300" y="130" width="260" height="160" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="318" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Bloem CI, then Bloem Image</text>
<text x="318" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Only after CI passes on a push</text>
<text x="318" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">to main.</text>
<line x1="564" y1="210" x2="600" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="604" y="130" width="280" height="160" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="624" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Published by Bloem Image</text>
<text x="624" y="190" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#101827" text-anchor="start">bloem-server:&lt;full SHA&gt;</text>
<text x="624" y="212" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#101827" text-anchor="start">bloem-server:edge</text>
<text x="624" y="244" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">edge: only while the commit</text>
<text x="624" y="262" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">is still main's newest</text>
<line x1="888" y1="210" x2="924" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="928" y="130" width="232" height="160" rx="16" fill="#101827" stroke="none" stroke-width="1.5"/>
<text x="1044" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">After a verified deploy</text>
<text x="1044" y="186" font-size="13" font-weight="normal" fill="#E5E7EB" text-anchor="middle">Bloem Release points</text>
<text x="1044" y="218" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:latest</text>
<text x="1044" y="240" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:2026.11.17</text>
<text x="1044" y="268" font-size="13" font-weight="normal" fill="#E5E7EB" text-anchor="middle">at that image</text>
<rect x="40" y="350" width="1120" height="104" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
<circle cx="70" cy="386" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M64.6,380.6 L75.4,391.4 M75.4,380.6 L64.6,391.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="94" y="392" font-size="16" font-weight="700" fill="#075985" text-anchor="start">Not published for Bloem</text>
<text x="64" y="422" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's tags build-N, latest and the full SHA name Silo's all-in-one image, with PostgreSQL, Redis and Meilisearch inside. Bloem's image is the server</text>
<text x="64" y="441" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">alone.</text>
<text x="40" y="520" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Bloem has one prerelease, v0.1.0-bloem.20261011.1. An installation is identified by its commit or dated tag, not by a release.</text>
</svg>
