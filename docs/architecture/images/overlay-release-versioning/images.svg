<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">How a Bloem commit becomes an image</title>
<desc id="d">A commit on main passes Bloem CI. Bloem's deploy tool builds the image for the commit it deploys, and only after that deploy passes verification does it publish the image: release-&lt;sha9&gt;, the full commit SHA, latest and a dated tag such as 2026.11.26 all name the same image. Commits that are never deployed get no image. Below: edge no longer moves and stays at 9fa2dad01; Silo's own tags, build-N, latest and the full SHA, belong to Silo's all-in-one image and are not published for Bloem.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="579" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">How a Bloem commit becomes an image</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Images are built at deploy time. Only a deployed commit gets one.</text>
<rect x="40" y="130" width="200" height="160" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="58" y="162" font-size="17" font-weight="700" fill="#101827" text-anchor="start">A commit on main</text>
<text x="58" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The source an image is</text>
<text x="58" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">built from, with the</text>
<text x="58" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo revision it</text>
<text x="58" y="246" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">includes.</text>
<line x1="244" y1="210" x2="276" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="130" width="200" height="160" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.8"/>
<text x="298" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Bloem CI passes</text>
<text x="298" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">It tests the commit. It</text>
<text x="298" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">builds no image.</text>
<line x1="484" y1="210" x2="516" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="520" y="130" width="260" height="160" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.8"/>
<text x="538" y="162" font-size="16" font-weight="700" fill="#101827" text-anchor="start">A deploy, verified</text>
<text x="538" y="186" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Bloem's deploy tool builds the</text>
<text x="538" y="206" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">image, runs it in production,</text>
<text x="538" y="226" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">and checks it.</text>
<line x1="784" y1="210" x2="816" y2="210" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="820" y="130" width="340" height="160" rx="16" fill="#101827" stroke="none" stroke-width="1.5"/>
<text x="990" y="162" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Then published, one image</text>
<text x="990" y="194" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:release-&lt;sha9&gt;</text>
<text x="990" y="216" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:&lt;full SHA&gt;</text>
<text x="990" y="238" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:latest</text>
<text x="990" y="260" font-family="'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E5E7EB" text-anchor="middle">bloem-server:2026.11.26</text>
<rect x="40" y="340" width="548" height="120" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.6"/>
<text x="64" y="376" font-size="16" font-weight="700" fill="#B45309" text-anchor="start">edge no longer moves</text>
<text x="64" y="406" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">It stays at 9fa2dad01, the last image Bloem Image published before that</text>
<text x="64" y="425" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">workflow was disabled. Use latest or a dated tag instead.</text>
<rect x="612" y="340" width="548" height="120" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.6"/>
<circle cx="642" cy="370" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M636.6,364.6 L647.4,375.4 M647.4,364.6 L636.6,375.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="666" y="376" font-size="16" font-weight="700" fill="#075985" text-anchor="start">Not published for Bloem</text>
<text x="636" y="406" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Silo's tags build-N, latest and the full SHA name Silo's all-in-one</text>
<text x="636" y="425" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">image, with PostgreSQL, Redis and Meilisearch inside. Bloem's image is</text>
<text x="636" y="444" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">the server alone.</text>
<text x="40" y="520" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Bloem has one prerelease, v0.1.0-bloem.20261011.1. An installation is identified by its commit or dated tag, not by a release.</text>
</svg>
