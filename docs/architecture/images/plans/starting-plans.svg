<title id="t">The plans Bloem starts with</title>
<desc id="d">A table of the five built-in plans as shipped: Browse-only, Viewer, Standard, Premium and Reseller Member, with whether each plays video, how many screens, video conversions, the best quality, downloads and requests. A sixth, protected Preview plan serves storefront previews.</desc>
