<text x="96" y="698" font-size="16" font-weight="700" fill="#B91C1C" text-anchor="start">A grant can only point at a platform library.</text>
<text x="96" y="722" font-size="14.5" font-weight="normal" fill="#101827" text-anchor="start">Club matches can never be granted to Harbour Hotel. A suspended or revoked grant shows nothing.</text>
