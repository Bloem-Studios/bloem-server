<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Who owns a library, and who may use it</title>
<desc id="d">The platform owns Movies, Series and Kids. The default organization holds active grants to all three. Riverside Club owns its own Club matches library and holds active grants to Movies and Series and a suspended grant to Kids. Harbour Hotel holds a grant to Movies only. Nobody can be granted a library another organization owns.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="779" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Who owns a library, and who may use it</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Every library has one owner. An organization uses a platform library only through a grant.</text>
<rect x="40" y="116" width="1120" height="132" rx="16" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<text x="64" y="150" font-size="18" font-weight="700" fill="#101827" text-anchor="start">Owned by the platform</text>
<text x="64" y="174" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Platform administrators add them. No organization sees one without a grant.</text>
<rect x="240" y="192" width="180" height="40" rx="10" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.5"/>
