<text x="349.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">in</text>
<path d="M338,200 L361,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="379" y="186" width="31" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="394.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">a</text>
<path d="M387,200 L402,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="420" y="186" width="74" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="457.0" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">bottle</text>
<path d="M428,200 L486,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="504" y="186" width="39" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="523.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">on</text>
<path d="M512,200 L535,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="62" y="226" width="48" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="86.0" y="245.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">the</text>
<path d="M70,240 L102,240" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="120" y="226" width="66" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="153.0" y="245.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">beach</text>
<path d="M128,240 L178,240" stroke="#9CA3AF" stroke-width="1.6"/>
<text x="62" y="290" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">Keeps “man finds a”. Thousands of titles have those words, so the</text>
<text x="62" y="311" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">story it describes is lost among them.</text>
<rect x="620" y="124" width="540" height="226" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.5"/>
<text x="642" y="162" font-size="19" font-weight="700" fill="#101827" text-anchor="start">Drop the most common words first</text>
<rect x="642" y="186" width="48" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="666.0" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">man</text>
