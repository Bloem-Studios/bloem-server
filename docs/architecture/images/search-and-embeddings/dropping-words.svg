<text x="86.0" y="205.4" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">man</text>
<rect x="120" y="186" width="66" height="28" rx="14.0" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
<text x="153.0" y="205.4" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">finds</text>
<rect x="196" y="186" width="31" height="28" rx="14.0" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
<text x="211.5" y="205.4" font-size="15" font-weight="600" fill="#B45309" text-anchor="middle">a</text>
<rect x="237" y="186" width="83" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="278.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">message</text>
<path d="M245,200 L312,200" stroke="#9CA3AF" stroke-width="1.6"/>
