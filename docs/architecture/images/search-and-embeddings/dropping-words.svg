<rect x="776" y="186" width="31" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="791.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">a</text>
<path d="M784,200 L799,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="817" y="186" width="83" height="28" rx="14.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="858.5" y="205.4" font-size="15" font-weight="600" fill="#0F766E" text-anchor="middle">message</text>
<rect x="910" y="186" width="39" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="929.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">in</text>
<path d="M918,200 L941,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="959" y="186" width="31" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="974.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">a</text>
<path d="M967,200 L982,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="1000" y="186" width="74" height="28" rx="14.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="1037.0" y="205.4" font-size="15" font-weight="600" fill="#0F766E" text-anchor="middle">bottle</text>
<rect x="1084" y="186" width="39" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="1103.5" y="205.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">on</text>
<path d="M1092,200 L1115,200" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="642" y="226" width="48" height="28" rx="14.0" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="1.2"/>
<text x="666.0" y="245.4" font-size="15" font-weight="600" fill="#9CA3AF" text-anchor="middle">the</text>
<path d="M650,240 L682,240" stroke="#9CA3AF" stroke-width="1.6"/>
<rect x="700" y="226" width="66" height="28" rx="14.0" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="733.0" y="245.4" font-size="15" font-weight="600" fill="#0F766E" text-anchor="middle">beach</text>
<text x="642" y="290" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">Keeps “message bottle beach”, the rarer words that pick out the</text>
<text x="642" y="311" font-size="15" font-weight="normal" fill="#4B5563" text-anchor="start">story.</text>
<text x="40" y="416" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Two-word searches still need both words, so a typing mistake such as “spnge bob” never shrinks to one loose word. Measured on 200 searches that describe a</text>
<text x="40" y="436" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">title: in the top 50 16.5% of the time when trailing words are dropped, 36.5% when common words go first.</text>
</svg>
