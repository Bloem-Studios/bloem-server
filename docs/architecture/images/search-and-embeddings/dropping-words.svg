<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">What happens when no title has every word</title>
<desc id="d">This example is made up. The search 'man finds a message in a bottle on the beach' matches no title with all ten words. Dropping trailing words keeps 'man finds a', which thousands of titles contain. Dropping the most common words first keeps 'message bottle beach', the words that pick out the story. Two-word searches still need both words. On 200 searches that describe a title without naming it, the right title was in the top 50 for 16.5% of searches when trailing words were dropped and 36.5% when the most common words were dropped first.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="469" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">What happens when no title has every word</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">This example is made up: one search, matched two ways.</text>
<rect x="40" y="124" width="540" height="226" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
