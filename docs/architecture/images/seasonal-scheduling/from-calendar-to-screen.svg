<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">From calendar to screen</title>
<desc id="d">Left: the seasonal packs stored on the Bloem server, each with a window that may repeat every year, for everyone or for one organization. Middle: the server works out which packs are on right now and turns a yearly window into this year's exact start and end. Right: a signed-out page asks the public route and gets only packs for everyone; a signed-in Home asks the viewer route and also gets its own organization's packs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">From calendar to screen</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">The server keeps the calendar. Apps only ever see this year's exact start and end.</text>
<text x="40" y="140" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Stored on the server</text>
<rect x="40" y="158" width="330" height="98" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
<text x="60" y="190" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Winter snow</text>
<text x="60" y="214" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">1 Dec to 7 Jan yearly, Amsterdam time</text>
<rect x="60" y="224" width="106" height="25" rx="12.5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"/>
<text x="113.0" y="240.82" font-size="12" font-weight="600" fill="#1D4ED8" text-anchor="middle">for everyone</text>
<rect x="40" y="270" width="330" height="98" rx="14" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.6"/>
<text x="60" y="302" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Spring banner</text>
<text x="60" y="326" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">20 Mar to 20 Apr, this year</text>
<rect x="60" y="336" width="106" height="25" rx="12.5" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1.2"/>
<text x="113.0" y="352.82" font-size="12" font-weight="600" fill="#0F766E" text-anchor="middle">for everyone</text>
<rect x="40" y="382" width="330" height="98" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<text x="60" y="414" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Club anniversary</text>
<text x="60" y="438" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">1 to 8 May, every year</text>
<rect x="60" y="448" width="154" height="25" rx="12.5" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.2"/>
<text x="137.0" y="464.82" font-size="12" font-weight="600" fill="#4338CA" text-anchor="middle">Riverside Club only</text>
<rect x="430" y="158" width="330" height="322" rx="18" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<text x="595" y="192" font-size="17" font-weight="700" fill="#101827" text-anchor="middle">The server decides</text>
<circle cx="462" cy="226" r="12" fill="#FA6400"/>
<text x="462" y="231" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="486" y="231" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Which packs are on at this moment.</text>
<circle cx="462" cy="274" r="12" fill="#FA6400"/>
<text x="462" y="279" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="486" y="279" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">For a yearly window, this year's</text>
<text x="486" y="298" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">start and end in its own time zone.</text>
<circle cx="462" cy="341" r="12" fill="#FA6400"/>
<text x="462" y="346" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="486" y="346" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Which packs this viewer may see:</text>
<text x="486" y="365" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">everyone's, plus their own</text>
<text x="486" y="384" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">organization's.</text>
<line x1="374" y1="300" x2="426" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="830" y="158" width="330" height="150" rx="14" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
<text x="848" y="190" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Signed-out page</text>
<text x="848" y="214" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">The sign-in page asks the public route and</text>
<text x="848" y="234" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">gets only the packs for everyone.</text>
<text x="848" y="292" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">/api/bloem/v2/ambience/public</text>
<rect x="830" y="330" width="330" height="150" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="848" y="362" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Signed-in Home</text>
<text x="848" y="386" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Asks the viewer route with the chosen</text>
<text x="848" y="406" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">profile, and also gets its own</text>
<text x="848" y="426" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">organization's packs.</text>
<text x="848" y="464" font-size="12.5" font-weight="normal" fill="#6B7280" text-anchor="start">/api/bloem/v2/ambience</text>
<line x1="764" y1="270" x2="826" y2="234" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="764" y1="368" x2="826" y2="404" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="520" width="1120" height="150" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="64" y="554" font-size="17" font-weight="700" fill="#101827" text-anchor="start">What an app receives</text>
<rect x="64" y="572" width="500" height="74" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="84" y="600" font-size="15" font-weight="700" fill="#101827" text-anchor="start">Winter snow, this season</text>
<text x="84" y="626" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">from 2026-11-30 23:00 UTC to 2027-01-06 23:00 UTC</text>
<text x="600" y="588" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">No repeat rule and no time zone: just this year's start and end. Apps hide</text>
<text x="600" y="608" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">the effect by themselves when the end passes, even offline. The web app</text>
<text x="600" y="628" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">looks again every 30 seconds.</text>
<text x="40" y="718" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">This example is made up. A pack is switched on and off by the server's clock, so it works when the storefront is offline.</text>
</svg>
