<circle cx="760" cy="216" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M754.6,210.6 L765.4,221.4 M765.4,210.6 L754.6,221.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
