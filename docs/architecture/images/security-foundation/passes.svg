<text x="780" y="239" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">first</text>
<rect x="949" y="186" width="207" height="92" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
