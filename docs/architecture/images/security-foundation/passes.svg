<circle cx="545" cy="424" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M539.6,418.6 L550.4,429.4 M550.4,418.6 L539.6,429.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="565" y="429" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Not a household</text>
<rect x="734" y="394" width="207" height="92" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="760" cy="424" r="12" fill="#10B981"/>
<path d="M754.6,424.24 L758.8,428.56 L766.0,419.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="780" y="429" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Its own organization</text>
<text x="780" y="447" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">only</text>
