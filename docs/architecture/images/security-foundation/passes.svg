<circle cx="330" cy="424" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M324.6,418.6 L335.4,429.4 M335.4,418.6 L324.6,429.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="350" y="429" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Not a viewer</text>
