<circle cx="975" cy="320" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M969.6,314.6 L980.4,325.4 M980.4,314.6 L969.6,325.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="995" y="325" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">Never</text>
<rect x="40" y="394" width="240" height="92" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.6"/>
<text x="60" y="434" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Organization pass</text>
<text x="60" y="458" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">15 minutes, one organization</text>
