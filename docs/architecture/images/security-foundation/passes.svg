<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Which sign-in opens which door</title>
<desc id="d">A grid. Rows are four kinds of sign-in: an account sign-in, a profile's own sign-in, an organization administrator pass and a platform administrator pass. Columns are four kinds of request: watching and browsing, managing a profile's own sign-in, running one organization, and running the platform. Each cell says yes, partly or no, with the reason.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="719" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Which sign-in opens which door</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Each kind of sign-in opens only its own doors. An administrator pass is a separate, short-lived key.</text>
<rect x="304" y="120" width="207" height="50" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="407.5" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Watch and browse</text>
<rect x="519" y="120" width="207" height="50" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="622.5" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">A profile's own sign-in</text>
<rect x="734" y="120" width="207" height="50" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="837.5" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Run one organization</text>
<rect x="949" y="120" width="207" height="50" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="1052.5" y="151" font-size="15" font-weight="700" fill="#101827" text-anchor="middle">Run the platform</text>
<rect x="40" y="186" width="240" height="92" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.6"/>
<text x="60" y="226" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Account sign-in</text>
<text x="60" y="250" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Email and password</text>
<rect x="304" y="186" width="207" height="92" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="330" cy="216" r="12" fill="#10B981"/>
<path d="M324.6,216.24 L328.8,220.56 L336.0,211.8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
