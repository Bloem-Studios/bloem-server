<text x="350" y="343" font-size="13.5" font-weight="normal" fill="#101827" text-anchor="start">book requests</text>
<rect x="519" y="290" width="207" height="92" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<circle cx="545" cy="320" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M539.6,314.6 L550.4,325.4 M550.4,314.6 L539.6,325.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
