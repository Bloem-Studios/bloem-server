<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Silo and Bloem taking turns</title>
<desc id="d">One database in the middle, Silo on the left and Bloem on the right, each with its own cache. Below, a timeline: Silo serves, Bloem takes over and switching is enabled, Silo serves again, then Bloem. Only one runs at a time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="699" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Silo and Bloem taking turns</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">One database, two servers, never both at once. Each reads what the other wrote.</text>
<path d="M480.0,150 L480.0,300 A120.0,14 0 0 0 720.0,300 L720.0,150 Z" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/>
<ellipse cx="600" cy="150" rx="120.0" ry="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.8"/>
<text x="600" y="233.0" font-size="17" font-weight="700" fill="#101827" text-anchor="middle">The database</text>
<text x="600" y="255.0" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="middle">accounts, profiles, libraries, history</text>
<rect x="40" y="140" width="300" height="170" rx="16" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
<text x="190" y="186" font-size="24" font-weight="700" fill="#075985" text-anchor="middle">Silo</text>
<text x="190" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">the original server</text>
<rect x="110" y="236" width="160" height="48" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2"/>
<text x="190" y="266" font-size="14" font-weight="600" fill="#075985" text-anchor="middle">its own cache</text>
<rect x="860" y="140" width="300" height="170" rx="16" fill="#FFF4EC" stroke="#FA6400" stroke-width="2"/>
<text x="1010" y="186" font-size="24" font-weight="700" fill="#C2410C" text-anchor="middle">Bloem</text>
<text x="1010" y="212" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="middle">Silo plus Bloem's additions</text>
<rect x="930" y="236" width="160" height="48" rx="10" fill="#FFFFFF" stroke="#FA6400" stroke-width="1.2"/>
<text x="1010" y="266" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">its own cache</text>
<line x1="344" y1="225" x2="476" y2="225" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="7 6"/>
<line x1="724" y1="225" x2="856" y2="225" stroke="#FA6400" stroke-width="2.5"/>
<text x="410" y="212" font-size="13" font-weight="normal" fill="#6B7280" text-anchor="middle">stopped</text>
<text x="790" y="212" font-size="13" font-weight="700" fill="#C2410C" text-anchor="middle">serving</text>
<text x="40" y="376" font-size="18" font-weight="700" fill="#101827" text-anchor="start">A switch, step by step</text>
<rect x="40" y="396" width="204" height="168" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
<circle cx="66" cy="424" r="13" fill="#0284C7"/>
<text x="66" y="429" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="56" y="470" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Silo serves</text>
<text x="56" y="498" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">An ordinary Silo install,</text>
<text x="56" y="516" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">with its accounts and</text>
<text x="56" y="534" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">libraries.</text>
<line x1="247" y1="480.0" x2="266" y2="480.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="269" y="396" width="204" height="168" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.5"/>
<circle cx="295" cy="424" r="13" fill="#FA6400"/>
<text x="295" y="429" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="285" y="470" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Bloem takes over</text>
<text x="285" y="498" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Stop Silo. Start Bloem;</text>
<text x="285" y="516" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">it adds its tables. Then</text>
<text x="285" y="534" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">switch on Silo switching.</text>
<line x1="476" y1="480.0" x2="495" y2="480.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="498" y="396" width="204" height="168" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.5"/>
<circle cx="524" cy="424" r="13" fill="#FA6400"/>
<text x="524" y="429" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="514" y="470" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Bloem serves</text>
<text x="514" y="498" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Everything still there,</text>
<text x="514" y="516" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">plus Bloem's features.</text>
<line x1="705" y1="480.0" x2="724" y2="480.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="727" y="396" width="204" height="168" rx="14" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.5"/>
<circle cx="753" cy="424" r="13" fill="#0284C7"/>
<text x="753" y="429" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="743" y="470" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">Silo again</text>
<text x="743" y="498" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Stop Bloem, empty the</text>
<text x="743" y="516" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">cache, start Silo. It</text>
<text x="743" y="534" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">reads what Bloem wrote.</text>
<line x1="934" y1="480.0" x2="953" y2="480.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="956" y="396" width="204" height="168" rx="14" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.5"/>
<circle cx="982" cy="424" r="13" fill="#FA6400"/>
<text x="982" y="429" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="972" y="470" font-size="16.5" font-weight="700" fill="#101827" text-anchor="start">And back</text>
<text x="972" y="498" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">Either way, as often as</text>
<text x="972" y="516" font-size="13.5" font-weight="normal" fill="#4B5563" text-anchor="start">needed.</text>
<text x="40" y="626" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">Before the first switch, take a snapshot of the database. Run the Silo version Bloem has merged: a newer or much older Silo can misread the database.</text>
</svg>
