<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Getting in</title>
<desc id="d">Three ways in: an invitation link, an invite code, or a login someone made for you. Each leads to signing in, then to choosing who is watching, then to Home.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="559" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Getting in</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Whichever way you were invited, you end up choosing who is watching.</text>
<rect x="40" y="124" width="340" height="104" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="58" y="156" font-size="17" font-weight="700" fill="#101827" text-anchor="start">An invitation link</text>
<text x="58" y="180" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Open it and choose a password. It works</text>
<text x="58" y="200" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">once.</text>
<line x1="384" y1="176" x2="452" y2="266" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="244" width="340" height="104" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="58" y="276" font-size="17" font-weight="700" fill="#101827" text-anchor="start">An invite code</text>
<text x="58" y="300" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Choose Sign up on the sign-in page and</text>
<text x="58" y="320" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">enter the code.</text>
<line x1="384" y1="296" x2="452" y2="294" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="364" width="340" height="104" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="58" y="396" font-size="17" font-weight="700" fill="#101827" text-anchor="start">A login made for you</text>
<text x="58" y="420" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Open the server address and sign in.</text>
<line x1="384" y1="416" x2="452" y2="322" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="456" y="234" width="236" height="120" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
<text x="474" y="266" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Sign in</text>
<text x="474" y="290" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Your email or username, and</text>
<text x="474" y="310" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">your password.</text>
<line x1="696" y1="294" x2="744" y2="294" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="748" y="234" width="236" height="120" rx="14" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.8"/>
<text x="766" y="266" font-size="17" font-weight="700" fill="#101827" text-anchor="start">Who's watching?</text>
<text x="766" y="290" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">Pick your profile. Enter its</text>
<text x="766" y="310" font-size="14" font-weight="normal" fill="#4B5563" text-anchor="start">PIN if it has one.</text>
<line x1="988" y1="294" x2="1022" y2="294" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1026" y="259" width="134" height="70" rx="35" fill="#101827" stroke="none" stroke-width="1.5"/>
<text x="1093" y="302" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Home</text>
<text x="40" y="522" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">On an organization's own address, the sign-in page shows that organization's name and logo. Settings → Connect Apps shows what to type into an app.</text>
</svg>
