<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Where Bloem's /api/v1 routes moved</title>
<desc id="d">Six rows, one for each area Bloem added to Silo's /api/v1: tenants, tenant members, announcements, campaigns, seasonal packs and remote control. Each row shows the old path and its replacement under /api/bloem/v2. Remote control has no replacement: it is dormant. Since 11 November 2026 every old route answers 410 Gone.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="729" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="40" y="56" font-size="28" font-weight="700" fill="#101827" text-anchor="start">Where Bloem's /api/v1 routes moved</text>
<text x="40" y="88" font-size="17" font-weight="normal" fill="#4B5563" text-anchor="start">Silo retired /api/v1 on 11 November 2026; every old route now answers 410 Gone.</text>
<text x="40" y="140" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">Area</text>
<text x="250" y="140" font-size="14" font-weight="700" fill="#B91C1C" text-anchor="start">Old, on Silo's /api/v1</text>
<text x="700" y="140" font-size="14" font-weight="700" fill="#C2410C" text-anchor="start">Now, on Bloem's /api/bloem/v2</text>
<rect x="40" y="156" width="1120" height="64" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="186.0" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Tenants</text>
<text x="60" y="206.0" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">7 routes</text>
<rect x="240" y="164" width="410" height="48" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
<text x="256" y="193.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">/admin/tenants/...</text>
<line x1="654" y1="188.0" x2="686" y2="188.0" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="690" y="164" width="450" height="48" rx="10" fill="#FFF4EC" stroke="#FA6400" stroke-width="1.2"/>
<text x="706" y="193.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">/admin/platform/tenants/...</text>
