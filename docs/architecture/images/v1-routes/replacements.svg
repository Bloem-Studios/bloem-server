<rect x="690" y="576" width="450" height="64" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 5"/>
<circle cx="716" cy="608.0" r="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2.5"/>
<path d="M710.6,602.6 L721.4,613.4 M721.4,602.6 L710.6,613.4" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
<text x="740" y="613.0" font-size="14" font-weight="normal" fill="#101827" text-anchor="start">None: dormant until native routes are built</text>
