<rect x="40" y="568" width="1120" height="80" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
<text x="60" y="606.0" font-size="16" font-weight="700" fill="#101827" text-anchor="start">Remote control</text>
<text x="60" y="626.0" font-size="13" font-weight="normal" fill="#4B5563" text-anchor="start">6 routes</text>
<rect x="240" y="576" width="410" height="64" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
