syntax = "proto3";
package bloem.calendar.v1;
option go_package = "github.com/Silo-Server/silo-server/internal/managedtracking/calendarwire;calendarv1";
import "google/protobuf/timestamp.proto";

// Optional installation-bound host service. Profile and scope are resolved by
// the host from its current enrollment authority, never granted by request IDs.
service CalendarHost {
  rpc Read(CalendarRequest) returns (CalendarPage);
  rpc CheckAuthority(CalendarAuthorityRequest) returns (CalendarAuthorityResponse);
}
message CalendarRequest {
  string account_id = 1;
  string profile_id = 2;
  string start = 3; // ISO date, inclusive; at most 31 days per window.
  string end = 4;
  string snapshot_id = 5;
  string cursor = 6;
  uint32 limit = 7; // 1..100. A cap is an error, never a truncated completion.
}
message CalendarEvent {
  string event_id = 1;
  string content_id = 2;
  string kind = 3;
  string title = 4;
  string episode_title = 5;
  string series_id = 6;
  optional int32 season_number = 7;
  optional int32 episode_number = 8;
  string date = 9; // Source date stays a date, including all-day releases.
  google.protobuf.Timestamp air_at = 10; // Absent when the source has no time.
  string air_timezone = 11;
  bool watched = 12;
  bool followed = 13;
  bool favourite = 14;
  bool watchlist = 15;
  map<string,string> external_ids = 16;
  map<string,string> series_external_ids = 17;
  string artwork_id = 18; // No bearer URLs or credential-bearing fetch targets.
  bool playable = 19; // Fresh host knowledge, not implied by release date.
  string release_type = 20; // Different regional release types stay distinct.
  repeated string badges = 21;
}
message CalendarPage {
  string instance_id = 1;
  string account_id = 2;
  string profile_id = 3;
  string snapshot_id = 4;
  string next_cursor = 5;
  bool complete = 6;
  string visibility_digest = 7;
  google.protobuf.Timestamp expires_at = 8;
  repeated CalendarEvent events = 9;
  string start = 10;
  string end = 11;
  uint64 revision = 12;
}
message CalendarAuthority {
  string account_id = 1;
  string profile_id = 2;
  string visibility_digest = 3;
}
message CalendarAuthorityRequest {
  repeated CalendarAuthority profiles = 1; // At most 100; all must be scoped.
}
message CalendarAuthorized {
  CalendarAuthority profile = 1;
  google.protobuf.Timestamp expires_at = 2;
}
message CalendarAuthorityResponse {
  string instance_id = 1;
  repeated CalendarAuthorized authorized = 2; // Absent tuples are denied.
}
