syntax = "proto3";
package bloem.listbridge.v1;
option go_package = "github.com/Silo-Server/silo-server/internal/managedtracking/listwire;listwire";
import "google/protobuf/timestamp.proto";

// Installation-bound transport for source list metadata. Membership and
// acquisition policy are host decisions; this service carries no playback URLs.
service ListHost {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Poll(PollRequest) returns (Jobs);
  rpc Resolved(Resolution) returns (Ack);
  rpc Stage(Page) returns (Ack);
  rpc Complete(Completion) returns (Receipt);
  rpc Reject(Failure) returns (Ack);
}
message InfoRequest {}
message InfoResponse { string capability = 1; uint32 version = 2; }
message PollRequest { uint32 limit = 1; }
message Jobs { repeated Job jobs = 1; }
message Job {
  string id = 1;
  string mode = 2;
  string instance_id = 3;
  string account_id = 4;
  string profile_id = 5;
  string binding_id = 6;
  string locator = 7;
  string source_id = 8;
  string lease_token = 9;
  uint64 generation = 10;
  google.protobuf.Timestamp expires_at = 11;
  string resolution_token = 12;
}
message Resolution {
  string job_id = 1;
  string lease_token = 2;
  uint64 generation = 3;
  string source_id = 4;
  string name = 5;
  string kind = 6;
  uint32 count = 7;
  string resolution_token = 8;
  google.protobuf.Timestamp expires_at = 9;
}
message Entry {
  string kind = 1;
  string title = 2;
  int32 year = 3;
  map<string,string> external_ids = 4;
  string source_entry_id = 5;
  // Closed safe reason codes for rows that cannot produce a host match/request.
  string unsupported_reason = 6;
}
message Page {
  uint32 version = 1;
  string job_id = 2;
  string binding_id = 3;
  uint64 generation = 4;
  string source_id = 5;
  string snapshot_id = 6;
  string lease_token = 7;
  uint32 position = 8;
  uint32 total = 9;
  bytes digest = 10;
  google.protobuf.Timestamp generated_at = 11;
  google.protobuf.Timestamp expires_at = 12;
  string next_cursor = 13;
  bool final = 14;
  repeated Entry entries = 15;
}
message Completion {
  string job_id = 1;
  string binding_id = 2;
  string snapshot_id = 3;
  string lease_token = 4;
  string source_attestation = 5;
  uint64 generation = 6;
  bytes digest = 7;
}
message Receipt {
  string job_id = 1;
  string binding_id = 2;
  string target_id = 3;
  uint64 generation = 4;
  uint64 revision = 5;
  bytes digest = 6;
}
message Failure {
  string job_id = 1;
  string lease_token = 2;
  uint64 generation = 3;
  string reason = 4;
}
message Ack {}
