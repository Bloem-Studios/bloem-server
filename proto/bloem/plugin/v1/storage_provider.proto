syntax = "proto3";

package bloem.plugin.v1;
option go_package = "github.com/Bloem-Studios/bloem-plugin-sdk/pkg/pluginproto/bloem/plugin/v1;storagev1";

// Private native file storage, independent of Silo capability enum values.
// NotFound means authoritative absence; Unavailable means provider failure;
// PermissionDenied means backend denial; FailedPrecondition means the pinned
// revision changed; InvalidArgument means an invalid identity or range.
// Cancellation and deadlines use their standard gRPC statuses.
service StorageProvider {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // At most 512 entries and 1 MiB encoded entry data; cursors must advance.
  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  // A successful Read delivers exactly length bytes of expected_revision.
  // Chunks have consecutive offsets, at most 128 KiB data, and the final
  // chunk sets eof. Errors, including revision conflicts, end with non-OK.
  rpc Read(ReadRequest) returns (stream ReadChunk);
}

message DescribeRequest {}
message DescribeResponse { uint32 revision = 1; repeated Source sources = 2; }
message Source {
  string id = 1;
  string name = 2;
  string root_entry_id = 3;
  bool revision_pinned_reads = 4;
  // Explicit supported library kinds. Absence retains the host's prior
  // fallback only; it must never imply audiobook readiness.
  repeated string media_kinds = 5;
  // True only when List honors directories_only without file hydration.
  bool directory_only_listing = 6;
}
enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
}
message Entry {
  string id = 1;
  string name = 2;
  // Display metadata only; never a host operating-system path.
  string logical_path = 3;
  EntryKind kind = 4;
  int64 size = 5;
  int64 modified_unix_nano = 6;
  // An opaque content version, separate from stable entry identity.
  string revision = 7;
  // Catalog metadata the provider already holds for an EPUB or PDF file.
  // When set, the host publishes the book from it without reading the file;
  // when unset, the host reads and parses the file instead.
  EbookMetadata ebook = 8;
  // Provider-held audio metadata does not establish a pinned file revision.
  AudiobookMetadata audiobook = 9;
  AudioFileMetadata audio_file = 10;
}
// Provider-held book metadata. Every field is optional. Strings carry at most
// 64 KiB (description) or 4 KiB (all others); lists at most 64 items.
message EbookMetadata {
  string title = 1;
  repeated string authors = 2;
  string description = 3;
  string publisher = 4;
  // ISO 8601: YYYY, YYYY-MM or YYYY-MM-DD.
  string published_date = 5;
  // BCP 47 or ISO 639 language code.
  string language = 6;
  // ISBN-13 or ISBN-10.
  string isbn = 7;
  string series = 8;
  string series_index = 9;
  repeated string genres = 10;
  int32 page_count = 11;
  // A readable file entry holding the cover image, pinned to cover_revision.
  // Empty when the book has no cover. The host fetches it outside ingestion.
  string cover_entry_id = 12;
  string cover_revision = 13;
  // Optional ThumbHash placeholder for the cover, base64-encoded.
  string cover_thumbhash = 14;
}
// Audio strings use the ebook bounds: 64 KiB for description, 4 KiB for
// other strings, and at most 64 values per string list.
message AudioChapter {
  string id = 1;
  string title = 2;
  double start_seconds = 3;
  double end_seconds = 4;
}
message AudioFileMetadata {
  string book_id = 1;
  uint32 disc_number = 2;
  uint32 track_number = 3;
  // Timing must be finite and nonnegative.
  double duration_seconds = 4;
  string codec = 5;
  string container = 6;
  uint32 bitrate = 7;
  uint32 sample_rate = 8;
  uint32 channels = 9;
  // Track-local times; host converts them to book-global positions.
  // At most 1024 chapters, with unique nonempty IDs and finite nonnegative
  // times: start_seconds <= end_seconds <= duration_seconds.
  repeated AudioChapter chapters = 10;
}
message AudiobookMetadata {
  string book_id = 1;
  string title = 2;
  repeated string authors = 3;
  repeated string narrators = 4;
  string description = 5;
  string publisher = 6;
  string published_date = 7;
  string language = 8;
  string isbn = 9;
  string series = 10;
  string series_index = 11;
  repeated string genres = 12;
  string cover_entry_id = 13;
  string cover_revision = 14;
  string cover_thumbhash = 15;
}
message ListRequest {
  string source_id = 1;
  string directory_id = 2;
  string cursor = 3;
  uint32 max_entries = 4;
  // A change_token from an earlier complete listing of this directory. The
  // provider then lists only entries added or changed since that token, and
  // reports removals in removed_entry_ids. A provider that cannot honor the
  // token returns FailedPrecondition, and the host lists the directory fully.
  string changes_since = 5;
  // Browsing intent, separate from inventory/change-feed hydration. Supporting
  // providers omit file work and return only directories without snapshots,
  // change tokens or removals. Cursors must be bound to this intent. Browsing
  // a leaf book returns an empty terminal page without stream downloads.
  // Older providers may ignore this hint; hosts filter their entries safely.
  bool directories_only = 6;
}
message ListResponse {
  repeated Entry entries = 1;
  string next_cursor = 2;
  bool complete = 3;
  // Set only on the final page of a listing. The host passes it back as
  // changes_since on the next scan. Empty when the provider has no change feed.
  string change_token = 4;
  // Entry IDs removed since changes_since. Only valid when changes_since is set.
  repeated string removed_entry_ids = 5;
}
message StatRequest { string source_id = 1; string entry_id = 2; string expected_revision = 3; }
message StatResponse { Entry entry = 1; }
message ReadRequest {
  string source_id = 1;
  string entry_id = 2;
  string expected_revision = 3;
  int64 offset = 4;
  int64 length = 5;
}
message ReadChunk { int64 offset = 1; bytes data = 2; bool eof = 3; }
