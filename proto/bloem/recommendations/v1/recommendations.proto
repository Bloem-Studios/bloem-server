syntax = "proto3";
package bloem.recommendations.v1;
option go_package = "github.com/Silo-Server/silo-server/internal/managedtracking/recommendationswire;recommendationswire";
import "google/protobuf/timestamp.proto";
// Installation-bound cached personal recommendations, never social suggestions.
service RecommendationsHost { rpc Read(RecommendationsRequest) returns (RecommendationsFeed); }
message RecommendationsRequest { string account_id = 1; string profile_id = 2; }
message Recommendation {
 string content_id = 1; string kind = 2; string title = 3;
 string reason = 4; string reason_detail = 5; string row_label = 6;
 map<string,string> external_ids = 7;
}
message RecommendationsFeed {
 string instance_id = 1; string account_id = 2; string profile_id = 3;
 google.protobuf.Timestamp generated_at = 4;
 google.protobuf.Timestamp expires_at = 5;
 repeated Recommendation items = 6; // Complete bounded projection, at most 100.
}
