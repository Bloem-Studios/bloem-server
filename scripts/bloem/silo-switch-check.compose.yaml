# One database, two backends: the upstream Silo image and a Bloem image, never
# running at the same time. Used by scripts/bloem/silo-switch-check.sh.
name: silo-switch-check

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo -d silo"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis-silo:
    image: redis:7-alpine

  redis-bloem:
    image: redis:7-alpine

  silo:
    image: ${SILO_IMAGE:?set SILO_IMAGE to the upstream Silo image}
    profiles: [silo]
    environment:
      MODE: integrated
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgres://silo:silo@postgres:5432/silo?sslmode=disable
      REDIS_URL: redis://redis-silo:6379
    ports:
      - "127.0.0.1:${SILO_PORT:-18090}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bloem:
    image: ${BLOEM_IMAGE:?set BLOEM_IMAGE to the Bloem image under test}
    profiles: [bloem]
    environment:
      MODE: integrated
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      DATABASE_URL: postgres://silo:silo@postgres:5432/silo?sslmode=disable
      REDIS_URL: redis://redis-bloem:6379
    ports:
      - "127.0.0.1:${BLOEM_PORT:-18091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
